<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2b1d14">
<title>비교 듣기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+KR:wght@400;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4ecdc;--paper2:#fbf6ec;--ink:#22180f;--sub:#6e5f4e;--line:#dccfb8;
  --wood:#3a2618;--wood2:#5a3c26;--esp:#1d140e;--gold:#e2b437;--gold2:#c8961f;--label:#efc33a;
  --a:#1f3a5f;--b:#9a4a2a;--c:#5b6b2f;--ok:#4d7a4f;
  --serif:"Cormorant Garamond","Noto Serif KR",Georgia,serif;
  --kserif:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:16px/1.65 var(--kserif);
  background:radial-gradient(120% 60% at 15% 0%,#f7dfae 0%,rgba(247,223,174,0) 60%),radial-gradient(90% 50% at 100% 30%,#ecd2c0 0%,rgba(236,210,192,0) 65%),linear-gradient(180deg,#f2e7d2,#f4ecdc 45%,#efe3cc);
  background-attachment:fixed;min-height:100vh}
a{color:var(--a)}
button{font-family:inherit}
header{padding:18px 18px 4px;max-width:1040px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font:700 26px/1.2 var(--kserif);margin:0;letter-spacing:-.01em}
h1 a{color:inherit;text-decoration:none}
.brand .en{font:600 13px/1 var(--serif);letter-spacing:.28em;color:var(--sub);text-transform:uppercase}
.lead{font-size:15px;color:var(--sub);margin:6px 0 0;max-width:720px}
.search{width:100%;font:16px var(--kserif);padding:12px 16px;border:1px solid var(--line);border-radius:999px;margin-top:12px;background:var(--paper2);color:var(--ink);box-shadow:inset 0 1px 2px #0000000d}
.search:focus{outline:2px solid var(--gold2);outline-offset:1px}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper2);border-radius:999px;padding:7px 14px;font:15px/1.3 var(--kserif);cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}
.chip.on{background:var(--esp);color:#f6ead0;border-color:var(--esp)}
.chip small{opacity:.65;margin-left:5px;font-size:12px}
.chips.row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.chips.row .chip{flex:none}
main{max-width:1040px;margin:0 auto;padding:0 18px 90px}

/* ---------- crate ---------- */
.crate{margin-top:14px;border-radius:22px;padding:14px 0 16px;color:#f3e6cc;position:relative;overflow:hidden;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,rgba(0,0,0,.03) 2px 7px),linear-gradient(180deg,#4a3120 0%,#2f1f14 62%,#24170f 100%);
  box-shadow:0 14px 30px -14px #2b1a0e99, inset 0 1px 0 #ffffff14}
.az{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;padding:0 12px}
.az button{border:0;background:transparent;color:#f3e6cc;font:600 16px/1 var(--serif);padding:7px 0;border-radius:7px;cursor:pointer;min-width:0}
.az button:disabled{color:#f3e6cc38;cursor:default}
.az button.on{background:var(--label);color:var(--esp)}
.stage{position:relative;height:calc(var(--w) + 34px);perspective:1100px;perspective-origin:50% 45%;margin-top:10px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card{position:absolute;left:50%;top:10px;width:var(--w);height:var(--w);margin-left:calc(var(--w) / -2);
  transition:transform .46s cubic-bezier(.2,.75,.2,1),opacity .3s;cursor:pointer;will-change:transform}
.stage.fast .card{transition:transform .07s linear,opacity .07s}
.card .sleeve{position:absolute;inset:0;border-radius:3px;overflow:hidden;background:#111;box-shadow:0 18px 26px -12px #000c,0 0 0 1px #0006}
.card.side .sleeve::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0000,#0007)}
.card.side.r .sleeve::after{background:linear-gradient(270deg,#0000,#0007)}
.card .disc{position:absolute;top:3%;left:3%;width:94%;height:94%;border-radius:50%;
  background:radial-gradient(circle,var(--dl) 0 17%,#0c0c0c 17.6% 19%,transparent 19.5%),repeating-radial-gradient(circle,#151515 0 1.1px,#070707 1.1px 2.6px);
  box-shadow:0 6px 18px #000a, inset 0 0 0 2px #000;transition:transform .6s cubic-bezier(.2,.75,.2,1);opacity:0}
.card .disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,#fff0 0 10%,#ffffff1c 14%,#fff0 20% 60%,#ffffff14 64%,#fff0 70%)}
.card .disc::after{content:"";position:absolute;left:48.5%;top:48.5%;width:3%;height:3%;border-radius:50%;background:#e9dcc2}
.card.center .disc{opacity:1}
.card.out .disc{transform:translateX(56%) rotate(40deg)}
.card.out.spin .disc{animation:spin 6s linear infinite}
@keyframes spin{from{transform:translateX(56%) rotate(40deg)}to{transform:translateX(56%) rotate(400deg)}}
.card.lift .sleeve{animation:lift .42s ease-out}
@keyframes lift{0%{transform:translateY(0) rotateX(0)}35%{transform:translateY(-7px) rotateX(6deg)}100%{transform:none}}

/* sleeve */
.label{position:absolute;left:0;right:0;top:0;height:47%;background:radial-gradient(130% 120% at 50% 0%,#f8d45a,var(--label) 55%,#e2ad2c);color:#1e140b;
  padding:calc(var(--w)*.045) calc(var(--w)*.06) 0;text-align:center;font-family:var(--serif)}
.label::before{content:"";position:absolute;inset:calc(var(--w)*.022);border:1px solid #6b4a1288;outline:1px solid #6b4a1255;outline-offset:calc(var(--w)*-.014);pointer-events:none}
.label .orn{display:flex;align-items:center;gap:6%;font:600 calc(var(--w)*.034)/1 var(--serif);letter-spacing:.22em;color:#5b3f10;white-space:nowrap;justify-content:center;margin-top:calc(var(--w)*.012)}
.label .orn::before,.label .orn::after{content:"";height:1px;flex:1;max-width:22%;background:linear-gradient(90deg,#5b3f1000,#5b3f10)}
.label .orn::after{background:linear-gradient(270deg,#5b3f1000,#5b3f10)}
.label .cmp{font:700 calc(var(--w)*.082)/1.05 var(--serif);letter-spacing:.06em;text-transform:uppercase;margin-top:calc(var(--w)*.03);overflow-wrap:anywhere}
.label .wk{font:600 calc(var(--w)*.052)/1.12 var(--serif);text-transform:uppercase;letter-spacing:.03em;margin-top:calc(var(--w)*.016);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.label .pf{font:italic 500 calc(var(--w)*.044)/1.15 var(--serif);margin-top:calc(var(--w)*.016);color:#3c2a10;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.art{position:absolute;left:0;right:0;bottom:0;height:53%;overflow:hidden}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.art .jz{position:absolute;left:7%;right:7%;bottom:9%;font-family:Oswald,Impact,sans-serif;font-weight:700;text-transform:uppercase;line-height:.92;letter-spacing:.01em}
.art .jz span{display:block;white-space:nowrap}
.sticker{position:absolute;right:5%;top:41%;width:24%;height:24%;border-radius:50%;z-index:2;transform:rotate(-12deg);
  background:radial-gradient(circle at 35% 30%,#fff3c2,#e8bd4a 45%,#b8861b 100%);box-shadow:0 2px 6px #0008, inset 0 0 0 2px #fff4,inset 0 0 0 calc(var(--w)*.012) #a0741466;
  display:flex;align-items:center;justify-content:center;text-align:center;color:#3a2606;font:700 calc(var(--w)*.04)/1.1 var(--kserif)}

.cap{text-align:center;padding:2px 16px 0;min-height:86px}
.cap .t{font:700 19px/1.35 var(--kserif);color:#fbf0d8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap .s{font-size:15px;color:#e3d2b2;margin-top:2px}
.cap .v{font-size:15px;margin-top:2px;color:#f3e6cc}
.ab{display:inline-block;font:700 12px/1 var(--sans);color:#fff;border-radius:4px;padding:3px 5px;margin-right:4px;vertical-align:1px}
.ab.A{background:var(--a)}.ab.B{background:var(--b)}.ab.C{background:var(--c)}
.crate .ab.A{background:#3d6597}.crate .ab.B{background:#b35d37}
.bar{display:flex;align-items:center;gap:6px;margin:12px auto 0;width:calc(100% - 24px);max-width:520px;background:#120c08e6;border:1px solid #ffffff14;border-radius:999px;padding:6px}
.bar button{border:0;border-radius:999px;font:600 16px/1 var(--kserif);cursor:pointer;padding:12px 10px;color:#f3e6cc;background:transparent;flex:1;white-space:nowrap}
.bar button:disabled{opacity:.3;cursor:default}
.bar button.main{background:var(--label);color:var(--esp);flex:1.3}
.bar .pos{font:600 14px/1 var(--serif);color:#cdb995;flex:none;padding:0 6px;font-variant-numeric:tabular-nums}

/* detail */
.detail{margin:14px 0 0;background:var(--paper2);border:1px solid var(--line);border-radius:22px;padding:16px 18px 18px;box-shadow:0 10px 24px -16px #3a261880}
.detail.hint{text-align:center;color:var(--sub);font-size:15px;padding:14px}
.detail .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.detail .cm{font-size:14px;color:var(--sub)}
.detail h2{font:700 21px/1.35 var(--kserif);margin:2px 0 0}
.detail h2 small{font-weight:400;font-size:16px;color:var(--sub)}
.detail .en{font:italic 500 17px/1.3 var(--serif);color:var(--sub);margin-top:2px}
.pfs{margin:12px 0 0;padding:0;list-style:none}
.pfs li{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-top:1px dashed var(--line)}
.pfs li:first-child{border-top:0}
.pfs .nm{font-weight:700}
.pfs .yr{color:var(--sub);font-size:15px}
.note{margin-top:10px;border-radius:12px;padding:10px 13px;background:#f1e7d3}
.note b{display:block;font-size:13px;color:var(--sub);letter-spacing:.02em;margin-bottom:1px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font:13px/1.4 var(--sans);border-radius:999px;padding:2px 9px;background:#eadfca;color:var(--sub)}
.tag.ready{background:linear-gradient(180deg,#f0cd62,#d7a530);color:#3a2606;font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:11px 16px;font:600 16px/1.2 var(--kserif);cursor:pointer;text-decoration:none;color:#fff;background:var(--esp);flex:1 1 auto;text-align:center}
.btn.A{background:var(--a)}.btn.B{background:var(--b)}.btn.C{background:var(--c)}
.btn.gold{background:var(--label);color:var(--esp)}
.btn.soft{background:transparent;color:var(--ink);border:1px solid var(--line)}
.starb{flex:none;border:1px solid var(--line);background:#fff8e8;border-radius:999px;padding:8px 13px;font:600 15px/1.2 var(--kserif);cursor:pointer;color:var(--ink);white-space:nowrap}
.starb.on{background:#fbe7a6;border-color:#e2b437}
.starb .s{color:#c58b12}

/* list */
.lh{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 6px}
.lh h3{font:700 18px/1.3 var(--kserif);margin:0}
.lh span{font-size:14px;color:var(--sub)}
.rows{background:var(--paper2);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;border-top:1px solid #e8dcc7;background:transparent;padding:10px 14px;cursor:pointer;color:var(--ink);font:16px/1.4 var(--kserif)}
.lrow:first-child{border-top:0}
.lrow.on{background:#f6e3ad}
.lrow .lt{flex:none;width:24px;font:700 18px/1.3 var(--serif);color:var(--gold2);text-align:center}
.lrow .bd{flex:1;min-width:0}
.lrow .w{font-weight:600;overflow-wrap:anywhere}
.lrow .w small{font-weight:400;color:var(--sub)}
.lrow .p{font-size:14px;color:var(--sub);overflow-wrap:anywhere}
.lrow .mk{flex:none;font-size:13px;color:#8a6412;white-space:nowrap;padding-top:2px}
.empty{color:#e3d2b2;text-align:center;padding:40px 16px;font-size:16px}
.empty a{color:var(--label)}

/* ---------- lesson ---------- */
.playerwrap{position:sticky;top:0;z-index:5;padding:8px 18px 10px;max-width:780px;margin:0 auto;background:linear-gradient(180deg,#f2e7d2 80%,#f2e7d200)}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 10px 24px -12px #000a;border:3px solid var(--wood)}
.player iframe,#yt{position:absolute;inset:0;width:100%;height:100%}
.now{font:14px/1.4 var(--sans);color:#f3e6cc;margin-top:6px;min-height:20px;background:var(--esp);border-radius:999px;padding:7px 14px}
.now b{color:#fff}
main.lesson{max-width:780px}
.intro,.step{background:var(--paper2);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin:14px 0;font-family:var(--sans);font-size:16.5px;line-height:1.75;box-shadow:0 8px 20px -18px #3a2618}
.ihead{display:flex;gap:14px;align-items:center}
.mini{position:relative;flex:none;width:var(--w);height:var(--w);border-radius:3px;overflow:hidden;box-shadow:0 8px 14px -8px #000b}
.intro h2{font:700 21px/1.35 var(--kserif);margin:0}
.step h2{font:700 19px/1.4 var(--kserif);margin:0 0 6px;display:flex;gap:10px;align-items:baseline}
.num{font:700 13px/1 var(--serif);color:var(--esp);background:radial-gradient(circle at 35% 30%,#fff1b8,#e2b437 60%,#b98a1f);border-radius:999px;padding:5px 9px;flex:none}
.step.done .num{background:var(--ok);color:#fff}
.lbl{font:700 13px/1.4 var(--sans);letter-spacing:.03em;color:var(--sub);margin:14px 0 3px}
.point{background:#f1e7d3;border-radius:12px;padding:10px 13px;margin-top:4px}
.btns{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.play{flex:1 1 140px;border:0;border-radius:14px;padding:11px 14px;font:600 16px/1.35 var(--sans);color:#fff;cursor:pointer;text-align:left}
.play small{display:block;opacity:.85;font-size:13px;font-weight:400}
.play.A{background:var(--a)}.play.B{background:var(--b)}
.play.heard{outline:3px solid #e2b437;outline-offset:1px}
details{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;font:700 16px/1.5 var(--kserif);color:var(--ink)}
.bars{margin:10px 0 2px}
.bars .br{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.bars .who{width:68px;flex:none;color:var(--sub);overflow-wrap:anywhere}
.bars .fill{height:12px;border-radius:6px}
.bars .v{flex:none;width:52px;font-variant-numeric:tabular-nums}
.src{font-size:14px;color:var(--sub)}
.score{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin-top:4px;background:#fff}
.legend{display:flex;gap:14px;font-size:15px;color:var(--sub);margin-top:10px;flex-wrap:wrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.critic{background:#f7f0e2;border-left:3px solid var(--gold);padding:4px 13px;margin-top:8px;border-radius:0 10px 10px 0}
.hide{display:none!important}

@media (min-width:900px){
  header{padding-top:26px}
  h1{font-size:32px}
  .az{grid-template-columns:repeat(26,1fr);padding:0 22px}
  .crate{padding:18px 0 20px}
  .detail{max-width:760px;margin-left:auto;margin-right:auto}
  .rows{columns:2;column-gap:0}
  .lrow{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  .card,.card .disc{transition-duration:.01ms!important}
  .card.out.spin .disc,.card.lift .sleeve{animation:none!important}
}
</style>
</head>
<body>
<header>
  <div class="brand"><h1><a href="?">비교 듣기</a></h1><span class="en">Compare · Listening</span></div>
  <p class="lead" id="lead"></p>
  <div id="controls"></div>
</header>
<div class="playerwrap hide" id="pw">
  <div class="player"><div id="yt"></div></div>
  <div class="now" id="now">재생할 구간 버튼을 누르세요.</div>
</div>
<main id="main"></main>

<script>
// 데이터는 listen/db/ 에 있다. 새 비교를 더하는 법: listen/CONTRIBUTING.md
const DB = "listen/db/";
const OLD = {brahms:"brahms-op118-2", chopin:"chopin-nocturne-20"};
const GENRE = {all:"전체", classical:"클래식", jazz:"재즈", mine:"내 목록"};
const WHO = ["A","B","C"];
const WIN = 7;
const RM = matchMedia("(prefers-reduced-motion: reduce)");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const paras = a => (a||[]).map(p=>`<p>${md(p)}</p>`).join("");
const fmt = s => { s=Math.round(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const deacc = s => String(s||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"");
const norm = s => deacc(s).toLowerCase().replace(/[\s.,'’·\-()/]/g,"");
const mine = () => { try { return JSON.parse(localStorage.getItem("cl:mine")||"[]"); } catch(_) { return []; } };
const setMine = a => localStorage.setItem("cl:mine", JSON.stringify(a));
const $ = id => document.getElementById(id);

let CAT=null, L=null, lk=null;
let player=null, ready=false, pending=null, cur=null, apiLoaded=false;
const st = {genre:"all", comp:"", q:""};
let ENTS=[], VIEW=[], idx=0, pulled=false, nodes=new Map(), riffleTok=0, startAt="";

/* ---------- 정렬·이름 ---------- */
const surname = e => deacc(String(e.composer.en||"").trim().split(/\s+/).pop());
const letter = e => (surname(e)[0]||"#").toUpperCase();
const cmpE = (a,b) => surname(a).localeCompare(surname(b),"en",{sensitivity:"base"}) || String(a.composer.en).localeCompare(String(b.composer.en),"en") || String(a.work.en).localeCompare(String(b.work.en),"en",{numeric:true}) || String(a.part||"").localeCompare(String(b.part||""),"ko",{numeric:true}) || a.id.localeCompare(b.id);
function entryText(e){ return norm([e.composer.en,e.composer.ko,e.work.en,e.work.ko,e.part,e.contrast,e.listen,...e.performers.map(x=>x.name+" "+(x.en||"")+" "+(x.year||"")),...(e.tags||[])].join(" ")); }
const partOf = e => e.part && e.part!=="전곡" ? e.part : "";
const vsLine = e => e.performers.map((x,i)=>`<span class="ab ${WHO[i]}">${WHO[i]}</span>${esc(x.name)}${x.year?` (${x.year})`:""}`).join(" &nbsp;");
const ytUrl = (e,x) => "https://www.youtube.com/results?search_query="+encodeURIComponent([e.composer.en,e.work.en,x.en||x.name,x.year||""].join(" ").trim());
function issueUrl(t){ return "https://github.com/shinki95/wildtube/issues/new?title="+encodeURIComponent("[비교 듣기] "+t)+"&body="+encodeURIComponent("곡:\n듣고 싶은 두 연주:\n비교하고 싶은 곳 (선택):\n"); }
const reqUrl = e => issueUrl(e.composer.ko+" "+e.work.ko+(e.part?" "+e.part:"")+" 비교 페이지 요청");

/* ---------- 표지 그림 (id로 정해짐) ---------- */
function hash(s){ let h=2166136261; for (const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ let x=seed||1; return ()=>{ x^=x<<13; x^=x>>>17; x^=x<<5; return ((x>>>0)%10000)/10000; }; }
const CL_BG=[["#0d0d0f","#1b1b22"],["#0f1830","#1d2a4a"],["#2a0f17","#47202b"],["#101a18","#1e2f2b"],["#1a120c","#33241a"]];
const CL_AC=["#e2b437","#e9dcc2","#c9a227","#d8c39a","#b8574a"];
const JZ=[["#efe3c8","#1c1a17"],["#c8432b","#f2e6cf"],["#1d2b3a","#eec64f"],["#e7b33a","#1b1b1b"],["#f0e6d2","#b83a26"],["#2a2a2a","#e9e0cc"]];
function artSvg(e){
  const h=hash(e.id), r=rng(h);
  if (e.genre==="jazz"){
    const [bg,ink]=JZ[h%JZ.length], k=h>>4;
    let s=`<rect width="100" height="54" fill="${bg}"/>`;
    if (k%3===0) s+=`<circle cx="${70+r()*20}" cy="${10+r()*10}" r="${16+r()*8}" fill="${ink}"/>`;
    else if (k%3===1) s+=`<rect x="${-10+r()*20}" y="4" width="120" height="${5+r()*4}" fill="${ink}" transform="rotate(${-8+r()*16} 50 27)"/><rect x="0" y="${12+r()*4}" width="100" height="1.6" fill="${ink}"/>`;
    else s+=`<rect x="${58+r()*18}" y="0" width="${8+r()*6}" height="54" fill="${ink}"/><rect x="${80+r()*8}" y="0" width="3" height="54" fill="${ink}"/>`;
    return {svg:s, jz:{ink}};
  }
  const [b1,b2]=CL_BG[h%CL_BG.length], ac=CL_AC[(h>>3)%CL_AC.length], k=(h>>6)%4;
  let s=`<defs><radialGradient id="g${h}" cx="${30+r()*40}%" cy="20%" r="90%"><stop offset="0" stop-color="${b2}"/><stop offset="1" stop-color="${b1}"/></radialGradient></defs><rect width="100" height="54" fill="url(#g${h})"/>`;
  if (k===0){ const cx=15+r()*70, cy=58+r()*14; for(let q=6;q<95;q+=2.6) s+=`<circle cx="${cx}" cy="${cy}" r="${q}" fill="none" stroke="#fff" stroke-opacity="${(0.04+0.06*((q*7)%3)/3).toFixed(3)}" stroke-width=".5"/>`; s+=`<circle cx="${cx}" cy="${cy}" r="${30+r()*14}" fill="none" stroke="${ac}" stroke-opacity=".55" stroke-width=".6" stroke-dasharray="${20+r()*30} 200"/>`; }
  else if (k===1){ const y0=14+r()*16, bend=(r()-.5)*18; for(let q=0;q<5;q++){ const y=y0+q*3.1; s+=`<path d="M-4 ${y} Q 50 ${y+bend} 104 ${y-bend*.6}" fill="none" stroke="${ac}" stroke-opacity=".42" stroke-width=".45"/>`; } const x1=10+r()*30; s+=`<line x1="${x1}" y1="52" x2="${x1+30+r()*40}" y2="${4+r()*8}" stroke="#f3e6cc" stroke-opacity=".75" stroke-width=".7" stroke-linecap="round"/>`; for(let q=0;q<4;q++) s+=`<ellipse cx="${20+q*17+r()*6}" cy="${y0+Math.floor(r()*5)*3.1+bend*.2}" rx="1.5" ry="1.05" fill="${ac}" fill-opacity=".5" transform="rotate(-20)"/>`; }
  else if (k===2){ const ox=20+r()*60; for(let q=0;q<9;q++){ const rr=10+q*5.5+r()*2; s+=`<path d="M ${ox-rr} 56 A ${rr} ${rr*(.75+r()*.4)} 0 0 1 ${ox+rr} 56" fill="none" stroke="${q%3?"#f3e6cc":ac}" stroke-opacity="${q%3?.16:.5}" stroke-width="${q%3?.4:.7}"/>`; } s+=`<circle cx="${ox}" cy="${56-24-r()*14}" r=".9" fill="${ac}"/>`; }
  else { const cx=55+r()*30, cy=30+r()*10, R=30; s+=`<circle cx="${cx+3}" cy="${cy+4}" r="${R}" fill="#000" fill-opacity=".45"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="#080808"/>`; for(let q=8;q<R;q+=1.6) s+=`<circle cx="${cx}" cy="${cy}" r="${q}" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width=".35"/>`; s+=`<circle cx="${cx}" cy="${cy}" r="7" fill="${ac}"/><circle cx="${cx}" cy="${cy}" r=".8" fill="#111"/><path d="M ${cx-R*.7} ${cy-R*.7} A ${R} ${R} 0 0 1 ${cx+R*.2} ${cy-R*.98}" stroke="#fff" stroke-opacity=".22" stroke-width="1.2" fill="none"/>`; }
  return {svg:s};
}
function jazzWords(e,W,ink){
  const words=deacc(e.work.en).replace(/[^A-Za-z0-9 ]/g," ").trim().split(/\s+/).slice(0,3);
  const longest=Math.max(...words.map(w=>w.length),3);
  const fs=Math.min(W*.2, (W*.84)/(longest*.5));
  return `<div class="jz" style="color:${ink};font-size:${fs.toFixed(1)}px">${words.map(w=>`<span>${esc(w)}</span>`).join("")}</div>`;
}
const discColor = e => { const h=hash(e.id); return e.genre==="jazz" ? JZ[h%JZ.length][0] : ["#efc33a","#b8574a","#e9dcc2","#5d7fa8","#c9a227"][(h>>3)%5]; };
function sleeveHTML(e,W){
  const a=artSvg(e);
  const pf=e.performers.map((x,i)=>esc(x.en||x.name)).join(" · ");
  const jz = e.genre==="jazz" ? jazzWords(e,W,a.jz.ink) : "";
  return `<div class="label"><div class="orn">${e.genre==="jazz"?"Jazz":"Compare"} · Listening</div><div class="cmp">${esc(e.composer.en)}</div><div class="wk">${esc(e.work.en)}</div><div class="pf">${pf}</div></div>
    <div class="art"><svg viewBox="0 0 100 54" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${a.svg}</svg>${jz}</div>
    ${e.lesson?`<div class="sticker">비교<br>페이지</div>`:""}`;
}

/* ---------- 시작 ---------- */
async function boot(){
  const p=new URLSearchParams(location.search);
  CAT = await (await fetch(DB+"catalog.json")).json();
  ENTS = CAT.entries.slice().sort(cmpE);
  let l=p.get("l"); if (OLD[l]) l=OLD[l];
  st.genre=GENRE[p.get("g")]?p.get("g"):"all"; st.comp=p.get("c")||""; st.q=p.get("q")||""; startAt=p.get("at")||"";
  if (l && CAT.entries.find(e=>e.lesson===l)) openLesson(l); else home();
}

function sync(){
  const p=new URLSearchParams();
  if (lk) p.set("l",lk); else { if(st.genre!=="all")p.set("g",st.genre); if(st.comp)p.set("c",st.comp); if(st.q)p.set("q",st.q); if(VIEW[idx]&&idx>0)p.set("at",VIEW[idx].id); }
  history.replaceState(null,"",p.toString()?"?"+p:location.pathname);
}

const inG = (e,my) => st.genre==="all" || (st.genre==="mine" ? my.includes(e.id) : e.genre===st.genre);

function filter(first){
  const q=norm(st.q), my=mine();
  VIEW = ENTS.filter(e => inG(e,my) && (!st.comp||e.composer.ko===st.comp) && (!q||entryText(e).includes(q)));

function renderAZ(){

function cardW(){ const vw=Math.min(window.innerWidth,1280); return vw>=900 ? 300 : Math.round(Math.max(190,Math.min(250,vw*.58))); }

function tf(d,W){
  if (d===0) return pulled ? `translate3d(${-W*.24}px,0,30px)` : "translate3d(0,0,0)";
  const s=Math.sign(d), a=Math.abs(d), push=pulled?W*.2:0;
  const x=s*(W*.56+push+(a-1)*W*(W>=300?.2:.14));
  return `translate3d(${x}px,${a*2}px,${-W*.42-(a-1)*24}px) rotateY(${-s*58}deg)`;
}

function renderCrate(){
  const stg=$("stage"); if(!stg) return;
  const W=cardW(); $("crate").style.setProperty("--w",W+"px");
  const none=!VIEW.length;
  ["stage","cap","bar","az"].forEach(i=>$(i).classList.toggle("hide",none));
  $("empty").classList.toggle("hide",!none);
  if (none){
    $("empty").innerHTML = `찾는 판이 아직 없어요.<br><a href="${issueUrl(st.q||"새 비교 요청")}" target="_blank" rel="noopener">이 곡 비교 요청하기</a>`;
    renderDetail(); $("cnt").textContent="0장"; return;
  }
  const keep=new Set();
  for (let d=-WIN; d<=WIN; d++){
    const i=idx+d; if (i<0||i>=VIEW.length) continue;
    const e=VIEW[i]; keep.add(e.id);
    let n=nodes.get(e.id);
    if (!n){
      n=document.createElement("div"); n.className="card"; n.style.setProperty("--dl",discColor(e));
      n.innerHTML=`<div class="disc"></div><div class="sleeve">${sleeveHTML(e,W)}</div>`;
      n.style.transform=tf(d,W); stg.appendChild(n); nodes.set(e.id,n);
    }
    n.dataset.i=i;
    n.style.transform=tf(d,W);
    n.style.zIndex=100-Math.abs(d);
    n.style.opacity = Math.abs(d)>5 ? 0 : 1;
    n.className = "card"+(d===0?" center":" side"+(d>0?" r":""))+(d===0&&pulled?" out"+(RM.matches?"":" spin"):"");
    n.setAttribute("aria-hidden", d===0?"false":"true");
    if (d===0) n.setAttribute("aria-label", `${e.composer.ko} ${e.work.ko} 표지, 누르면 ${pulled?"넣기":"꺼내기"}`);
  }
  nodes.forEach((n,id)=>{ if(!keep.has(id)){ n.remove(); nodes.delete(id); } });
  const e=VIEW[idx], my=mine();
  $("cap").innerHTML = `<div class="t">${esc(e.work.ko)}${partOf(e)?` · ${esc(e.part)}`:""}</div><div class="s">${esc(e.composer.ko)} · ${esc(e.composer.en)}${my.includes(e.id)?" · ★":""}</div><div class="v">${vsLine(e)}</div>`;
  $("pos").textContent = `${idx+1} / ${VIEW.length}`;
  $("prev").disabled = idx<=0; $("next").disabled = idx>=VIEW.length-1;
  $("pull").textContent = pulled ? "넣기" : "꺼내기";
  const curL=letter(e); $("az").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.l===curL));
  $("rows").querySelectorAll(".lrow").forEach(r=>r.classList.toggle("on",+r.dataset.i===idx));
  renderDetail();
}

function renderDetail(){

    <ul class="pfs">${e.performers.map((x,i)=>`<li><span class="ab ${WHO[i]}">${WHO[i]}</span><span><span class="nm">${esc(x.name)}</span>${x.en&&x.en!==x.name?` <span class="yr">${esc(x.en)}</span>`:""}${x.year?` <span class="yr">· ${x.year}</span>`:""}</span></li>`).join("")}</ul>

function renderRows(){

    return `<button class="lrow ${i===idx?"on":""}" data-i="${i}"><span class="lt">${show?l:""}</span><span class="bd"><span class="w">${esc(e.composer.ko)} · ${esc(e.work.ko)}${partOf(e)?` <small>${esc(e.part)}</small>`:""}</span><br><span class="p">${e.performers.map((x,j)=>`${WHO[j]} ${esc(x.name)}${x.year?` ${x.year}`:""}`).join(" / ")}</span></span><span class="mk">${my.includes(e.id)?"★ ":""}${e.lesson?"비교 페이지":""}</span></button>`; }).join("");
}

/* ---------- 넘기기 ---------- */
function step(n){ goTo(idx+n); }
function goTo(t, opt={}){
  if (!VIEW.length) return;
  t=Math.max(0,Math.min(VIEW.length-1,t)); if (t===idx) return;
  const my=++riffleTok, dist=Math.abs(t-idx), keepOut=pulled;
  const finish=()=>{ $("stage").classList.remove("fast"); idx=t; pulled=false; renderCrate(); flick(); sync();
    if (keepOut) setTimeout(()=>{ if(my===riffleTok && VIEW[idx]){ pulled=true; renderCrate(); } }, RM.matches?0:260); };
  if (dist<=1 || RM.matches){ finish(); return; }
  const steps=Math.min(dist-1,12), dir=Math.sign(t-idx), from=idx; pulled=false;
  $("stage").classList.add("fast");
  let k=0;
  const tick=()=>{ if(my!==riffleTok) return; k++; if(k>steps){ finish(); return; }
    idx=from+dir*Math.round(dist*k/(steps+1)); renderCrate(); setTimeout(tick,55); };
  tick();
}
function flick(){ if (RM.matches) return; const n=nodes.get(VIEW[idx]?.id); if(!n) return; n.classList.remove("lift"); void n.offsetWidth; n.classList.add("lift"); setTimeout(()=>n.classList.remove("lift"),450); }
function togglePull(){ if(!VIEW.length) return; riffleTok++; pulled=!pulled; renderCrate();
  if (pulled && window.innerWidth<900) setTimeout(()=>{ const r=$("detail").getBoundingClientRect(); if(r.top>innerHeight-160){ const sg=$("stage").getBoundingClientRect(); window.scrollBy({top:Math.max(0,Math.min(sg.top-6, r.top-innerHeight+200)),behavior:RM.matches?"auto":"smooth"}); } },120); }

function bindStage(){
  const stg=$("stage"); let x0=null, y0=0, moved=false, wheelT=0;
  stg.addEventListener("pointerdown",ev=>{ x0=ev.clientX; y0=ev.clientY; moved=false; });
  stg.addEventListener("pointerup",ev=>{ if(x0===null) return; const dx=ev.clientX-x0, dy=ev.clientY-y0; x0=null;
    if (Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){ moved=true; step(dx<0?Math.min(3,1+Math.floor((Math.abs(dx)-40)/120)):-Math.min(3,1+Math.floor((Math.abs(dx)-40)/120))); } });
  stg.addEventListener("click",ev=>{ if(moved){ moved=false; return; } const c=ev.target.closest(".card"); if(!c) return; const i=+c.dataset.i; if(i===idx) togglePull(); else goTo(i); });
  stg.addEventListener("wheel",ev=>{ if(Math.abs(ev.deltaX)<=Math.abs(ev.deltaY)||Math.abs(ev.deltaX)<8) return; ev.preventDefault(); const t=Date.now(); if(t-wheelT<260) return; wheelT=t; step(ev.deltaX>0?1:-1); },{passive:false});
}
document.addEventListener("keydown",ev=>{
  if (lk || !$("stage") || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")) return;
  if (ev.key==="ArrowLeft"){ ev.preventDefault(); step(-1); } else if (ev.key==="ArrowRight"){ ev.preventDefault(); step(1); }
});
let rzT; window.addEventListener("resize",()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(!lk&&$("stage")){ nodes.forEach(n=>n.remove()); nodes.clear(); renderCrate(); } },150); });

/* ---------- 비교 페이지 ---------- */

}

const store = k => "cl:"+lk+":"+k;

      <a href="${esc(s.score_img)}" target="_blank" rel="noopener"><img class="score" src="${esc(s.score_img)}" alt="악보 ${esc(s.bars_label||"")}" loading="lazy"></a>`:""}
      <div class="lbl">설명</div><div>${md(s.explain)}</div>
      <div class="lbl">들을 포인트</div><div class="point">${md(s.point)}</div>
      <div class="btns">${s.clips.map(([w,a,b],j)=>`<button class="play ${w}" data-i="${i}" data-j="${j}">${w} ${esc(L[w].name)} 듣기<small>${fmt(a)} ~ ${fmt(b)} (${Math.round(b-a)}초)</small></button>`).join("")}</div>
      <details ${done?"open":""}><summary>들은 뒤: 무엇이 달랐나</summary>${paras(s.after)}
        <div class="bars">${s.bars.map(b=>{const m=maxOf(s);return `<div class="lbl" style="margin-top:8px">${esc(b[0])}</div>
          <div class="br"><span class="who">${esc(L.A.name)}</span><span class="fill" style="width:${b[1]/m*65}%;background:var(--a)"></span><span class="v">${b[1]}초</span></div>
          <div class="br"><span class="who">${esc(L.B.name)}</span><span class="fill" style="width:${b[2]/m*65}%;background:var(--b)"></span><span class="v">${b[2]}초</span></div>`}).join("")}</div>
      </details></section>`;
  });
  h += `<section class="step"><h2><span class="num">끝</span>정리와 전곡 듣기</h2>${paras(L.outro)}
    <div class="btns"><button class="play A" data-full="A">A ${esc(L.A.name)} 전곡<small>처음부터 끝까지</small></button><button class="play B" data-full="B">B ${esc(L.B.name)} 전곡<small>처음부터 끝까지</small></button></div>
    <div class="lbl">참고</div><div class="src">${esc(L.measure_note||"")}</div><div class="src">${esc(L.score_credit||"")}</div>
    <div class="src">구간이 어긋나거나 영상이 안 나오면 <a href="${issueUrl(L.short+" 구간/영상 문제")}" target="_blank" rel="noopener">알려 주세요</a>.</div></section>`;
  $("main").innerHTML = h;
}

function play(w, start, end, label){
  const P=L[w]; const opts={videoId:P.youtube, startSeconds:start}; if(end) opts.endSeconds=end;
  cur={label}; $("now").innerHTML = `<b>${w} ${esc(P.full)}</b> · ${esc(label)}`;
  if (!ready){ pending=opts; return; }
  player.loadVideoById(opts);
}

document.addEventListener("click", e=>{
  const o=e.target.closest("[data-open]"); if(o){ e.preventDefault(); openLesson(o.dataset.open); return; }
  const g=e.target.closest("[data-g]"); if(g){ st.genre=g.dataset.g; st.comp=""; renderControls(); filter(); return; }
  const c=e.target.closest("[data-c]"); if(c){ st.comp = (!c.dataset.c||st.comp===c.dataset.c)?"":c.dataset.c; renderControls(); filter(); return; }
  const s=e.target.closest("[data-star]"); if(s){ const a=mine(), id=s.dataset.star; setMine(a.includes(id)?a.filter(x=>x!==id):[...a,id]);
    const mc=$("mc"); if(mc) mc.textContent=mine().length;
    if (st.genre==="mine"){ const keep=idx; filter(); idx=Math.max(0,Math.min(keep,VIEW.length-1)); renderCrate(); sync(); } else { renderCrate(); renderRows(); } return; }
  if (!lk){
    if (e.target.closest("#prev")){ step(-1); return; }
    if (e.target.closest("#next")){ step(1); return; }
    if (e.target.closest("#pull")){ togglePull(); return; }
    const l=e.target.closest("[data-l]"); if(l){ const k=VIEW.findIndex(x=>letter(x)===l.dataset.l); if(k>=0) goTo(k); return; }
    const r=e.target.closest(".lrow"); if(r){ goTo(+r.dataset.i); $("crate").scrollIntoView({behavior:RM.matches?"auto":"smooth",block:"start"}); return; }
  }
  const b=e.target.closest(".play"); if(!b||!L) return;
  if (b.dataset.full){ play(b.dataset.full,0,null,"전곡"); return; }
  const i=+b.dataset.i, j=+b.dataset.j, [w,a,z]=L.steps[i].clips[j];
  b.classList.add("heard");
  play(w, Math.max(0,a), z, `${i+1}. ${L.steps[i].title} (${fmt(a)} ~ ${fmt(z)})`);
  if (document.querySelectorAll(`#s${i} .play.heard`).length >= L.steps[i].clips.length){ localStorage.setItem(store(i),"1"); $("s"+i).classList.add("done"); }
});

function loadApi(){
  if (player){ if(ready) player.cueVideoById(L.A.youtube); return; }
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player("yt", {playerVars:{playsinline:1, rel:0, modestbranding:1}, videoId:L.A.youtube,
      events:{onReady:()=>{ready=true; if(pending){player.loadVideoById(pending); pending=null;}},
              onStateChange:ev=>{ if(ev.data===0 && cur) $("now").innerHTML += " · 끝"; }}});
  };
  if (!apiLoaded){ apiLoaded=true; const sc=document.createElement("script"); sc.src="https://www.youtube.com/iframe_api"; document.head.appendChild(sc); }
}
boot();
</script>
