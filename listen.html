<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>비교 듣기</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1c1a;--sub:#6b665e;--line:#e4dfd6;--a:#2f5d8a;--b:#a0522d;--ok:#3d7a4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{padding:18px 18px 8px;max-width:760px;margin:0 auto}
h1{font-size:21px;margin:0 0 4px}
.tabs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.playerwrap{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 18px 10px;max-width:760px;margin:0 auto}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player iframe,#yt{position:absolute;inset:0;width:100%;height:100%}
.now{font-size:13px;color:var(--sub);margin-top:6px;min-height:20px}
.now b{color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:0 18px 80px}
.intro,.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin:12px 0}
.step h2{font-size:17px;margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.num{font-size:12px;color:#fff;background:var(--ink);border-radius:999px;padding:1px 8px;flex:none}
.step.done .num{background:var(--ok)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--sub);margin:12px 0 2px}
.point{background:#f3efe6;border-radius:10px;padding:9px 12px;margin-top:4px}
.btns{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.play{flex:1 1 140px;border:0;border-radius:10px;padding:11px 12px;font-size:15px;color:#fff;cursor:pointer;text-align:left}
.play small{display:block;opacity:.85;font-size:12px}
.play.A{background:var(--a)}.play.B{background:var(--b)}
.play.heard{outline:3px solid #0002}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--ink)}
.bars{margin:10px 0 2px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.bar .who{width:64px;flex:none;color:var(--sub)}
.bar .fill{height:12px;border-radius:6px}
.bar .v{flex:none;width:52px;font-variant-numeric:tabular-nums}
.src{font-size:13px;color:var(--sub)}
.src a{color:var(--a)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--sub);margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<header>
  <h1>비교 듣기</h1>
  <div class="src">설명을 읽고, 그 부분을 두 연주로 듣고, 들은 뒤 정리를 펼쳐 보세요. 녹음은 유튜브 영상을 그대로 연결해 그 구간만 재생해요.</div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="playerwrap">
  <div class="player"><div id="yt"></div></div>
  <div class="now" id="now">재생할 구간 버튼을 누르세요.</div>
</div>
<main id="main"></main>

<script>
const LESSONS = {
 brahms: {
  tab: "1편 브람스 Op.118-2",
  title: "브람스 인터메초 작품 118의 2번",
  A: {name:"페라이어", full:"머레이 페라이어 (2010)", id:"1y4Iz9Y47Xo"},
  B: {name:"굴드", full:"글렌 굴드 (1960)", id:"7wjqpCh7a4Y"},
  intro: `<p>1893년 여름, 브람스가 오스트리아 바트 이슐에서 쓴 말년의 피아노 소품이에요. 교향곡과 협주곡을 다 쓴 뒤였고, 완성한 원고를 클라라 슈만에게 보내자 클라라는 "작은 크기 안에 감정이 가득하다"고 답했어요. 악보 첫머리에는 안단테 테네라멘테, 걷는 빠르기로 다정하게. 형식은 A-B-A 세 도막이에요.</p>
  <p class="point"><b>오늘의 질문.</b> 전체 길이는 페라이어 5분 10초, 굴드 5분 47초. 굴드가 37초 더 길어요. 그 37초는 어디서 나올까요? 두 녹음을 악보에 맞춰 마디마다 재 봤어요.</p>`,
  steps: [
   {t:"처음 여덟 마디",
    explain:"곡은 세 음짜리 짧은 동기로 시작해요. 한 음 내려갔다가 위로 올라가는 이 작은 몸짓이 곡 전체의 씨앗이고, 뒤에서 계속 모양을 바꿔 돌아와요.",
    point:"첫 두 마디를 어떻게 꺼내는지 들어 보세요. 망설이며 시작하는지, 바로 흘러가는지.",
    clips:[["A",0,24],["B",0,21]],
    after:`<p>첫 두 마디에 페라이어는 5.5초, 굴드는 4.0초를 써요. '느린 굴드'라는 통념과 달리 시작은 굴드가 더 빨라요. 8마디 문장 끝에서는 둘 다 숨을 쉬어요(3.6초, 3.2초).</p><p>처음 48마디 전체도 118초 대 122초로 거의 같아요. 그러니 37초는 아직 나오지 않았어요.</p>`,
    bars:[["첫 두 마디",5.5,4.0],["1~48마디",118,122]]},
   {t:"장조에서 단조로, 엇갈리는 두 손",
    explain:"49마디에서 가장조가 올림바단조로 바뀌고 빠르기도 조금 느려져요(피우 렌토). 이 부분은 오른손이 한 박을 셋으로, 왼손이 둘로 나눠요. 크기가 다른 톱니바퀴 두 개가 맞물려 도는 것처럼, 박의 처음에서만 맞고 그 사이는 계속 어긋나요.",
    point:"먼저 밝던 장조가 어두워지는 순간, 그다음 오른손 셋과 왼손 둘이 서로 다르게 흔들리는 느낌을 들어 보세요.",
    clips:[["A",104.2,139.1],["B",106.8,142.8]],
    after:`<p>이 부분 처음 8마디는 두 사람이 비슷해요(17.9초, 18.9초). 그런데 이 8마디가 한 번 반복될 때 굴드만 느려져요(페라이어 19.1초, 굴드 21.9초). 굴드가 시간을 쓰기 시작하는 곳이 여기예요.</p>`,
    bars:[["처음 8마디",17.9,18.9],["반복 8마디",19.1,21.9]]},
   {t:"57마디, 찬송가 같은 화음",
    explain:"어두운 단조가 57마디에서 올림바장조로 풀리며 찬송가처럼 조용한 화음이 나와요. 악보에는 피아니시모, 그리고 더 느리게. 곡에서 가장 고요한 곳이에요.",
    point:"마디가 지날수록 걸음이 어떻게 바뀌는지 들어 보세요. 일정하게 흐르는지, 점점 멈춰 서는지.",
    clips:[["B",157.1,195.4],["A",150.4,181.6]],
    after:`<p>같은 8마디에 페라이어 24초, 굴드 31초. 굴드는 마디마다 조금씩 더 느려져서 한 마디 3초 남짓이 끝으로 가면 4초를 넘어요. 페라이어는 첫 마디만 길게 잡고 나머지는 거의 일정하게 흘러가요.</p>`,
    bars:[["57~64마디",24,31]]},
   {t:"처음 주제로 돌아오는 길",
    explain:"69마디쯤 크게 부풀었다가 리타르단도(점점 느리게), 그리고 76마디에서 아 템포(원래 빠르기로) 첫 주제가 돌아와요. 이 '느려졌다가 돌아오기'를 얼마나 하느냐가 두 사람의 가장 큰 차이예요.",
    point:"첫 주제가 돌아오는 첫 마디를 잘 들어 보세요. 바로 원래 걸음으로 돌아오는지, 한참 붙잡는지.",
    clips:[["A",190.2,213.2],["B",206.5,243.5]],
    after:`<p>65~75마디에 페라이어 26초, 굴드 39초. 돌아온 첫 마디(76마디)는 페라이어 3.6초, 굴드 6.9초로 거의 두 배예요. 페라이어는 아 템포 지시대로 바로 돌아오고, 굴드는 돌아오기를 주저하듯 첫 음들을 오래 붙잡아요.</p>`,
    bars:[["65~75마디",26,39],["76마디",3.6,6.9]]}
  ],
  outro:`<p><b>정리.</b> 굴드가 길게 치는 건 전체를 느리게 쳐서가 아니라 가운데 끝(찬송가)과 돌아오는 길에 시간을 몰아 쓰기 때문이에요. 페라이어는 빠르기 지시를 더 그대로 따르며 문장의 처음과 끝에서만 숨을 줘요.</p>`,
  more:[["Dave Hurwitz: The Five Greatest Brahms Pianists","https://www.youtube.com/watch?v=G7tedvp9EA8"]]
 },
 chopin: {
  tab: "2편 쇼팽 녹턴 20번",
  title: "쇼팽 녹턴 20번 올림다단조 (유작)",
  A: {name:"조성진", full:"조성진 (2017 실황)", id:"A8zO2KX_VVU"},
  B: {name:"임윤찬", full:"임윤찬 (2023 콘서트헤보우 실황)", id:"rtx3ApCES-g"},
  intro: `<p>1830년 빈에서 쇼팽이 누나 루드비카에게 보낸 곡이고, 쇼팽이 죽고 한참 뒤인 1875년에야 출판됐어요. 쇼팽 스스로 녹턴이라 부르지 않았을 수도 있어서 빠르기말 그대로 '렌토 콘 그란 에스프레시오네(느리게, 깊은 표정으로)'라고도 불러요. 서주, A, B, 다시 A, 코다로 돼 있어요.</p>
  <p>일구쌤 클래식 리뷰에서 진행자는 조성진을 "0.001mm 단위로 미세하게 조절한다", "머리는 차갑게 가슴은 뜨겁게"라고, 임윤찬은 "고무줄을 팽팽하게 당겼다가 살짝 놓는 듯한 리듬의 밀당", "박자 사이 여백을 늘렸다 줄이는 루바토"라고 표현했어요.</p>
  <p class="point"><b>오늘의 질문.</b> 처음부터 마지막 화음까지 임윤찬이 34초쯤 더 길어요. 어디서 시간을 쓸까요? 둘 다 팬이 올린 실황이라 음질이 다르고, 임윤찬 쪽이 조금 멀게 들려요. 소리 크기보다 시간을 들어 보세요.</p>`,
  steps: [
   {t:"어두운 서주, 그리고 노래의 시작",
    explain:"곡은 단조 화음 네 마디의 서주로 조용히 열리고, 그다음 오른손 노래(주제)가 시작돼요.",
    point:"서주 마지막 마디와 노래 첫 음 사이, 그 침묵의 길이를 들어 보세요.",
    clips:[["A",0,37.8],["B",0,43.9]],
    after:`<p>서주 네 마디에 조성진 21초, 임윤찬 26초. 서주 마지막 마디는 6.1초 대 9.5초예요. 임윤찬은 노래를 시작하기 전에 3초 넘게 더 숨을 참아요. 일구쌤이 말한 '고무줄을 당기는 순간'이 바로 이 침묵이에요.</p>`,
    bars:[["서주 4마디",21,26],["서주 마지막 마디",6.1,9.5]]},
   {t:"가운데, 밝아지는 노래",
    explain:"주제가 한 번 지나가고 나면 단조의 어둠이 걷히고 밝은 장조 쪽으로 분위기가 바뀌며, 노래가 조금 더 흘러가는 가운데 부분이 시작돼요.",
    point:"분위기가 바뀌는 순간, 그리고 그 뒤 걸음 속도를 비교해 보세요. 이번엔 임윤찬 먼저.",
    clips:[["B",86.7,128.9],["A",75.8,114.5]],
    after:`<p>21~29마디 여덟 마디에 조성진 26초, 임윤찬 29.5초. 한 마디 평균 3.3초 대 3.8초예요. 가운데 부분 전체로는 임윤찬이 약 23초 더 써요. 오늘 차이 34초의 3분의 2가 여기서 나와요. 조성진은 앞으로 흘리고, 임윤찬은 한 음 한 음 붙잡으며 여백을 넓혀요.</p>`,
    bars:[["21~29마디",26,29.5]]},
   {t:"빠른 음계, 그리고 장조로 끝나는 마지막",
    explain:"처음 노래가 돌아온 뒤, 오른손이 아주 빠르게 올라가는 긴 음계가 나와요. 그리고 곡은 단조가 아니라 올림다장조 화음으로 조용히 끝나요.",
    point:"음계에 뛰어들기 직전 한 번 멈추는지, 그리고 마지막 화음을 얼마나 오래 남기는지 들어 보세요.",
    clips:[["A",182.5,240.6],["B",215.5,267.6]],
    after:`<p>음계 직전 한 마디는 조성진 4.4초, 임윤찬 7.1초. 임윤찬은 뛰어들기 전에 한 번 더 숨을 골라요. 그런데 마지막 네 마디는 거꾸로 조성진 24초, 임윤찬 21초. 조성진은 끝의 여운을 더 길게 남겨요.</p>`,
    bars:[["음계 직전 1마디",4.4,7.1],["마지막 4마디",24,21]]}
  ],
  outro:`<p><b>정리.</b> 임윤찬은 무언가 시작되기 직전(노래 시작 전, 가운데, 음계 직전)에 시간을 써요. 조성진은 흐름을 앞으로 이어 가다가 끝의 여운에 시간을 써요.</p>`,
  more:[["일구쌤 클래식: 이 시대, 조성진을 '직접' 듣는다는 것","https://www.youtube.com/watch?v=82Zz9i3y0Yc"],["일구쌤 클래식: 임윤찬 피아노 리사이틀 리뷰","https://www.youtube.com/watch?v=CkMPTJqnlcg"],["Dave Hurwitz: Chopin's Nocturnes on the Highway to Heaven (Road Music No. 7)","https://www.youtube.com/watch?v=eak62IEzYck"]]
 }
};

const fmt = s => { s=Math.round(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
let player=null, ready=false, pending=null, cur=null;
const params=new URLSearchParams(location.search);
let lk = LESSONS[params.get("l")] ? params.get("l") : "brahms";
const store = k => "cl:"+lk+":"+k;

function render(){
  const L=LESSONS[lk];
  document.getElementById("tabs").innerHTML = Object.entries(LESSONS).map(([k,v])=>`<button class="tab ${k===lk?"on":""}" data-k="${k}">${v.tab}</button>`).join("");
  const maxOf = st => Math.max(...st.bars.flatMap(b=>[b[1],b[2]]));
  let h = `<section class="intro"><h2 style="margin:0 0 6px;font-size:18px">${L.title}</h2>
    <div class="legend"><span><span class="dot" style="background:var(--a)"></span>A ${L.A.full}</span><span><span class="dot" style="background:var(--b)"></span>B ${L.B.full}</span></div>
    ${L.intro}</section>`;
  L.steps.forEach((s,i)=>{
    const done = localStorage.getItem(store(i))==="1";
    h += `<section class="step ${done?"done":""}" id="s${i}"><h2><span class="num">${i+1}</span>${s.t}</h2>
      <div class="lbl">설명</div><div>${s.explain}</div>
      <div class="lbl">들을 포인트</div><div class="point">${s.point}</div>
      <div class="btns">${s.clips.map(([w,a,b],j)=>{const P=L[w];return `<button class="play ${w}" data-i="${i}" data-j="${j}">${w} ${P.name} 듣기<small>${fmt(a)} ~ ${fmt(b)} (${Math.round(b-a)}초)</small></button>`}).join("")}</div>
      <details ${done?"open":""} data-i="${i}"><summary>들은 뒤: 무엇이 달랐나</summary>${s.after}
        <div class="bars">${s.bars.map(b=>{const m=maxOf(s);return `<div class="lbl" style="margin-top:8px">${b[0]}</div>
          <div class="bar"><span class="who">${L.A.name}</span><span class="fill" style="width:${b[1]/m*70}%;background:var(--a)"></span><span class="v">${b[1]}초</span></div>
          <div class="bar"><span class="who">${L.B.name}</span><span class="fill" style="width:${b[2]/m*70}%;background:var(--b)"></span><span class="v">${b[2]}초</span></div>`}).join("")}</div>
      </details></section>`;
  });
  h += `<section class="step"><h2><span class="num">끝</span>정리와 전곡 듣기</h2>${L.outro}
    <div class="btns"><button class="play A" data-full="A">A ${L.A.name} 전곡<small>처음부터 끝까지</small></button><button class="play B" data-full="B">B ${L.B.name} 전곡<small>처음부터 끝까지</small></button></div>
    <div class="lbl">더 보기</div><div class="src">${L.more.map(([t,u])=>`<div><a href="${u}" target="_blank" rel="noopener">${t}</a></div>`).join("")}</div></section>`;
  document.getElementById("main").innerHTML = h;
}

function play(w, start, end, label){
  const L=LESSONS[lk], P=L[w];
  const opts = {videoId:P.id, startSeconds:start};
  if (end) opts.endSeconds = end;
  cur = {label};
  document.getElementById("now").innerHTML = `<b>${w} ${P.full}</b> · ${label}`;
  if (!ready){ pending=opts; return; }
  player.loadVideoById(opts);
  window.scrollTo({top: Math.max(0, window.scrollY), behavior:"smooth"});
}

document.addEventListener("click", e=>{
  const t=e.target.closest(".tab");
  if (t){ lk=t.dataset.k; history.replaceState(null,"","?l="+lk); render(); return; }
  const b=e.target.closest(".play"); if(!b) return;
  const L=LESSONS[lk];
  if (b.dataset.full){ play(b.dataset.full, 0, null, "전곡"); return; }
  const i=+b.dataset.i, j=+b.dataset.j, [w,a,z]=L.steps[i].clips[j];
  b.classList.add("heard");
  play(w, Math.max(0,a), z, `${i+1}. ${L.steps[i].t} (${fmt(a)} ~ ${fmt(z)})`);
  const heard = document.querySelectorAll(`#s${i} .play.heard`).length;
  if (heard >= L.steps[i].clips.length){ localStorage.setItem(store(i),"1"); document.getElementById("s"+i).classList.add("done"); }
});

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("yt", {playerVars:{playsinline:1, rel:0, modestbranding:1}, videoId: LESSONS[lk].A.id,
    events:{onReady:()=>{ready=true; if(pending){player.loadVideoById(pending); pending=null;}},
            onStateChange:ev=>{ if(ev.data===0 && cur) document.getElementById("now").innerHTML += " · 끝"; }}});
};
render();
const s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; document.head.appendChild(s);
</script>
</body>
</html>
