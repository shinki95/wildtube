<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>야생 피드</title>
<style>
  :root{--bg:#fff;--fg:#0f1419;--sub:#737373;--line:#efefef;--soft:#fafafa;--ig:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif}
  a{color:inherit}
  .app{max-width:470px;margin:0 auto;min-height:100vh;padding-bottom:70px}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;border-bottom:1px solid var(--line)}
  .logo{font:italic 800 25px/1 Georgia,"Times New Roman",serif;letter-spacing:-.5px;background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hx{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--sub)}
  .hx button{border:0;background:none;font-size:20px;cursor:pointer;padding:0}
  /* stories */
  .stories{display:flex;gap:14px;overflow-x:auto;padding:12px 12px 10px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .stories::-webkit-scrollbar{display:none}
  .st{flex:0 0 auto;width:70px;text-align:center;cursor:pointer;border:0;background:none;padding:0;color:inherit}
  .ring{width:66px;height:66px;border-radius:50%;padding:3px;background:var(--ig);margin:0 auto}
  .ring.seen{background:#dbdbdb}
  .ring>div{width:100%;height:100%;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:24px;background-size:cover;background-position:center;color:#fff;font-weight:700}
  .st .n{font-size:11.5px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st .p{font-size:10.5px;color:var(--sub)}
  /* chips */
  .chips{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid #dbdbdb;background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--fg);color:#fff;border-color:var(--fg)}
  /* post */
  .post{border-bottom:1px solid var(--line);padding-bottom:12px}
  .ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
  .av{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;padding:2px;background:var(--ig)}
  .av>span{width:100%;height:100%;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
  .who{font-weight:700;font-size:14px;line-height:1.2}
  .who small{display:block;font-weight:400;color:var(--sub);font-size:12px}
  .new{margin-left:auto;font-size:11px;font-weight:700;color:#fff;background:#ff3040;border-radius:6px;padding:2px 6px}
  .media{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff}
  .media.v{aspect-ratio:16/9;background:#000}
  .media img{width:100%;height:100%;object-fit:cover;display:block}
  .media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .play b{width:62px;height:62px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:24px;padding-left:4px}
  .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);font-size:12px;padding:2px 6px;border-radius:4px}
  .card{padding:28px 26px;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center}
  .card .k{font-size:12.5px;font-weight:700;letter-spacing:.3px;opacity:.85;margin-bottom:12px}
  .card .t{font-size:23px;line-height:1.34;font-weight:800;letter-spacing:-.4px;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
  .card .t.q::before{content:"Q.";display:block;font-size:34px;opacity:.5;margin-bottom:4px}
  .card .f{margin-top:16px;font-size:13px;opacity:.85}
  .acts{display:flex;align-items:center;gap:16px;padding:10px 12px 4px;font-size:24px}
  .acts button{border:0;background:none;padding:0;font-size:24px;cursor:pointer;line-height:1;color:var(--fg)}
  .acts .r{margin-left:auto}
  .acts .on.lk{color:#ff3040}
  .cap{padding:2px 12px;font-size:14px;white-space:pre-wrap;word-break:keep-all}
  .cap b{font-weight:700}
  .cap .more{color:var(--sub);cursor:pointer;border:0;background:none;padding:0;font-size:14px}
  .cmt{padding:4px 12px;font-size:13.5px;color:var(--sub);cursor:pointer}
  .cl{padding:2px 12px 2px;font-size:14px}
  .cl div{margin:6px 0;padding-left:10px;border-left:2px solid var(--line)}
  .cl .ans{color:#262626}
  .lnk{padding:6px 12px 0;display:flex;gap:8px;flex-wrap:wrap}
  .lnk a,.lnk button{font-size:12.5px;font-weight:600;text-decoration:none;border:1px solid #dbdbdb;border-radius:8px;padding:5px 10px;background:#fff;cursor:pointer;color:var(--fg)}
  .scenes{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap}
  .scenes button{border:0;background:#efefef;border-radius:8px;padding:5px 9px;font-size:12.5px;cursor:pointer}
  .time{padding:4px 12px 0;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.2px}
  .end{padding:40px 24px 30px;text-align:center}
  .end .ok{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;background:var(--ig);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px}
  .end h3{margin:6px 0;font-size:18px}
  .end p{color:var(--sub);margin:4px 0 16px;font-size:14px}
  .btn{display:inline-block;background:#0095f6;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
  .btn.g{background:#efefef;color:var(--fg)}
  /* nav */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav .in{max-width:470px;margin:0 auto;display:flex;justify-content:space-around;padding:9px 0 8px}
  nav button,nav a{border:0;background:none;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-decoration:none}
  nav i{font-style:normal;font-size:22px;line-height:1;color:var(--fg)}
  nav .on{color:var(--fg);font-weight:700}
  /* reels */
  .reels{position:fixed;inset:0;z-index:25;background:#000;overflow-y:auto;scroll-snap-type:y mandatory;display:none}
  .reels.on{display:block}
  .rl{height:100vh;height:100dvh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
  .rl .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(28px) brightness(.45);transform:scale(1.2)}
  .rl .frame{position:relative;width:100%;max-width:470px;aspect-ratio:16/9;background:#000;cursor:pointer}
  .rl .frame img{width:100%;height:100%;object-fit:cover}
  .rl .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .rl .txt{position:relative;max-width:470px;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:40px 28px 150px}
  .rl .txt .t{font-size:27px;font-weight:800;line-height:1.33;letter-spacing:-.5px;word-break:keep-all}
  .rl .txt .b{font-size:15px;line-height:1.55;margin-top:18px;opacity:.92;word-break:keep-all;max-height:38vh;overflow:auto;padding-right:44px}
  .rl .meta{position:absolute;left:0;right:64px;bottom:0;padding:16px 16px calc(78px + env(safe-area-inset-bottom));max-width:470px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .rl .meta b{font-size:14px}
  .rl .meta p{margin:6px 0 0;font-size:13.5px;opacity:.92;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .rl .side{position:absolute;right:10px;bottom:calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px;align-items:center}
  .rl .side button,.rl .side a{border:0;background:none;color:#fff;font-size:27px;cursor:pointer;text-decoration:none;display:flex;flex-direction:column;align-items:center;font-size:27px;line-height:1}
  .rl .side small{font-size:11px;margin-top:3px}
  .rl .side .on.lk{color:#ff3040}
  .rclose{position:fixed;top:12px;right:16px;z-index:26;color:#fff;font:italic 800 22px Georgia,serif;display:none}
  .reels.on~.rclose{display:block}
  /* story viewer */
  .sv{position:fixed;inset:0;z-index:40;background:#111;display:none;color:#fff}
  .sv.on{display:flex;justify-content:center}
  .sv .box{position:relative;width:100%;max-width:470px;height:100%}
  .sv .bars{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;z-index:3}
  .sv .bars i{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
  .sv .bars i b{display:block;height:100%;width:0;background:#fff}
  .sv .top{position:absolute;top:18px;left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:3;font-size:14px;font-weight:700}
  .sv .top button{margin-left:auto;border:0;background:none;color:#fff;font-size:26px;cursor:pointer}
  .sv .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:70px 26px 110px}
  .sv .slide .t{font-size:26px;font-weight:800;line-height:1.35;letter-spacing:-.4px;word-break:keep-all}
  .sv .slide .b{margin-top:16px;font-size:15px;line-height:1.55;opacity:.93;word-break:keep-all;max-height:45vh;overflow:hidden}
  .sv .slide .vthumb{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;background:#000}
  .sv .slide .vthumb img{width:100%;height:100%;object-fit:cover}
  .sv .slide .vthumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .sv .tap{position:absolute;top:60px;bottom:110px;width:35%;z-index:2}
  .sv .tap.l{left:0}.sv .tap.r{right:0}
  .sv .cta{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));text-align:center;z-index:3}
  .sv .cta a,.sv .cta button{display:inline-block;border:1px solid rgba(255,255,255,.6);color:#fff;background:rgba(255,255,255,.12);border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;text-decoration:none;margin:0 4px;cursor:pointer}
  /* saved grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  .grid .g{aspect-ratio:1/1;overflow:hidden;position:relative;cursor:pointer;color:#fff;font-size:12px;font-weight:700;padding:8px;display:flex;align-items:flex-end;background-size:cover;background-position:center}
  .empty{padding:60px 30px;text-align:center;color:var(--sub)}
  .toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);background:#262626;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .keybox{padding:40px 24px;text-align:center}
  .keybox input{width:100%;padding:12px;border:1px solid #dbdbdb;border-radius:8px;margin:12px 0;font-size:15px}
  .sk{height:440px;background:linear-gradient(90deg,#f3f3f3,#fafafa,#f3f3f3);background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}
  @keyframes sk{to{background-position:-200% 0}}
  @media (min-width:900px){ .app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">야생</div>
    <div class="hx"><span id="built"></span><button id="refresh" title="새로고침">↻</button></div>
  </header>
  <div class="stories" id="stories"></div>
  <div class="chips" id="chips"></div>
  <main id="main"><div class="sk"></div><div class="sk"></div></main>
</div>
<div class="reels" id="reels"></div>
<div class="rclose" id="rclose">야생</div>
<div class="sv" id="sv"></div>
<nav><div class="in">
  <button data-tab="home" class="on"><i>⌂</i>홈</button>
  <button data-tab="reels"><i>▶</i>릴스</button>
  <button data-tab="saved"><i>⚑</i>저장</button>
  <a href="./"><i>◎</i>퀘스트</a>
</div></nav>
<div class="toast" id="toast"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwQr12XmnLV5E-u6FDC0jC-7TpDzmBLmhaOAZfzztkl47yARxnEWLtPv3w5JgC94A94/exec';
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get(k,d){ try { return JSON.parse(localStorage.getItem('wt2:'+k)) ?? d } catch { return d } }, set(k,v){ try { localStorage.setItem('wt2:'+k, JSON.stringify(v)) } catch {} } };
const fmt = t => `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
(() => { const u = new URL(location.href); const k = u.searchParams.get('k'); if (k) { LS.set('key', k); u.searchParams.delete('k'); history.replaceState(null, '', u.pathname + u.search + u.hash); } })();
const KEY = LS.get('key', '');
const FROM = new URL(location.href).searchParams.get('from');

let FEED = LS.get('feed', null);
let QUEUE = LS.get('fq', []);
const R = LS.get('react', {});          // id -> {like:1, save:1, meh:1}
const SEEN = new Set(LS.get('seenIds', []));
const LAST = LS.get('lastVisit', 0);
let TAB = 'home', FILTER = 'all';

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }

// ---------- data ----------
async function pull(){
  if (!KEY) return;
  try {
    const d = await (await fetch(`${API}?k=${encodeURIComponent(KEY)}`)).json();
    if (!d.ok) { if (d.err==='key') toast('키가 맞지 않아요'); return; }
    const parts = d.topics.filter(t => /^_feed_\d+$/.test(t.slug) && t.part).sort((a,b)=> +a.slug.split('_')[2] - +b.slug.split('_')[2]);
    const n = parts[0]?.n || parts.length;
    const s = parts.slice(0, n).map(p=>p.part).join('');
    const f = JSON.parse(s);
    // 서버에 남은 반응을 기기 반응과 합침
    for (const [id, ts] of Object.entries(f.reacted || {})) { R[id] = R[id] || {}; for (const t of ts) { if (t.startsWith('un')) delete R[id][t.slice(2)]; else R[id][t] = 1; } }
    LS.set('react', R);
    FEED = f; LS.set('feed', f); render();
  } catch(e){ console.warn(e); }
}
async function flush(){
  if (!KEY || !QUEUE.length) return;
  const batch = QUEUE.slice();
  try {
    const d = await (await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ k: KEY, a: 'events', events: batch }) })).json();
    if (d.ok) { QUEUE = QUEUE.filter(e => !batch.includes(e)); LS.set('fq', QUEUE); }
  } catch {}
}
function react(id, type){
  R[id] = R[id] || {};
  const on = !R[id][type];
  if (on) R[id][type] = 1; else delete R[id][type];
  LS.set('react', R);
  QUEUE.push({ id: Math.random().toString(36).slice(2,10), topic: '_feed', video: id, type: on ? type : 'un'+type, text: '', by: 'me' });
  LS.set('fq', QUEUE); flush();
  return on;
}

// ---------- mixing ----------
const SEC_COLORS = [
  [/AI 실전|클로드팀|중요/, ['#4f46e5','#9333ea']],
  [/논문/, ['#0f766e','#0891b2']],
  [/생각의 도구|탐색 줄기/, ['#b45309','#db2777']],
  [/소비|리테일/, ['#e11d48','#f97316']],
  [/세상 읽기/, ['#1e3a8a','#334155']],
  [/리더십|권력/, ['#7c2d12','#a16207']],
];
function secGrad(sec){ const m = SEC_COLORS.find(([re]) => re.test(sec||'')); const [a,b] = m ? m[1] : ['#374151','#6b7280']; return `linear-gradient(135deg,${a},${b})`; }
const ASK_GRADS = ['linear-gradient(135deg,#f09433,#dc2743,#bc1888)','linear-gradient(135deg,#833ab4,#fd1d1d)','linear-gradient(135deg,#0ea5e9,#6366f1)','linear-gradient(135deg,#16a34a,#0d9488)','linear-gradient(135deg,#f59e0b,#ef4444)'];
const hash = s => { let h=0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0))|0; return Math.abs(h); };
const thumb = v => `https://i.ytimg.com/vi/${v}/hqdefault.jpg`;
const embed = (v, t=0) => `https://www.youtube-nocookie.com/embed/${v}?start=${t}&autoplay=1&playsinline=1&rel=0&modestbranding=1`;

function items(){
  if (!FEED) return [];
  const all = [...FEED.asks, ...FEED.reads, ...FEED.videos].filter(x => !(R[x.id]||{}).meh);
  if (FILTER !== 'all') return all.filter(x => x.kind === FILTER).sort((a,b)=>(b.ts||0)-(a.ts||0));
  // 섞기: 물어본 것(최근) 먼저 2개, 그 뒤 영상·읽을거리·물어본 것 번갈아. 좋아요 받은 결 앞으로.
  const asks = FEED.asks.filter(x=>!(R[x.id]||{}).meh);
  const reads = FEED.reads.filter(x=>!(R[x.id]||{}).meh);
  const likedSec = new Set(reads.filter(r=>(R[r.id]||{}).like||(R[r.id]||{}).save).map(r=>r.section.split(' · ')[0]));
  reads.sort((a,b)=> (likedSec.has(b.section.split(' · ')[0]) - likedSec.has(a.section.split(' · ')[0])) || (b.ts-a.ts));
  const vids = FEED.videos.filter(x=>!(R[x.id]||{}).meh).sort((a,b)=> (SEEN.has(a.id)-SEEN.has(b.id)) || (hash(a.id+FEED.built)%97 - hash(b.id+FEED.built)%97));
  const out = []; const q = [asks.slice(0,2)];
  out.push(...asks.splice(0,2));
  while (asks.length || reads.length || vids.length) {
    if (vids.length) out.push(vids.shift());
    if (reads.length) out.push(reads.shift());
    if (reads.length) out.push(reads.shift());
    if (asks.length) out.push(asks.shift());
  }
  return out;
}
const isNew = x => x.ts && x.ts*1000 > LAST && !SEEN.has(x.id);
function ago(ts){ if(!ts) return ''; const s=(Date.now()/1000-ts); if(s<3600) return Math.max(1,Math.round(s/60))+'분 전'; if(s<86400) return Math.round(s/3600)+'시간 전'; return Math.round(s/86400)+'일 전'; }

// ---------- render ----------
function render(){
  if (!KEY) { $('#main').innerHTML = `<div class="keybox"><div class="logo" style="font-size:40px">야생</div><p>처음 한 번만 슬랙 #25-야생학습의 야생튜브 링크(키 포함)를 열어 주세요. 또는 키를 붙여 넣어요.</p><input id="kin" placeholder="키"><button class="btn" id="ksave">저장</button></div>`; $('#ksave').onclick=()=>{ LS.set('key', $('#kin').value.trim()); location.reload(); }; return; }
  if (!FEED) return;
  $('#built').textContent = FEED.built.slice(5).replace('-','/') + ' 기준';
  renderStories(); renderChips();
  if (TAB === 'home') renderHome(); else if (TAB === 'saved') renderSaved();
  if (TAB === 'reels') renderReels();
}
function renderStories(){
  const today = FEED.asks.filter(a => Date.now()/1000 - a.ts < 36*3600);
  const st = [];
  st.push({ key:'asks', name:'오늘 물어본 것', icon:'?', bg:'linear-gradient(135deg,#f09433,#bc1888)', seen: today.every(a=>SEEN.has(a.id)), p: today.length+'개' });
  st.push({ key:'reads', name:'읽을거리', icon:'¶', bg:'linear-gradient(135deg,#4f46e5,#9333ea)', seen: FEED.reads.slice(0,10).every(a=>SEEN.has(a.id)), p: FEED.reads.filter(r=>Date.now()/1000-r.ts<36*3600).length+'개 새로' });
  for (const t of FEED.topics) {
    const v = FEED.videos.find(x=>x.topic===t.slug);
    st.push({ key:'t:'+t.slug, name:t.title.split(' · ')[0], img: v ? thumb(v.vid) : '', icon: t.title[0], bg:'#999', seen: FEED.videos.filter(x=>x.topic===t.slug).every(x=>SEEN.has(x.id)), p: `${t.done}/${t.total}` });
  }
  $('#stories').innerHTML = st.map(s => `<button class="st" data-st="${esc(s.key)}"><div class="ring ${s.seen?'seen':''}"><div style="${s.img?`background-image:url(${s.img})`:`background:${s.bg}`}">${s.img?'':esc(s.icon)}</div></div><div class="n">${esc(s.name)}</div><div class="p">${esc(s.p)}</div></button>`).join('');
  $('#stories').querySelectorAll('[data-st]').forEach(b => b.onclick = () => openStory(b.dataset.st));
}
function renderChips(){
  const c = [['all','전체'],['ask','물어본 것'],['video','영상'],['read','읽을거리']];
  $('#chips').innerHTML = c.map(([k,n]) => `<button class="chip ${FILTER===k?'on':''}" data-f="${k}">${n}</button>`).join('');
  $('#chips').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { FILTER = b.dataset.f; render(); scrollTo(0,0); });
}
function acts(x){
  const r = R[x.id] || {};
  const share = x.kind==='ask' ? x.link : x.kind==='read' ? (x.url||x.thread) : `https://youtu.be/${x.vid}`;
  return `<div class="acts"><button data-a="like" class="${r.like?'on lk':''}" title="좋아요">${r.like?'♥':'♡'}</button><button data-a="note" title="스레드로">💬</button><a href="${esc(share)}" target="_blank" rel="noopener" style="text-decoration:none;font-size:22px" title="원문">↗</a><button data-a="meh" title="별로, 숨기기" style="font-size:19px;color:#8e8e8e">✕</button><button data-a="save" class="r ${r.save?'on':''}" title="저장">${r.save?'⚑':'⚐'}</button></div>`;
}
function postHTML(x){
  const nw = isNew(x) ? '<span class="new">새로</span>' : '';
  if (x.kind === 'ask') {
    const a = x.a || (x.follow.find(f=>f.a)||{}).a || '';
    const g = ASK_GRADS[hash(x.id)%ASK_GRADS.length];
    return `<article class="post" data-id="${esc(x.id)}">
      <div class="ph"><div class="av"><span>나</span></div><div class="who">내가 물어본 것<small>#${esc(x.ch)} · ${ago(x.ts)}</small></div>${nw}</div>
      <div class="media" style="background:${g}" data-open="${esc(x.link)}"><div class="card">${x.ctx?`<div class="k">${esc(x.ctx)}</div>`:''}<div class="t q">${esc(x.q)}</div>${x.follow.length?`<div class="f">이어서 ${x.follow.length}개 더 물어봄</div>`:''}</div></div>
      ${acts(x)}
      ${a ? `<div class="cap"><b>Aside</b> <span class="cx" data-full="${esc(a)}">${esc(a.slice(0,140))}${a.length>140?'… <button class="more">더 보기</button>':''}</span></div>` : '<div class="cap" style="color:#8e8e8e">아직 답 없음</div>'}
      ${x.follow.length ? `<div class="cmt" data-cm>이어진 질문 ${x.follow.length}개 모두 보기</div><div class="cl" hidden>${x.follow.map(f=>`<div><b>나</b> ${esc(f.q)}${f.a?`<br><span class="ans"><b>Aside</b> ${esc(f.a.slice(0,220))}${f.a.length>220?'…':''}</span>`:''}</div>`).join('')}</div>` : ''}
      <div class="time">${esc(x.day)}</div></article>`;
  }
  if (x.kind === 'read') {
    const cap = [x.what, x.num ? '숫자: '+x.num : '', x.why ? '왜 볼 만한가: '+x.why : ''].filter(Boolean).join('\n\n');
    return `<article class="post" data-id="${esc(x.id)}">
      <div class="ph"><div class="av" style="background:${secGrad(x.section)}"><span>${esc((x.section||'읽')[0])}</span></div><div class="who">${esc(x.section)}<small>${esc(x.src||x.ch)} · ${ago(x.ts)}</small></div>${nw}</div>
      <div class="media" style="${x.img?`background:linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(0,0,0,.82)),url('${esc(x.img)}') center/cover,${secGrad(x.section)}`:`background:${secGrad(x.section)}`}" data-open="${esc(x.url||x.thread)}"><div class="card" style="${x.img?'justify-content:flex-end':''}"><div class="k">#${esc(x.ch)} · ${esc(x.src)}</div><div class="t" style="${x.img?'font-size:20px;text-shadow:0 1px 8px rgba(0,0,0,.5)':''}">${esc(x.title)}</div></div></div>
      ${acts(x)}
      ${cap ? `<div class="cap"><span class="cx" data-full="${esc(cap)}">${esc(cap.slice(0,150))}${cap.length>150?'… <button class="more">더 보기</button>':''}</span></div>` : ''}
      ${x.replies ? `<div class="cmt" data-open="${esc(x.thread)}">스레드 댓글 ${x.replies}개 보기</div>` : ''}
      <div class="lnk">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">원문 읽기</a>`:''}<a href="${esc(x.thread)}" target="_blank" rel="noopener">슬랙에서 이야기하기</a></div>
      <div class="time">${esc(x.day)}</div></article>`;
  }
  // video
  return `<article class="post" data-id="${esc(x.id)}">
    <div class="ph"><div class="av"><span style="background:url(${thumb(x.vid)}) center/cover"></span></div><div class="who">${esc(x.topicTitle.split(' · ')[0])}<small>${esc(x.channel)} · 퀘스트 ${esc(x.quest)}</small></div>${nw}</div>
    <div class="media v" data-vid="${esc(x.vid)}"><img loading="lazy" src="${thumb(x.vid)}" alt=""><div class="play"><b>▶</b></div>${x.minutes?`<span class="dur">${x.minutes}분</span>`:''}</div>
    ${acts(x)}
    <div class="cap"><b>${esc(x.title)}</b>${x.look?`\n<span style="color:#262626">볼 곳: ${esc(x.look)}</span>`:''}</div>
    ${x.scenes?.length ? `<div class="scenes">${x.scenes.map(s=>`<button data-seek="${s.t}">${fmt(s.t)} ${esc(s.label)}</button>`).join('')}</div>` : ''}
    <div class="lnk"><a href="./#${esc(x.topic)}">퀘스트판에서 노트 남기기</a></div>
    <div class="time">${esc(x.questTitle)}</div></article>`;
}
let shown = 0, LIST = [];
function renderHome(){
  LIST = items(); shown = 0;
  $('#main').innerHTML = '';
  more();
}
function more(){
  const chunk = LIST.slice(shown, shown + 8); shown += chunk.length;
  const box = document.createElement('div'); box.innerHTML = chunk.map(postHTML).join('');
  if (shown >= LIST.length) box.innerHTML += endHTML();
  $('#main').appendChild(box); wire(box); observeSeen(box);
}
function endHTML(){
  const t = FEED.topics.find(t=>t.status==='active');
  return `<div class="end"><div class="ok">✓</div><h3>오늘 피드는 여기까지예요</h3><p>더 내릴 건 없어요. 본 것 하나를 해 보는 쪽으로 갈까요?</p>${t?`<a class="btn" href="./#${esc(t.slug)}">「${esc(t.title.split(' · ')[0])}」 다음 퀘스트</a>`:''} <button class="btn g" onclick="openStory('asks')">오늘 물어본 것 다시 보기</button></div>`;
}
function wire(root){
  root.querySelectorAll('.more').forEach(b => b.onclick = e => { const s = e.target.closest('.cx'); s.textContent = s.dataset.full; });
  root.querySelectorAll('[data-cm]').forEach(b => b.onclick = () => { b.nextElementSibling.hidden = !b.nextElementSibling.hidden; });
  root.querySelectorAll('[data-open]').forEach(b => b.onclick = e => { if (e.target.closest('button,a')) return; window.open(b.dataset.open, '_blank'); });
  root.querySelectorAll('[data-vid]').forEach(m => m.onclick = () => playIn(m, m.dataset.vid, 0));
  root.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => { const m = b.closest('.post').querySelector('[data-vid]'); playIn(m, m.dataset.vid, +b.dataset.seek); });
  root.querySelectorAll('.acts [data-a]').forEach(b => b.onclick = () => {
    const post = b.closest('[data-id]'); const id = post.dataset.id; const a = b.dataset.a;
    const x = [...FEED.asks, ...FEED.reads, ...FEED.videos].find(i=>i.id===id);
    if (a === 'note') { window.open(x.kind==='video' ? `./#${x.topic}` : (x.link||x.thread), '_blank'); return; }
    const on = react(id, a);
    if (a === 'meh') { post.style.transition='.3s'; post.style.opacity=0; setTimeout(()=>post.remove(),300); toast('이런 건 덜 보여 드릴게요'); return; }
    if (a === 'like') { b.textContent = on?'♥':'♡'; b.classList.toggle('on',on); b.classList.toggle('lk',on); }
    if (a === 'save') { b.textContent = on?'⚑':'⚐'; b.classList.toggle('on',on); if (on) toast('저장했어요. 아래 저장 탭에서 모아 봐요'); }
  });
  root.querySelectorAll('.media').forEach(m => m.addEventListener('dblclick', () => { const id = m.closest('[data-id]').dataset.id; if (!(R[id]||{}).like) { react(id,'like'); const b = m.closest('.post').querySelector('[data-a=like]'); b.textContent='♥'; b.classList.add('on','lk'); } toast('♥'); }));
}
function playIn(m, vid, t){
  document.querySelectorAll('.media.v iframe, .frame iframe').forEach(f => { if (!m.contains(f)) f.remove(); });
  m.innerHTML = `<iframe src="${embed(vid,t)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  const id = m.closest('[data-id]')?.dataset.id; if (id) markSeen(id);
}
function markSeen(id){ if (SEEN.has(id)) return; SEEN.add(id); LS.set('seenIds', [...SEEN].slice(-2000)); }
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && e.intersectionRatio > .6) { const id = e.target.dataset.id; setTimeout(()=>{ if (e.target.isConnected) markSeen(id); }, 1500); } }), { threshold: [.6] });
function observeSeen(root){ root.querySelectorAll('[data-id]').forEach(p => io.observe(p)); }
const sentinel = new IntersectionObserver(es => { if (TAB==='home' && es[0].isIntersecting && shown < LIST.length) more(); }, { rootMargin: '600px' });

function renderSaved(){
  const all = [...FEED.asks, ...FEED.reads, ...FEED.videos].filter(x => (R[x.id]||{}).save);
  if (!all.length) { $('#main').innerHTML = `<div class="empty">저장한 게 아직 없어요.<br>게시물 오른쪽 ⚐ 를 누르면 여기 모여요.</div>`; return; }
  $('#main').innerHTML = `<div class="grid">${all.map(x => {
    const bg = x.kind==='video' ? `background-image:linear-gradient(transparent 50%,rgba(0,0,0,.7)),url(${thumb(x.vid)})` : x.img ? `background-image:linear-gradient(transparent 40%,rgba(0,0,0,.75)),url('${esc(x.img)}')` : `background:${x.kind==='read'?secGrad(x.section):ASK_GRADS[hash(x.id)%ASK_GRADS.length]}`;
    const t = x.kind==='video' ? x.title : x.kind==='read' ? x.title : x.q;
    return `<div class="g" style="${bg}" data-go="${esc(x.id)}">${esc(t.slice(0,48))}</div>`; }).join('')}</div>`;
  $('#main').querySelectorAll('[data-go]').forEach(g => g.onclick = () => { FILTER='all'; TAB='home'; setNav(); LIST=[...FEED.asks,...FEED.reads,...FEED.videos].filter(x=>x.id===g.dataset.go); shown=0; $('#main').innerHTML=''; more(); });
}

// ---------- reels ----------
function renderReels(){
  const L = items().filter(x => x.kind==='video' || x.kind==='read' || x.kind==='ask');
  const el = $('#reels');
  el.innerHTML = L.map(x => {
    const r = R[x.id]||{};
    const side = `<div class="side"><button data-a="like" class="${r.like?'on lk':''}">${r.like?'♥':'♡'}<small>좋아요</small></button><button data-a="save" class="${r.save?'on':''}">${r.save?'⚑':'⚐'}<small>저장</small></button><a href="${esc(x.kind==='video'?'./#'+x.topic:(x.link||x.thread))}" target="_blank">💬<small>노트</small></a><button data-a="meh">✕<small>별로</small></button></div>`;
    if (x.kind === 'video') return `<section class="rl" data-id="${esc(x.id)}"><div class="bgimg" style="background-image:url(${thumb(x.vid)})"></div><div class="frame" data-vid="${esc(x.vid)}"><img loading="lazy" src="${thumb(x.vid)}"><div class="play"><b>▶</b></div></div><div class="meta"><b>${esc(x.topicTitle.split(' · ')[0])} · ${esc(x.channel)}</b><p>${esc(x.title)}${x.look?' · 볼 곳: '+esc(x.look):''}</p>${x.scenes?.length?`<div class="scenes" style="padding:8px 0 0">${x.scenes.map(s=>`<button data-seek="${s.t}" style="background:rgba(255,255,255,.2);color:#fff">${fmt(s.t)} ${esc(s.label)}</button>`).join('')}</div>`:''}</div>${side}</section>`;
    const bg = x.kind==='read' ? secGrad(x.section) : ASK_GRADS[hash(x.id)%ASK_GRADS.length];
    const t = x.kind==='read' ? x.title : 'Q. ' + x.q;
    const b = x.kind==='read' ? (x.what || x.why) : (x.a || (x.follow.find(f=>f.a)||{}).a || '');
    return `<section class="rl" data-id="${esc(x.id)}" style="background:${x.img?`linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.8)),url('${esc(x.img)}') center/cover`:bg}"><div class="txt"><div style="font-size:12.5px;font-weight:700;opacity:.8;margin-bottom:12px">${esc(x.kind==='read'?x.section:'내가 물어본 것 · #'+x.ch)}</div><div class="t">${esc(t)}</div>${b?`<div class="b">${esc(x.kind==='ask'?'Aside: ':'')}${esc(b)}</div>`:''}</div><div class="meta"><b>${esc(x.kind==='read'?(x.src||x.ch):x.day)}</b>${x.kind==='read'&&x.url?`<p><a href="${esc(x.url)}" target="_blank" style="color:#fff">원문 읽기 ↗</a></p>`:''}</div>${side}</section>`;
  }).join('') + `<section class="rl" style="background:#111"><div class="end" style="color:#fff"><div class="ok">✓</div><h3>릴스 끝</h3><p style="color:#bbb">여기서 멈추고, 본 것 하나를 해 봐요.</p><button class="btn" onclick="switchTab('home')">홈으로</button></div></section>`;
  el.querySelectorAll('.frame').forEach(f => f.onclick = () => playIn(f, f.dataset.vid, 0));
  el.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => { const f = b.closest('.rl').querySelector('.frame'); playIn(f, f.dataset.vid, +b.dataset.seek); });
  el.querySelectorAll('.side [data-a]').forEach(b => b.onclick = () => { const s = b.closest('[data-id]'); const on = react(s.dataset.id, b.dataset.a);
    if (b.dataset.a==='meh') { s.remove(); toast('이런 건 덜 보여 드릴게요'); return; }
    b.firstChild.textContent = b.dataset.a==='like' ? (on?'♥':'♡') : (on?'⚑':'⚐'); b.classList.toggle('on',on); if (b.dataset.a==='like') b.classList.toggle('lk',on); });
  const rio = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) e.target.querySelectorAll('iframe').forEach(f=>{ const fr=f.parentElement; fr.innerHTML=`<img src="${thumb(fr.dataset.vid)}"><div class="play"><b>▶</b></div>`; fr.onclick=()=>playIn(fr, fr.dataset.vid, 0); }); else markSeen(e.target.dataset.id); }), { threshold: .5 });
  el.querySelectorAll('.rl[data-id]').forEach(s => rio.observe(s));
}

// ---------- stories ----------
let SV = null;
function openStory(key){
  let slides = [], name = '', av = '';
  if (key === 'asks') { name = '오늘 물어본 것'; slides = FEED.asks.filter(a=>Date.now()/1000-a.ts<36*3600); if (!slides.length) slides = FEED.asks.slice(0,6); slides = slides.map(x=>({x, bg: ASK_GRADS[hash(x.id)%ASK_GRADS.length], t: x.q, b: x.a || (x.follow.find(f=>f.a)||{}).a || '', cta: [['슬랙 스레드', x.link]]})); }
  else if (key === 'reads') { name = '읽을거리'; slides = FEED.reads.slice(0,12).map(x=>({x, bg: secGrad(x.section), k: x.section, t: x.title, b: x.what, cta: [x.url?['원문', x.url]:null, ['슬랙', x.thread]].filter(Boolean)})); }
  else { const slug = key.slice(2); const t = FEED.topics.find(t=>t.slug===slug); name = t.title.split(' · ')[0];
    slides = FEED.videos.filter(v=>v.topic===slug).map(x=>({x, bg:'#111', vid:x.vid, k:`퀘스트 ${x.quest} · ${x.questTitle}`, t:x.title, b: x.look ? '볼 곳: '+x.look : '', cta:[['퀘스트판', './#'+slug]]})); }
  if (!slides.length) { toast('아직 없어요'); return; }
  SV = { slides, i: 0, name, timer: null, start: 0, paused: false };
  $('#sv').classList.add('on'); document.body.style.overflow='hidden'; showSlide();
}
function showSlide(){
  const { slides, i, name } = SV; const s = slides[i];
  markSeen(s.x.id);
  $('#sv').innerHTML = `<div class="box" style="background:${s.bg}">
    <div class="bars">${slides.map((_,j)=>`<i><b style="width:${j<i?100:0}%"></b></i>`).join('')}</div>
    <div class="top"><span>${esc(name)}</span><span style="font-weight:400;opacity:.7">${i+1}/${slides.length}</span><button id="svx">×</button></div>
    <div class="slide">${s.vid?`<div class="vthumb" id="svv"><img src="${thumb(s.vid)}"><div class="play"><b>▶</b></div></div>`:''}${s.k?`<div style="font-size:12.5px;font-weight:700;opacity:.8;margin:${s.vid?'18px':'0'} 0 10px">${esc(s.k)}</div>`:''}<div class="t" style="${s.vid?'font-size:20px':''}">${esc(s.t)}</div>${s.b?`<div class="b">${esc(s.b)}</div>`:''}</div>
    <div class="tap l" id="svl"></div><div class="tap r" id="svr"></div>
    <div class="cta">${s.cta.map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join('')}<button id="svs">${(R[s.x.id]||{}).save?'⚑ 저장됨':'⚐ 저장'}</button></div></div>`;
  $('#svx').onclick = closeStory;
  $('#svl').onclick = () => go(-1); $('#svr').onclick = () => go(1);
  $('#svs').onclick = () => { const on = react(s.x.id,'save'); $('#svs').textContent = on?'⚑ 저장됨':'⚐ 저장'; };
  if (s.vid) $('#svv').onclick = () => { SV.paused = true; $('#svv').innerHTML = `<iframe src="${embed(s.vid, s.x.scenes?.[0]?.t||0)}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`; };
  const box = $('#sv .box'); box.onpointerdown = e => { if (!e.target.closest('a,button,iframe,#svv')) SV.hold = true; }; box.onpointerup = () => SV.hold = false;
  clearInterval(SV.timer); SV.start = Date.now(); SV.paused = false; let el = 0;
  const dur = Math.min(14000, 5000 + (s.t.length + (s.b||'').length) * 25);
  SV.timer = setInterval(() => { if (SV.paused || SV.hold) return; el += 50; const p = Math.min(100, el/dur*100); const bar = $('#sv .bars i:nth-child('+(i+1)+') b'); if (bar) bar.style.width = p+'%'; if (p >= 100) go(1); }, 50);
}
function go(d){ SV.i += d; if (SV.i < 0) SV.i = 0; if (SV.i >= SV.slides.length) return closeStory(); showSlide(); }
function closeStory(){ clearInterval(SV?.timer); $('#sv').classList.remove('on'); $('#sv').innerHTML=''; document.body.style.overflow=''; renderStories(); }
document.addEventListener('keydown', e => { if (!$('#sv').classList.contains('on')) return; if (e.key==='ArrowRight') go(1); if (e.key==='ArrowLeft') go(-1); if (e.key==='Escape') closeStory(); });

// ---------- nav ----------
function setNav(){ document.querySelectorAll('nav [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab===TAB)); $('#reels').classList.toggle('on', TAB==='reels'); }
function switchTab(t){ TAB = t; setNav(); if (t !== 'reels') { $('#reels').innerHTML=''; } render(); if (t!=='reels') scrollTo(0,0); }
document.querySelectorAll('nav [data-tab]').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
$('#rclose').onclick = () => switchTab('home');
$('#refresh').onclick = () => { toast('새로 불러오는 중'); pull(); };

const sen = document.createElement('div'); sen.style.height='1px'; document.querySelector('.app').appendChild(sen); sentinel.observe(sen);
render(); pull(); flush();
if (FROM) { const c = LS.get('redir', {}); const d = new Date().toLocaleDateString('en-CA'); c[d] = (c[d]||0) + 1; LS.set('redir', c); toast(`${FROM==='youtube'?'유튜브':'인스타'} 대신 왔어요 · 오늘 ${c[d]}번째`); history.replaceState(null,'',location.pathname); }
window.addEventListener('pagehide', () => LS.set('lastVisit', Date.now()));
document.addEventListener('visibilitychange', () => { if (document.hidden) LS.set('lastVisit', Date.now()); else { flush(); pull(); } });
</script>
