<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>야생 피드</title>
<style>
  :root{--bg:#fff;--fg:#0f1419;--sub:#737373;--line:#efefef;--soft:#fafafa;--ig:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif}
  a{color:inherit}
  .app{max-width:470px;margin:0 auto;min-height:100vh;padding-bottom:70px}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;border-bottom:1px solid var(--line)}
  .logo{font:italic 800 25px/1 Georgia,"Times New Roman",serif;letter-spacing:-.5px;background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hx{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--sub)}
  .hx button{border:0;background:none;font-size:20px;cursor:pointer;padding:0}
  /* stories */
  .stories{display:flex;gap:14px;overflow-x:auto;padding:12px 12px 10px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .stories::-webkit-scrollbar{display:none}
  .st{flex:0 0 auto;width:70px;text-align:center;cursor:pointer;border:0;background:none;padding:0;color:inherit}
  .ring{width:66px;height:66px;border-radius:50%;padding:3px;background:var(--ig);margin:0 auto}
  .ring.seen{background:#dbdbdb}
  .ring>div{width:100%;height:100%;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:24px;background-size:cover;background-position:center;color:#fff;font-weight:700}
  .st .n{font-size:11.5px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st .p{font-size:10.5px;color:var(--sub)}
  /* chips */
  .chips{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid #dbdbdb;background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--fg);color:#fff;border-color:var(--fg)}
  /* post */
  .post{border-bottom:1px solid var(--line);padding-bottom:12px}
  .ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
  .av{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;padding:2px;background:var(--ig)}
  .av>span{width:100%;height:100%;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
  .who{font-weight:700;font-size:14px;line-height:1.2}
  .who small{display:block;font-weight:400;color:var(--sub);font-size:12px}
  .new{margin-left:auto;font-size:11px;font-weight:700;color:#fff;background:#ff3040;border-radius:6px;padding:2px 6px}
  .media{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff}
  .media.v{aspect-ratio:16/9;background:#000}
  .media img{width:100%;height:100%;object-fit:cover;display:block}
  .media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .play b{width:62px;height:62px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:24px;padding-left:4px}
  .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);font-size:12px;padding:2px 6px;border-radius:4px}
  .card{padding:28px 26px;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center}
  .card .k{font-size:12.5px;font-weight:700;letter-spacing:.3px;opacity:.85;margin-bottom:12px}
  .card .t{font-size:23px;line-height:1.34;font-weight:800;letter-spacing:-.4px;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
  .card .t.q::before{content:"Q.";display:block;font-size:34px;opacity:.5;margin-bottom:4px}
  .card .f{margin-top:16px;font-size:13px;opacity:.85}
  .acts{display:flex;align-items:center;gap:16px;padding:10px 12px 4px;font-size:24px}
  .acts button{border:0;background:none;padding:0;font-size:24px;cursor:pointer;line-height:1;color:var(--fg)}
  .acts .r{margin-left:auto}
  .acts .on.lk{color:#ff3040}
  .cap{padding:2px 12px;font-size:14px;white-space:pre-wrap;word-break:keep-all}
  .cap b{font-weight:700}
  .cap .more{color:var(--sub);cursor:pointer;border:0;background:none;padding:0;font-size:14px}
  .cmt{padding:4px 12px;font-size:13.5px;color:var(--sub);cursor:pointer}
  .cl{padding:2px 12px 2px;font-size:14px}
  .cl div{margin:6px 0;padding-left:10px;border-left:2px solid var(--line)}
  .cl .ans{color:#262626}
  .lnk{padding:6px 12px 0;display:flex;gap:8px;flex-wrap:wrap}
  .lnk a,.lnk button{font-size:12.5px;font-weight:600;text-decoration:none;border:1px solid #dbdbdb;border-radius:8px;padding:5px 10px;background:#fff;cursor:pointer;color:var(--fg)}
  .scenes{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap}
  .scenes button{border:0;background:#efefef;border-radius:8px;padding:5px 9px;font-size:12.5px;cursor:pointer}
  .time{padding:4px 12px 0;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.2px}
  .end{padding:40px 24px 30px;text-align:center}
  .end .ok{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;background:var(--ig);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px}
  .end h3{margin:6px 0;font-size:18px}
  .end p{color:var(--sub);margin:4px 0 16px;font-size:14px}
  .btn{display:inline-block;background:#0095f6;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
  .btn.g{background:#efefef;color:var(--fg)}
  /* nav */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav .in{max-width:470px;margin:0 auto;display:flex;justify-content:space-around;padding:9px 0 8px}
  nav button,nav a{border:0;background:none;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-decoration:none}
  nav i{font-style:normal;font-size:22px;line-height:1;color:var(--fg)}
  nav .on{color:var(--fg);font-weight:700}
  /* reels */
  .reels{position:fixed;inset:0;z-index:25;background:#000;overflow-y:auto;scroll-snap-type:y mandatory;display:none}
  .reels.on{display:block}
  .rl{height:100vh;height:100dvh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
  .rl .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(28px) brightness(.45);transform:scale(1.2)}
  .rl .frame{position:relative;width:100%;max-width:470px;aspect-ratio:16/9;background:#000;cursor:pointer}
  .rl .frame img{width:100%;height:100%;object-fit:cover}
  .rl .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .rl .txt{position:relative;max-width:470px;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:40px 28px 150px}
  .rl .txt .t{font-size:27px;font-weight:800;line-height:1.33;letter-spacing:-.5px;word-break:keep-all}
  .rl .txt .b{font-size:15px;line-height:1.55;margin-top:18px;opacity:.92;word-break:keep-all;max-height:38vh;overflow:auto;padding-right:44px}
  .rl .meta{position:absolute;left:0;right:64px;bottom:0;padding:16px 16px calc(78px + env(safe-area-inset-bottom));max-width:470px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .rl .meta b{font-size:14px}
  .rl .meta p{margin:6px 0 0;font-size:13.5px;opacity:.92;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .rl .side{position:absolute;right:10px;bottom:calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px;align-items:center}
  .rl .side button,.rl .side a{border:0;background:none;color:#fff;font-size:27px;cursor:pointer;text-decoration:none;display:flex;flex-direction:column;align-items:center;font-size:27px;line-height:1}
  .rl .side small{font-size:11px;margin-top:3px}
  .rl .side .on.lk{color:#ff3040}
  .rclose{position:fixed;top:12px;right:16px;z-index:26;color:#fff;font:italic 800 22px Georgia,serif;display:none}
  .reels.on~.rclose{display:block}
  /* story viewer */
  .sv{position:fixed;inset:0;z-index:40;background:#111;display:none;color:#fff}
  .sv.on{display:flex;justify-content:center}
  .sv .box{position:relative;width:100%;max-width:470px;height:100%}
  .sv .bars{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;z-index:3}
  .sv .bars i{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
  .sv .bars i b{display:block;height:100%;width:0;background:#fff}
  .sv .top{position:absolute;top:18px;left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:3;font-size:14px;font-weight:700}
  .sv .top button{margin-left:auto;border:0;background:none;color:#fff;font-size:26px;cursor:pointer}
  .sv .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:70px 26px 110px}
  .sv .slide .t{font-size:26px;font-weight:800;line-height:1.35;letter-spacing:-.4px;word-break:keep-all}
  .sv .slide .b{margin-top:16px;font-size:15px;line-height:1.55;opacity:.93;word-break:keep-all;max-height:45vh;overflow:hidden}
  .sv .slide .vthumb{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;background:#000}
  .sv .slide .vthumb img{width:100%;height:100%;object-fit:cover}
  .sv .slide .vthumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .sv .tap{position:absolute;top:60px;bottom:110px;width:35%;z-index:2}
  .sv .tap.l{left:0}.sv .tap.r{right:0}
  .sv .cta{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));text-align:center;z-index:3}
  .sv .cta a,.sv .cta button{display:inline-block;border:1px solid rgba(255,255,255,.6);color:#fff;background:rgba(255,255,255,.12);border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;text-decoration:none;margin:0 4px;cursor:pointer}
  /* game */
  .gm{position:fixed;inset:0;z-index:45;background:#0b0b0b;color:#fff;display:none;overflow-y:auto}
  .gm.on{display:block}
  .gm .in{max-width:470px;margin:0 auto;padding:18px 18px 120px}
  .gm .top{display:flex;align-items:center;gap:10px;font-size:13px;color:#aaa;position:sticky;top:0;background:#0b0b0b;padding:8px 0 10px;z-index:2}
  .gm .top b{color:#fff;font-size:14px}
  .gm .top .clock{margin-left:auto;font:700 15px ui-monospace,Menlo,monospace;color:#fff;background:#222;border-radius:8px;padding:4px 9px}
  .gm .top .clock.late{background:#b91c1c}
  .gm .top button{border:0;background:none;color:#fff;font-size:26px;cursor:pointer;margin-left:6px}
  .gm h2{font-size:22px;line-height:1.35;margin:10px 0 12px;letter-spacing:-.3px;word-break:keep-all}
  .gm .sit{font-size:16px;line-height:1.6;color:#eee;word-break:keep-all}
  .gm .facts{margin:14px 0;padding:12px 14px;background:#1a1a1a;border-radius:12px;font-size:14px;color:#ccc}
  .gm .facts div{margin:4px 0}
  .gm .step{margin-top:22px;font-size:13px;font-weight:800;letter-spacing:.4px;color:#f59e0b}
  .gm .q{font-size:15px;margin:4px 0 10px;color:#fff}
  .gm .opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:#1a1a1a;color:#fff;border:1.5px solid #2a2a2a;border-radius:12px;padding:12px;margin:8px 0;font-size:15px;line-height:1.45;cursor:pointer;word-break:keep-all}
  .gm .opt.on{border-color:#f59e0b;background:#2a1f05}
  .gm .opt .n{flex:0 0 24px;height:24px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
  .gm .opt.on .n{background:#f59e0b;color:#111}
  .gm textarea{width:100%;min-height:64px;background:#1a1a1a;color:#fff;border:1.5px solid #2a2a2a;border-radius:12px;padding:12px;font:15px/1.5 inherit}
  .gm .go{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b0b0b 30%)}
  .gm .go button{display:block;width:100%;max-width:434px;margin:0 auto;border:0;border-radius:12px;padding:15px;font-weight:800;font-size:16px;background:#f59e0b;color:#111;cursor:pointer}
  .gm .go button:disabled{opacity:.35}
  .gm .score{display:flex;gap:8px;margin:14px 0}
  .gm .score div{flex:1;background:#1a1a1a;border-radius:12px;padding:12px 8px;text-align:center}
  .gm .score b{display:block;font-size:24px}
  .gm .score small{color:#aaa;font-size:12px}
  .gm .ok{color:#22c55e}.gm .no{color:#ef4444}
  .gm .why{background:#1a1a1a;border-radius:12px;padding:14px;font-size:14.5px;line-height:1.6;color:#ddd;word-break:keep-all}
  /* saved grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  .grid .g{aspect-ratio:1/1;overflow:hidden;position:relative;cursor:pointer;color:#fff;font-size:12px;font-weight:700;padding:8px;display:flex;align-items:flex-end;background-size:cover;background-position:center}
  .sf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px 4px;background:#fff}
  .sf input[type=search]{flex:1;min-width:0;padding:9px 12px;border:1px solid #dbdbdb;border-radius:10px;font-size:15px;background:#efefef}
  .sf button{border:0;background:#0095f6;color:#fff;font-weight:700;border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer}
  .sf .lg{flex-basis:100%;font-size:12px;color:#737373;display:flex;align-items:center;gap:6px}
  .srh{padding:10px 14px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .srh b{font-size:15px}.srh button,.srh a{border:1px solid #dbdbdb;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:#111;text-decoration:none;cursor:pointer}
  .empty{padding:60px 30px;text-align:center;color:var(--sub)}
  .toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);background:#262626;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .keybox{padding:40px 24px;text-align:center}
  .keybox input{width:100%;padding:12px;border:1px solid #dbdbdb;border-radius:8px;margin:12px 0;font-size:15px}
  .sk{height:440px;background:linear-gradient(90deg,#f3f3f3,#fafafa,#f3f3f3);background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}
  @keyframes sk{to{background-position:-200% 0}}
  @media (min-width:900px){ .app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">야생</div>
    <div class="hx"><span id="built"></span><button id="refresh" title="새로고침">↻</button></div>
  </header>
  <form class="sf" id="sf"><input id="sq" type="search" placeholder="유튜브에서 공부할 것 찾기 (예: adaptive expertise)" autocomplete="off" enterkeyhint="search"><button type="submit">검색</button><label class="lg"><input type="checkbox" id="slong">긴 강연 120분까지</label></form>
  <div class="stories" id="stories"></div>
  <div class="chips" id="chips"></div>
  <main id="main"><div class="sk"></div><div class="sk"></div></main>
</div>
<div class="reels" id="reels"></div>
<div class="rclose" id="rclose">야생</div>
<div class="sv" id="sv"></div>
<div class="gm" id="gm"></div>
<nav><div class="in">
  <button data-tab="home" class="on"><i>⌂</i>홈</button>
  <button data-tab="reels"><i>▶</i>릴스</button>
  <button data-tab="saved"><i>⚑</i>저장</button>
  <a href="./"><i>◎</i>퀘스트</a>
</div></nav>
<div class="toast" id="toast"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwQr12XmnLV5E-u6FDC0jC-7TpDzmBLmhaOAZfzztkl47yARxnEWLtPv3w5JgC94A94/exec';
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get(k,d){ try { return JSON.parse(localStorage.getItem('wt2:'+k)) ?? d } catch { return d } }, set(k,v){ try { localStorage.setItem('wt2:'+k, JSON.stringify(v)) } catch {} } };
const fmt = t => `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
// 키: ?k= 로 한 번 열면 저장 후 주소에서 지움. ?k=..&keep=1 은 지우지 않음(아이폰 홈 화면 앱·단축어용: 홈 화면 앱은 사파리와 저장소가 따로라 시작 주소에 키가 있어야 함)
(() => { const u = new URL(location.href); const k = u.searchParams.get('k'); if (k) { LS.set('key', k); if (u.searchParams.get('keep') !== '1') { u.searchParams.delete('k'); history.replaceState(null, '', u.pathname + u.search + u.hash); } } })();
const KEY = LS.get('key', '');
const FROM = new URL(location.href).searchParams.get('from');

let FEED = LS.get('feed', null);
let QUEUE = LS.get('fq', []);
const R = LS.get('react', {});          // id -> {like:1, save:1, meh:1}
const SEEN = new Set(LS.get('seenIds', []));
const LAST = LS.get('lastVisit', 0);
let TAB = 'home', FILTER = 'all';

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }

// ---------- data ----------
async function pull(){
  if (!KEY) return;
  try {
    const d = await (await fetch(`${API}?k=${encodeURIComponent(KEY)}`)).json();
    if (!d.ok) { if (d.err==='key') toast('키가 맞지 않아요'); return; }
    const parts = d.topics.filter(t => /^_feed_\d+$/.test(t.slug) && t.part).sort((a,b)=> +a.slug.split('_')[2] - +b.slug.split('_')[2]);
    const n = parts[0]?.n || parts.length;
    const s = parts.slice(0, n).map(p=>p.part).join('');
    const f = JSON.parse(s);
    // 서버에 남은 반응을 기기 반응과 합침
    for (const [id, ts] of Object.entries(f.reacted || {})) { R[id] = R[id] || {}; for (const t of ts) { if (t.startsWith('un')) delete R[id][t.slice(2)]; else R[id][t] = 1; } }
    LS.set('react', R);
    FEED = f; LS.set('feed', f); render();
  } catch(e){ console.warn(e); }
}
async function flush(){
  if (!KEY || !QUEUE.length) return;
  const batch = QUEUE.slice();
  try {
    const d = await (await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ k: KEY, a: 'events', events: batch }) })).json();
    if (d.ok) { QUEUE = QUEUE.filter(e => !batch.includes(e)); LS.set('fq', QUEUE); }
  } catch {}
}
function react(id, type){
  R[id] = R[id] || {};
  const on = !R[id][type];
  if (on) R[id][type] = 1; else delete R[id][type];
  LS.set('react', R);
  QUEUE.push({ id: Math.random().toString(36).slice(2,10), topic: '_feed', video: id, type: on ? type : 'un'+type, text: '', by: 'me' });
  LS.set('fq', QUEUE); flush();
  return on;
}

// ---------- mixing ----------
const SEC_COLORS = [
  [/AI 실전|클로드팀|중요/, ['#4f46e5','#9333ea']],
  [/논문/, ['#0f766e','#0891b2']],
  [/생각의 도구|탐색 줄기/, ['#b45309','#db2777']],

  const reads = FEED.reads.filter(x=>!(R[x.id]||{}).meh);
  const likedSec = new Set(reads.filter(r=>(R[r.id]||{}).like||(R[r.id]||{}).save).map(r=>r.section.split(' · ')[0]));
  reads.sort((a,b)=> (likedSec.has(b.section.split(' · ')[0]) - likedSec.has(a.section.split(' · ')[0])) || (b.ts-a.ts));

  vis.slice(1).forEach((v,i)=> arts.splice(Math.min(arts.length, 3 + i*6), 0, v));
  const out = [];
  if (insights.length) out.push(insights[0]);
  const firstGame = games.length && gameDue(games[0]) ? games.shift() : null;
  let n = 0;
  while (studies.length || vids.length || arts.length || games.length) {

async function doSearch(q, long){

  const ck = (long?'L:':'S:') + q.toLowerCase(); let res = SC[ck] && Date.now() - SC[ck].at < 6*3600*1000 ? SC[ck] : null;
  if (!res) {
    try {
      const d = await (await fetch(`${API}?k=${encodeURIComponent(KEY)}&a=search&q=${encodeURIComponent(q)}&long=${long?1:0}`)).json();
      if (d.ok) { res = { at: Date.now(), items: d.items }; SC[ck] = res; LS.set('sc', SC); QUEUE.push({ id: Math.random().toString(36).slice(2,10), topic:'_feed', type:'search', text:q, by:'me' }); LS.set('fq', QUEUE); flush(); }
      else res = { err: d.err };
    } catch { res = { err: 'net' }; }
  }
  const yt = `<a href="${esc(ytLink(q))}" target="_blank" rel="noopener">유튜브에서 직접 보기 ↗</a>`;
  const box = $('#main'); $('#sback') && 0;

  } else if (!res.items.length) {

  } else {
    box.innerHTML = head(`<button id="sadd">이 주제로 추가</button><button id="sbad">결과가 별로예요</button>`) + res.items.map(x => srHTML(x, q)).join('') + `<div class="end"><p>${res.items.length}개까지만 보여 드려요. 끝없이 내리지 않게요.</p>${yt}</div>`;
    $('#sadd').onclick = () => { QUEUE.push({ id: Math.random().toString(36).slice(2,10), topic:'_feed', type:'topic_add', text:q, by:'me' }); LS.set('fq', QUEUE); flush(); toast('주제로 추가했어요. 다음 갱신 때 영상이 쌓여요'); };
    $('#sbad').onclick = () => { QUEUE.push({ id: Math.random().toString(36).slice(2,10), topic:'_feed', type:'search_bad', text:q, by:'me' }); LS.set('fq', QUEUE); flush(); toast('기록했어요. 새 주제 후보로 다시 보여 드릴게요'); };

// ---------- decision game ----------
// 설계 근거(2026-11-19): TDG 규칙(시간 제한·먼저 지시로 결정·정답 하나 없음), ShadowBox(순서+이유 기록 → 전문가 순서·이유와 비교 → 전문가가 본 것 적기),
// 확신도 + 즉시 재시험(과잉교정 효과·오류 재발 막기), 놓친 판은 3일 뒤 다시(간격), 주간 패턴 카드(Klein 통찰 3경로: 연결·모순).
let GM = null;
const rid = () => Math.random().toString(36).slice(2,10);
function openGame(id){
  const g = ALL().find(x=>x.id===id); if (!g) return;
  GM = { g, stage:'decide', order:'', cues:new Set(), rank:[], why:'', conf:0, eyes:'', t0:Date.now(), tDecide:0, tw:null, saved:false, tick:null };
  $('#gm').classList.add('on'); document.body.style.overflow='hidden'; markSeen(id); drawGame();
  GM.tick = setInterval(() => { const c = $('#gm .clock'); if (!c) return; const lim = GM.stage==='twist' ? (GM.g.twist.sec||40) : GM.g.sec; const base = GM.stage==='twist' ? GM.tTwist : GM.t0; const left = lim - Math.floor((Date.now()-base)/1000); c.textContent = left >= 0 ? fmt(left) : '+'+fmt(-left); c.classList.toggle('late', left < 0); }, 250);
}
function finalize(){
  if (!GM || GM.saved || !GM.done) return; GM.saved = true;
  const g = GM.g, d = GM.done;
  const prev = GAMES[g.id] || {};
  GAMES[g.id] = { score:d.score, top1:d.top1, conf:GM.conf, at:Date.now(), again:(prev.at ? (prev.again||0)+1 : 0), twistOk: GM.tw ? GM.tw.ok : null };
  LS.set('games', GAMES);
  QUEUE.push({ id: rid(), topic:'_feed', video:g.id, type:'game', by:'me', text: JSON.stringify({ score:d.score, top1:d.top1, conf:GM.conf, order:GM.order, decideSecs:GM.tDecide, cues:[...GM.cues], rank:GM.rank, why:GM.why, eyes:GM.eyes, twist:GM.tw, secs:d.secs, hit:d.hit, rk:d.rk, retry:!!prev.at }) });
  LS.set('fq', QUEUE); flush();
}
function closeGame(){ finalize(); clearInterval(GM?.tick); $('#gm').classList.remove('on'); $('#gm').innerHTML=''; document.body.style.overflow=''; if (TAB==='home') { const y = scrollY; renderHome(); scrollTo(0,y); } }
function keep(fn){ const y = $('#gm').scrollTop; fn(); $('#gm').scrollTop = y; }
const gmTop = (g, label) => `<div class="top"><b>♟ ${esc(g.area.replace(' · 내 일 복기',''))}</b><span>${label}</span><span class="clock">${fmt(g.sec)}</span><button id="gmx">×</button></div>`;
function drawGame(){
  const { g } = GM;
  if (GM.stage === 'decide') {
    $('#gm').innerHTML = `<div class="in">${gmTop(g, g.replay?'내 일 복기':'결정 게임')}
      <h2>${esc(g.title)}</h2><div class="sit">${esc(g.situation)}</div>
      ${g.facts?.length?`<div class="facts">${g.facts.map(f=>`<div>· ${esc(f)}</div>`).join('')}</div>`:''}
      <div class="step">먼저 결정</div><div class="q">지금 실제로 보낼 말이나 내릴 지시를 한 줄로. 설명은 나중에.</div>
      <textarea id="gmo" placeholder="예: 손님께 \u201c...\u201d / 주방에 \u201c...\u201d">${esc(GM.order)}</textarea>
    </div><div class="go"><button id="gmgo" ${GM.order.trim().length<4?'disabled':''}>결정했어요</button></div>`;
    $('#gmo').oninput = e => { GM.order = e.target.value; $('#gmgo').disabled = GM.order.trim().length < 4; };
    $('#gmgo').onclick = () => { GM.tDecide = Math.round((Date.now()-GM.t0)/1000); GM.stage = 'rank'; drawGame(); $('#gm').scrollTop = 0; };
  } else if (GM.stage === 'rank') {
    const opts = g.options.map(o => { const i = GM.rank.indexOf(o.id); return `<button class="opt ${i>=0?'on':''}" data-o="${o.id}"><span class="n">${i>=0?i+1:''}</span><span>${esc(o.t)}</span></button>`; }).join('');
    const cues = g.cues.map((c,i) => `<button class="opt ${GM.cues.has(i)?'on':''}" data-c="${i}"><span class="n">${GM.cues.has(i)?'✓':''}</span><span>${esc(c.t)}</span></button>`).join('');
    const ready = GM.rank.length===3 && GM.conf;
    $('#gm').innerHTML = `<div class="in">${gmTop(g, '내 판단 적기')}
      <div class="facts" style="margin-top:4px"><b style="color:#fff">내 결정</b><div>${esc(GM.order)}</div></div>
      <div class="step">1. 단서</div><div class="q">판단에 중요했던 것만 고르세요</div>${cues}
      <div class="step">2. 순서</div><div class="q">보기 중 먼저 할 것부터 3개를 차례로</div>${opts}
      <div class="step">3. 확신</div><div class="q">1번이 전문가 1번과 같을 확률은?</div>
      <div style="display:flex;gap:8px">${[50,70,90].map(c=>`<button class="opt ${GM.conf===c?'on':''}" data-f="${c}" style="justify-content:center"><span>${c}%</span></button>`).join('')}</div>
      <div class="step">4. 이유 한 줄 (선택)</div><textarea id="gmw" placeholder="왜 그 순서인지">${esc(GM.why)}</textarea>
    </div><div class="go"><button id="gmgo" ${ready?'':'disabled'}>${GM.rank.length<3?`순서 ${3-GM.rank.length}개 더`:!GM.conf?'확신 고르기':'전문가와 맞춰 보기'}</button></div>`;
    $('#gmw').oninput = e => GM.why = e.target.value;
    $('#gm').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { const i=+b.dataset.c; GM.cues.has(i)?GM.cues.delete(i):GM.cues.add(i); keep(drawGame); });
    $('#gm').querySelectorAll('[data-o]').forEach(b => b.onclick = () => { const o=b.dataset.o; const i=GM.rank.indexOf(o); if (i>=0) GM.rank.splice(i,1); else if (GM.rank.length<3) GM.rank.push(o); keep(drawGame); });
    $('#gm').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { GM.conf = +b.dataset.f; keep(drawGame); });
    $('#gmgo').onclick = () => { if (ready) { score(); GM.stage='reveal'; drawGame(); $('#gm').scrollTop=0; } };
  } else if (GM.stage === 'reveal') {
    const d = GM.done, name = id => g.options.find(o=>o.id===id)?.t || id;
    const keyIdx = g.cues.map((c,i)=>c.key?i:-1).filter(i=>i>=0);
    const hyper = !d.top1 && GM.conf >= 90;
    $('#gm').innerHTML = `<div class="in">
      <div class="top"><b>♟ 결과</b><span>${GM.conf}% 확신 · 1번 ${d.top1?'<span class="ok">일치</span>':'<span class="no">불일치</span>'}</span><button id="gmx" style="margin-left:auto">×</button></div>
      <h2>${d.score}점</h2>
      ${hyper?`<div class="why" style="border-left:3px solid #f59e0b;margin-bottom:10px">확신 90%로 틀린 판이에요. 이런 판이 가장 잘 고쳐지고 오래 남아요. 아래 다음 장면에서 바로 한 번 더 해 봐요.</div>`:''}
      <div class="score"><div><b>${d.hit}/${keyIdx.length}</b><small>단서${d.falsePick?` · 헛짚음 ${d.falsePick}`:''}</small></div><div><b>${d.rk}/6</b><small>순서 일치</small></div><div><b class="${GM.tDecide>g.sec?'no':''}">${GM.tDecide}초</b><small>결정까지 (${g.sec}초)</small></div></div>
      <div class="step">전문가 순서</div>${g.expert.map((o,i)=>`<div class="opt" style="cursor:default"><span class="n" style="background:${GM.rank[i]===o?'#22c55e':GM.rank.includes(o)?'#f59e0b':'#333'};color:#111">${i+1}</span><span>${esc(name(o))}</span></div>`).join('')}
      <div class="step">내 순서</div>${GM.rank.map((o,i)=>`<div class="opt" style="cursor:default;opacity:.85"><span class="n">${i+1}</span><span>${esc(name(o))}</span></div>`).join('')}
      <div class="step">놓친 단서</div>${keyIdx.filter(i=>!GM.cues.has(i)).map(i=>`<div class="opt" style="cursor:default"><span class="n no">!</span><span>${esc(g.cues[i].t)}</span></div>`).join('') || '<div class="q ok">다 봤어요</div>'}
      <div class="step">전문가 이유</div><div class="why">${esc(g.why)}</div>
      ${g.minority?`<div class="step">다르게 보는 전문가</div><div class="why" style="color:#bbb">${esc(g.minority)}</div>`:''}
      ${g.replay ? `<div class="step">그때 실제로 일어난 것 · ${esc(g.when||'')}</div><div class="why" style="border-left:3px solid #ef4444">${esc(g.actual)}</div>
      <div class="step">전문가 버전</div><div class="why" style="border-left:3px solid #22c55e">${esc(g.expert_version)}</div>
      <div class="step">차이 한 줄</div><div class="why" style="font-weight:700;color:#fff">${esc(g.gap)}</div>` : ''}
      <div class="why" style="background:none;padding:8px 0 0;color:#999;font-size:13px">근거: ${esc(g.source)}</div>
      <div class="step">전문가는 보고 나는 못 본 것</div><div class="q">한 줄 (이게 이 판의 핵심이에요)</div><textarea id="gme" placeholder="예: '했어요'를 결과로 착각했다">${esc(GM.eyes)}</textarea>
    </div><div class="go"><button id="gmgo" ${GM.eyes.trim().length<3?'disabled':''}>${g.twist?'다음 장면 (상황이 바뀝니다)':'저장하고 피드로'}</button></div>`;
    $('#gme').oninput = e => { GM.eyes = e.target.value; $('#gmgo').disabled = GM.eyes.trim().length < 3; };
    $('#gmgo').onclick = () => { if (g.twist) { GM.stage='twist'; GM.tTwist=Date.now(); drawGame(); $('#gm').scrollTop=0; } else { closeGame(); toast('저장했어요'); } };
  } else if (GM.stage === 'twist') {
    const t = g.twist;
    $('#gm').innerHTML = `<div class="in"><div class="top"><b>♟ 다음 장면</b><span>바로 다시</span><span class="clock">${fmt(t.sec||40)}</span><button id="gmx">×</button></div>
      <div class="sit" style="margin-top:8px">${esc(t.t)}</div><div class="step">지금 하나만 고르세요</div>
      ${t.options.map(o=>`<button class="opt" data-t="${o.id}"><span class="n"></span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
    $('#gm').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { GM.tw = { pick:b.dataset.t, ok: b.dataset.t===t.expert, secs: Math.round((Date.now()-GM.tTwist)/1000) }; GM.stage='twistres'; drawGame(); });
  } else {
    const t = g.twist, name = id => t.options.find(o=>o.id===id)?.t || id;
    $('#gm').innerHTML = `<div class="in"><div class="top"><b>♟ 다음 장면 결과</b><span>${GM.tw.secs}초</span><button id="gmx" style="margin-left:auto">×</button></div>
      <h2 class="${GM.tw.ok?'ok':'no'}">${GM.tw.ok?'전문가와 같아요':'전문가는 달랐어요'}</h2>
      <div class="step">전문가 선택</div><div class="opt" style="cursor:default"><span class="n" style="background:#22c55e;color:#111">✓</span><span>${esc(name(t.expert))}</span></div>
      ${GM.tw.ok?'':`<div class="step">내 선택</div><div class="opt" style="cursor:default;opacity:.8"><span class="n">·</span><span>${esc(name(GM.tw.pick))}</span></div>`}
      <div class="step">이유</div><div class="why">${esc(t.why)}</div>
      ${!GM.done.top1 || !GM.tw.ok ? '<div class="q" style="margin-top:14px;color:#aaa">이 판은 3일 뒤에 한 번 더 나와요.</div>' : ''}
    </div><div class="go"><button id="gmgo">저장하고 피드로</button></div>`;
    $('#gmgo').onclick = () => { closeGame(); toast('저장했어요'); };
  }
  const x = $('#gmx'); if (x) x.onclick = closeGame;
}
function score(){
  const { g } = GM; const secs = Math.round((Date.now()-GM.t0)/1000);
  const keyIdx = g.cues.map((c,i)=>c.key?i:-1).filter(i=>i>=0);
  const hit = keyIdx.filter(i=>GM.cues.has(i)).length, falsePick = [...GM.cues].filter(i=>!g.cues[i].key).length;
  let rk = 0; GM.rank.forEach((o,i) => { if (g.expert.includes(o)) rk += 1; if (g.expert[i] === o) rk += 1; });
  const sc = Math.round(100 * (0.4 * Math.max(0, hit - falsePick*0.5) / keyIdx.length + 0.6 * rk / 6));
  GM.done = { score: sc, top1: GM.rank[0] === g.expert[0], hit, falsePick, rk, secs };
}
// 3일 뒤 다시: 1번 불일치·점수 60 미만·다음 장면 틀림이면 최대 2번 더
function gameDue(x){ const r = GAMES[x.id]; if (!r) return true; const need = !r.top1 || r.score < 60 || r.twistOk === false; return need && (r.again||0) < 2 && Date.now() - r.at > 3*86400000; }

// ---------- nav ----------
function setNav(){ document.querySelectorAll('nav [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab===TAB)); $('#reels').classList.toggle('on', TAB==='reels'); }
function switchTab(t){ TAB = t; setNav(); if (t !== 'reels') { $('#reels').innerHTML=''; } render(); if (t!=='reels') scrollTo(0,0); }
document.querySelectorAll('nav [data-tab]').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
$('#rclose').onclick = () => switchTab('home');
$('#refresh').onclick = () => { toast('새로 불러오는 중'); pull(); };

const sen = document.createElement('div'); sen.style.height='1px'; document.querySelector('.app').appendChild(sen); sentinel.observe(sen);
render(); pull(); flush();
if (FROM) { const c = LS.get('redir', {}); const d = new Date().toLocaleDateString('en-CA'); c[d] = (c[d]||0) + 1; LS.set('redir', c); toast(`${FROM==='youtube'?'유튜브':'인스타'} 대신 왔어요 · 오늘 ${c[d]}번째`); const u = new URL(location.href); u.searchParams.delete('from'); history.replaceState(null,'',u.pathname + u.search); }
window.addEventListener('pagehide', () => LS.set('lastVisit', Date.now()));
document.addEventListener('visibilitychange', () => { if (document.hidden) LS.set('lastVisit', Date.now()); else { flush(); pull(); } });
</script>
