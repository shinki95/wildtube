<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>비교 듣기 · 22판</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1c1a;--sub:#6b665e;--line:#e4dfd6;--soft:#f3efe6;--a:#1f3a5f;--b:#9a4a2a;--ok:#3d7a4f;--mark:#c99a06;--markf:rgba(255,214,0,.22);
--sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;--serif:"Noto Serif KR","Nanum Myeongjo",serif;
--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:16px/1.65 var(--sans);display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:relative;width:100%;max-width:760px;height:100dvh;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.off{display:none!important}
.h1{font:700 22px/1.3 var(--serif)}
.src{font-size:14px;color:var(--sub)}
/* 시작 화면 */
#home{padding:calc(16px + var(--st)) 20px calc(12px + var(--sb))}
#home .src{margin-top:4px}
.search{margin-top:12px;height:44px;border:1px solid var(--line);border-radius:999px;background:var(--card);display:flex;align-items:center;gap:8px;padding:0 16px;flex:none}
.search input{flex:1;border:0;outline:none;background:none;font:16px var(--sans);color:var(--ink);height:42px;min-width:0}
.list{margin-top:12px;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.song{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;min-height:72px;flex:none}
.song .cv{position:relative;width:52px;height:52px;flex:none}
.song .cv img{position:absolute;width:40px;height:40px;border-radius:8px;object-fit:cover;border:2px solid var(--card)}
.song .cv img:first-child{left:0;top:0}.song .cv img:last-child{right:0;bottom:0}
.song .tx{flex:1;min-width:0}
.song .no{font-size:12px;font-weight:700;color:var(--sub)}
.song b{display:block;font:700 16px/1.35 var(--serif)}
.song span.vs{display:block;font-size:13px;color:var(--sub)}
.dotA,.dotB{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.dotA{background:var(--a)}.dotB{background:var(--b)}
/* 레슨 */
.lh{flex:none;padding:var(--st) 12px 0 4px;background:var(--bg)}
.lh .r1{height:44px;display:flex;align-items:center;gap:4px}
.lh .r1 button{height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:22px}
.lh .r1 .ttl{flex:1;min-width:0;font:700 16px/1.3 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lh .r1 .lg{font-size:12px;color:var(--sub);white-space:nowrap;flex:none}
.map{position:relative;height:40px;margin:0 8px 0 16px;cursor:pointer;flex:none}
.map .trk{position:absolute;left:0;right:0;top:8px;height:8px;display:flex;gap:2px}
.map .trk i{display:block;height:8px;border-radius:2px;background:#e9e3d6}
.map .trk i.s1{background:#ddd5c4}
.map .tk{position:absolute;top:5px;width:3px;height:14px;margin-left:-1.5px;border-radius:2px;background:#bfb6a5}
.map .tk.seen{background:var(--sub)}
.map .cur{position:absolute;top:4px;height:16px;border-radius:4px;background:var(--ink);opacity:.9}
.map .sl{position:absolute;top:22px;font-size:11.5px;line-height:14px;color:var(--sub);white-space:nowrap;transform:translateX(-50%)}
.vwrap{position:relative;flex:none;height:0;margin:0 16px;border-radius:12px;overflow:hidden;background:#000;transition:height .35s ease}
.vwrap .yp{position:absolute;left:0;top:0;bottom:0;width:100%;visibility:hidden}
.vwrap .yp.on{visibility:visible}
.vwrap .yp iframe,.vwrap .yp>div{width:100%;height:100%;border:0;display:block}
.vwrap .yerr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:15px;text-align:center;background:#222;padding:8px}
.vwrap .yerr.on{display:flex}
.vwrap .yerr a{color:#fff;border:1px solid #fff8;border-radius:22px;padding:0 16px;height:44px;display:inline-flex;align-items:center;text-decoration:none}
.now{flex:none;margin:4px 16px 0;font-size:13px;color:var(--sub);line-height:20px;white-space:nowrap;overflow:hidden}
.now:empty{display:none}
.now b{color:var(--ink)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:pan-y}
.page{position:absolute;inset:0;padding:6px 12px 8px;display:flex}
.card{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px 12px;display:flex;flex-direction:column;overflow:hidden}
.card h2{font:700 18px/1.35 var(--serif);display:flex;gap:8px;align-items:center;flex:none;min-height:44px}
.card h2 .tt{flex:1;min-width:0}
.aft2{flex:none;height:44px;padding:0 2px 0 8px;display:flex;align-items:center;gap:4px;font:700 14px var(--sans);color:var(--ink);white-space:nowrap}
.aft2 span.p{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--soft)}
.aft2.ready span.p{background:var(--ok);border-color:var(--ok);color:#fff}
.aft2.open span.p{background:var(--ink);border-color:var(--ink);color:#fff}
.num{font:700 12px/18px var(--sans);color:#fff;background:var(--ink);border-radius:999px;padding:0 8px;flex:none}
.card.done .num{background:var(--ok)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--sub);margin:6px 0 3px;flex:none;line-height:16px}
.sco{position:relative;flex:none;border:1px solid var(--line);border-radius:8px;background:#fff;padding:3px;cursor:pointer}
.sco .sy{position:relative}
.sco .sy img{position:absolute;inset:0;width:100%;height:100%;display:block}
.sco .rg{position:absolute;top:4%;bottom:4%;border:2px solid var(--mark);background:var(--markf);border-radius:3px}
.sco.one .sy{display:none}.sco.one .sy.cur{display:block}
.sco .bd{position:absolute;width:4px;margin-left:-2px;border-radius:2px;display:none;z-index:2}
.sco .bd.on{display:block}
.sco .bd.A{background:var(--a)}.sco .bd.B{background:var(--b)}
.sco .bd.ghost{opacity:.55;background:repeating-linear-gradient(180deg,currentColor 0 6px,transparent 6px 10px)!important}
.sco .bd.A.ghost{color:var(--a)}.sco .bd.B.ghost{color:var(--b)}
.simg{flex:none;display:block;width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;object-fit:contain}
.swap{position:relative;flex:1;min-height:0;margin-top:2px}
.face{position:absolute;inset:0;overflow:hidden}
.face.hid{visibility:hidden}
.face.scy{overflow-y:auto;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent)}
.face.scy.end{-webkit-mask-image:none;mask-image:none}
.fin{font-size:16.5px;line-height:1.62;display:flow-root}
.fin.s16{font-size:16px;line-height:1.58}
.fin.s17{font-size:17px}
.fin p+p{margin-top:6px}
.point{background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:6px;font-weight:600}
.bars{margin-top:8px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0;line-height:18px}
.bar .who{width:58px;flex:none;color:var(--sub)}
.bar .fill{height:12px;border-radius:6px}
.bar .v{flex:none;font-variant-numeric:tabular-nums}
.btns{display:grid;grid-template-columns:1fr 44px 1fr;gap:8px;margin-top:10px;flex:none}
.play{border-radius:10px;padding:0 12px;min-height:56px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:center;min-width:0;position:relative;overflow:hidden}
.play b{font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden;font-weight:700}
.play small{display:block;opacity:.9;font-size:12.5px;line-height:17px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.play.A{background:var(--a)}.play.B{background:var(--b)}
.play.on{box-shadow:0 0 0 3px rgba(0,0,0,.18)}
.play.heard:not(.on){box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.play .pr{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.75);width:0}
.swp{width:44px;height:56px;border:1px solid var(--line);border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--sub)}
.swp.on{color:var(--ink);border-color:var(--ink)}
.aft{flex:none;margin-top:8px;border-top:1px dashed var(--line);height:44px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;width:100%}
.aft .ar{display:inline-block;transition:transform .25s}
.aft.open .ar{transform:rotate(90deg)}
.aft.ready{color:var(--ok)}
.others{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;flex:none}
.oth{display:flex;align-items:center;gap:8px;min-height:52px;border:1px solid var(--line);border-radius:10px;padding:4px 8px;text-align:left;min-width:0}
.oth img{width:36px;height:36px;border-radius:6px;object-fit:cover;flex:none}
.oth span{font-size:13px;line-height:17px;font-weight:600;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.legend{display:flex;gap:14px;font-size:13px;color:var(--sub);margin-top:6px;flex:none;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.bot{flex:none;height:calc(52px + var(--sb));padding:0 8px var(--sb);display:flex;align-items:center;gap:4px}
.bot button{height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;flex:none;font-size:15px;font-weight:600;gap:2px;padding:0 8px}
.bot button[disabled]{opacity:.3}
.dots{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;min-width:0}
.dots i{width:7px;height:7px;border-radius:4px;background:#cfc7b7;transition:width .25s}
.dots i.on{width:18px;background:var(--ink)}
.dots i.seen:not(.on){background:var(--sub)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:80%;background:var(--card);border-radius:16px 16px 0 0;border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.12);transform:translateY(105%);transition:transform .3s ease;z-index:20;display:flex;flex-direction:column;padding:8px 16px calc(12px + var(--sb))}
.sheet.on{transform:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;height:44px;flex:none}
.sheet .sh b{font:700 17px var(--serif)}
.sheet .sh button{height:44px;min-width:44px}
.sheet .sl2{overflow-y:auto;min-height:0}
.sheet .it{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border-bottom:1px solid var(--line);text-align:left;padding:4px 0}
.sheet .it .num{flex:none}
.sheet .it span{flex:1;min-width:0;font-size:15px}
.sheet .it small{color:var(--sub);font-size:12.5px;flex:none}
.sheet .it.on span{font-weight:700}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:19;opacity:0;pointer-events:none;transition:opacity .3s}
.dim.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div id="app">
 <section class="view" id="home">
  <div class="h1">비교 듣기</div>
  <div class="src">악보에서 위치를 보고, 설명을 읽고, 그 부분을 A, B 순서로 듣고, 들은 뒤 정리를 펼쳐 보세요. A는 늘 남색, B는 늘 적갈색이에요.</div>
  <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="곡, 작곡가, 연주자" aria-label="곡 찾기"></label>
  <div class="list" id="list"></div>
 </section>
 <section class="view off" id="lv">
  <header class="lh">
   <div class="r1"><button id="home2" aria-label="곡 목록으로">‹ 곡</button><div class="ttl" id="ttl"></div><div class="lg"><span class="dot" style="background:var(--a)"></span><span id="lgA"></span> <span class="dot" style="background:var(--b);margin-left:6px"></span><span id="lgB"></span></div></div>
   <div class="map" id="map" role="button" aria-label="곡 전체에서 지금 위치, 누르면 대목 목록"></div>
  </header>
  <div class="vwrap" id="vwrap"><div class="yp" id="ypA"><div id="ytA"></div></div><div class="yp" id="ypB"><div id="ytB"></div></div><div class="yerr" id="yerr"><span>이 영상은 지금 재생이 안 돼요</span><a id="yerrl" target="_blank" rel="noopener">유튜브에서 열기</a></div></div>
  <div class="now" id="now"></div>
  <main class="stage" id="stage"></main>
  <nav class="bot"><button id="pv" aria-label="이전">‹</button><div class="dots" id="dots"></div><button id="nx" aria-label="다음"><span id="nxn">다음</span> ›</button></nav>
  <div class="dim" id="dim"></div>
  <div class="sheet" id="sheet" aria-hidden="true"><div class="sh"><b>대목 목록</b><button id="shx" aria-label="닫기">닫기</button></div><div class="sl2" id="sl2"></div></div>
 </section>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{ s=Math.round(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const f1=t=>`${Math.floor(t/60)}:${(t%60).toFixed(1).padStart(4,'0')}`;
let IDX=[], L=null, PG=[], pi=0, P=null; const cache={}, heard={};
/* ---------- 데이터 ---------- */
async function loadIndex(){ IDX=await (await fetch('data/index.json')).json(); }
async function loadLesson(id){ if(!cache[id]) cache[id]=await (await fetch('data/'+id+'.json')).json(); return cache[id]; }
/* ---------- 시작 화면 ---------- */
function renderList(){ const q=$('#q').value.trim().toLowerCase(); $('#list').innerHTML=IDX.filter(s=>!q||(s.title+s.short+s.A+s.B).toLowerCase().includes(q)).map(s=>`<button class="song" data-id="${s.id}"><span class="cv"><img src="${s.cA}" alt=""><img src="${s.cB}" alt=""></span><span class="tx"><span class="no">${s.no}편 · 대목 ${s.n}개</span><b>${esc(s.short)}</b><span class="vs"><i class="dotA"></i>${esc(s.A)}  <i class="dotB"></i>${esc(s.B)}</span></span></button>`).join('')||'<div class="src">찾는 곡이 아직 없어요.</div>';
  $('#list').querySelectorAll('.song').forEach(b=>b.onclick=()=>openSong(b.dataset.id,0)); }
/* ---------- 레슨 ---------- */
async function openSong(id,page){ stopAll(); L=await loadLesson(id); heard[id] ||= {};
  PG=[{kind:'intro'}].concat(L.steps.map((s,k)=>({kind:'chap',k}))).concat([{kind:'end'}]);
  $('#home').classList.add('off'); $('#lv').classList.remove('off'); $('#ttl').textContent=L.short; $('#lgA').textContent=L.A.name; $('#lgB').textContent=L.B.name;
  history.replaceState(null,'','?l='+id+(page?'&p='+page:'')); ytSong(); buildMap(); go(page||0,0); }
function goHome(){ stopAll(); $('#lv').classList.add('off'); $('#home').classList.remove('off'); history.replaceState(null,'','?'); }
const clip=(k,w)=>{ if(k==='full') return [0, w==='A'?(L.bt?L.bt.A[L.bt.A.length-1]+6:600):(L.bt?L.bt.B[L.bt.B.length-1]+6:600)]; const s=L.steps[k]; return w==='A'?s.a:s.b; };
function chapHTML(k){ const s=L.steps[k], done=heard[L.id][k]&&heard[L.id][k].A&&heard[L.id][k].B;
  const sco=s.sys?`<div class="sco" id="sco">${s.sys.map((y,j)=>{ const bs=s.rng?y.bars.filter(b=>b[0]>=s.rng[0]&&b[0]<=s.rng[1]):[]; const rg=bs.length?`<i class="rg" style="left:${Math.min(...bs.map(b=>b[1]))/y.w*100}%;width:${(Math.max(...bs.map(b=>b[2]))-Math.min(...bs.map(b=>b[1])))/y.w*100}%"></i>`:''; return `<div class="sy" data-j="${j}" style="padding-top:${y.h/y.w*100}%"><img src="${y.img}" alt="악보 ${esc(s.bl)}">${rg}</div>`; }).join('')}<i class="bd A" id="bdA"></i><i class="bd B" id="bdB"></i></div>`:`<img class="simg" id="simg" src="${s.img}" alt="악보 ${esc(s.bl)}">`;
  const btn=w=>{ const c=clip(k,w); return `<button class="play ${w}${heard[L.id][k]&&heard[L.id][k][w]?' heard':''}" id="pl${w}" aria-label="${w} ${esc(L[w].name)} 듣기"><b>${w} ${esc(L[w].name)} 듣기</b><small id="ps${w}">${fmt(c[0])}~${fmt(c[1])} (${Math.round(c[1]-c[0])}초)</small><i class="pr" id="pr${w}"></i></button>`; };
  const bars=s.bars&&s.bars.length?`<div class="bars">${s.bars.map(b=>{ const m=Math.max(b[1],b[2]); return `<div class="bar" style="margin-top:6px;color:var(--sub)">${esc(b[0])}</div><div class="bar"><span class="who">${esc(L.A.name)}</span><span class="fill" style="width:${b[1]/m*60}%;background:var(--a)"></span><span class="v">${b[1]}초</span></div><div class="bar"><span class="who">${esc(L.B.name)}</span><span class="fill" style="width:${b[2]/m*60}%;background:var(--b)"></span><span class="v">${b[2]}초</span></div>`; }).join('')}</div>`:'';
  return `<div class="card${done?' done':''}"><h2><span class="num">${k+1}</span><span class="tt">${esc(s.t)}</span><button class="aft2${done?' ready':''}" id="aft" aria-label="들은 뒤: 무엇이 달랐나"><span class="p" id="aftt">들은 뒤 ▸</span></button></h2>
   <div class="lbl">악보 ${esc(s.bl)} <span style="font-weight:400">(노란 칸${s.sys?', 누르면 그 마디부터':''})</span></div>${sco}
   <div class="swap" id="swap"><div class="face front"><div class="fin"><div class="lbl" style="margin-top:4px">설명</div><div>${esc(s.ex)}</div><div class="lbl">들을 포인트</div><div class="point">${esc(s.pt)}</div></div></div>
    <div class="face back hid"><div class="fin"><div class="lbl" style="margin-top:4px">들은 뒤: 무엇이 달랐나</div>${s.after.map(p=>`<p>${p}</p>`).join('')}${bars}</div></div></div>
   <div class="btns">${btn('A')}<button class="swp" id="swp" aria-label="같은 자리에서 다른 연주로">⇄</button>${btn('B')}</div></div>`; }
function introHTML(){ return `<div class="card"><h2>${esc(L.title)}</h2><div class="legend"><span><span class="dot" style="background:var(--a)"></span>A ${esc(L.A.full)}</span><span><span class="dot" style="background:var(--b)"></span>B ${esc(L.B.full)}</span></div>
   <div class="swap"><div class="face front"><div class="fin">${L.intro.map(p=>p.startsWith('<p>')?p:`<p>${p}</p>`).join('')}<div class="lbl">평단에서 보는 두 연주</div>${L.critics.map(p=>`<p>${p}</p>`).join('')}</div></div></div></div>`; }
function endHTML(){ const oth=IDX.filter(s=>s.id!==L.id); return `<div class="card"><h2><span class="num">끝</span>정리와 전곡 듣기</h2>
   <div class="swap"><div class="face front"><div class="fin">${L.outro.map(p=>`<p>${p}</p>`).join('')}<div class="src" style="margin-top:6px">${esc(L.credit)}</div><div class="lbl">다른 곡 듣기</div><div class="others">${oth.map(s=>`<button class="oth" data-id="${s.id}"><img src="${s.cA}" alt=""><span>${esc(s.short)}</span></button>`).join('')}</div></div></div></div>

function go(i,dir){ i=Math.max(0,Math.min(PG.length-1,i)); stopAll(); pi=i; const pg=PG[i]; const st=$('#stage');
  const nw=document.createElement('div'); nw.className='page'; nw.innerHTML=pg.kind==='chap'?chapHTML(pg.k):pg.kind==='intro'?introHTML():endHTML();

  P={k:pg.kind==='chap'?pg.k:(pg.kind==='end'?'full':null),who:null,t:0,playing:false,loading:false};

/* ---------- 맞추기: 악보 전체 16.5 -> 악보 한 줄(또는 낮춤) -> 16 -> 카드 안 스크롤 ---------- */
function fit(){ const n=$('#stage .page:last-child'); if(!n) return; setNow(); const vw=$('#vwrap'); const exp=!!(P&&P.who&&(P.playing||P.loading||P.err===P.who));
  const faces=[...n.querySelectorAll('.face')], sco=$('.sco',n), simg=$('.simg',n);
  const prev=vw._h||0; vw.style.transition='none';
  const set=(lv,fs,vh)=>{ if(sco){ sco.classList.toggle('one',lv>0); const st=L.steps[P.k]; if(lv>0&&st&&st.sys){ const iw=sco.clientWidth-6; sco.style.height=Math.ceil(Math.max(...st.sys.map(y=>y.h/y.w))*iw+8)+'px'; } else sco.style.height=''; } if(simg){ simg.style.maxHeight=lv===0?'':lv===1?'120px':'84px'; } faces.forEach(f=>{ const fin=$('.fin',f); fin.classList.toggle('s16',fs===16); fin.classList.toggle('s17',fs===17); f.classList.remove('scy','end'); }); vw.style.height=vh+'px'; if(sco&&lv>0) drawBands(); };
  const free=()=>Math.min(...faces.map(f=>f.clientHeight-$('.fin',f).scrollHeight));
  const hasS=!!(sco||simg); const C=hasS?[[0,16.5],[1,16.5],[2,16.5],[2,16]]:[[0,17],[0,16.5],[0,16]]; const maxV=Math.round(vw.clientWidth*9/16);
  let cfg=null; for(const [lv,fs] of C){ set(lv,fs,0); const fr=free(); if(!exp){ if(fr>=2){ cfg={lv,fs,vh:0}; break; } } else if(fr>=117){ cfg={lv,fs,vh:Math.min(maxV,Math.floor(fr)-4)}; break; } }
  if(!cfg){ const [lv,fs]=C[C.length-1]; set(lv,fs,0); const fr=free(); cfg={lv,fs,vh:exp?Math.max(113,Math.min(maxV,Math.floor(fr))):0}; }
  if(sco&&!(cfg.lv>0)) sco.classList.remove('one'); set(cfg.lv,cfg.fs,cfg.vh);
  const res=faces.map(f=>{ const fin=$('.fin',f), over=fin.scrollHeight>f.clientHeight+0.5; f.classList.toggle('scy',over); if(over&&!f._s){ f._s=1; f.addEventListener('scroll',()=>f.classList.toggle('end',f.scrollTop+f.clientHeight>=f.scrollHeight-2)); } return over; });
  if(prev!==cfg.vh){ vw.style.height=prev+'px'; void vw.offsetHeight; vw.style.transition=''; vw.style.height=cfg.vh+'px'; } else vw.style.transition='';
  vw._h=cfg.vh; n._fit={exp,vh:cfg.vh,lv:cfg.lv,fs:cfg.fs,scroll:res.some(x=>x)}; ytShow(); return n._fit; }
let rT=0; function refit(){ clearTimeout(rT); rT=setTimeout(()=>{ if(!$('#lv').classList.contains('off')){ fit(); drawBands(); } },120); }
addEventListener('resize',refit); if(window.visualViewport) visualViewport.addEventListener('resize',refit); if(document.fonts) document.fonts.addEventListener('loadingdone',refit);
/* ---------- 악보 따라가기 ---------- */
function perfPos(bt,t){ if(!bt) return null; if(t<bt[0]){ const beat=(bt[1]-bt[0])/3,p0=bt[0]-beat; return t<p0?null:-1+(t-p0)/beat; } for(let i=0;i<bt.length-1;i++) if(bt[i]<=t&&t<bt[i+1]) return i+(t-bt[i])/(bt[i+1]-bt[i]); return null; }
const barOf=i=>L.order?L.order[i]:i+1;
function locate(k,pos){ if(pos===null) return null; const s=L.steps[k]; let n,f; if(pos<0){ n=0; f=pos+1; } else { const i=Math.floor(pos); n=barOf(i); f=pos-i; }
  if(!s.sys) return {sys:-1,n}; for(let j=0;j<s.sys.length;j++){ const b=s.sys[j].bars.find(b=>b[0]===n); if(b) return {sys:j,x:(b[1]+f*(b[2]-b[1]))/s.sys[j].w*100,n}; } return {sys:-1,n}; }
function drawBands(){ const n=$('#stage .page:last-child'), sco=n&&$('#sco',n); const out={}; if(!P||typeof P.k!=='number') return out; const k=P.k, prim=P.who||'A';
  ['A','B'].forEach(w=>{ const c=clip(k,w), bt=L.bt&&L.bt[w], tt=Math.min(P.t,c[1]-c[0]); out[w]=P.who&&P.t>0?locate(k,perfPos(bt,c[0]+tt)):null; });
  if(!sco) return out; const sys=[...sco.querySelectorAll('.sy')];
  if(sco.classList.contains('one')){ let j=sco._j; if(j===undefined){ const s=L.steps[k]; j=s.sys.map((y,i)=>[y.bars.filter(b=>s.rng&&b[0]>=s.rng[0]&&b[0]<=s.rng[1]).length,i]).sort((a,b)=>b[0]-a[0])[0][1]; } const Lp=out[prim]; if(Lp&&Lp.sys>=0) j=Lp.sys; sco._j=j; sys.forEach((y,i)=>y.classList.toggle('cur',i===j)); }
  ['A','B'].forEach(w=>{ const b=$('#bd'+w,sco), Lx=out[w]; const on=!!(Lx&&Lx.sys>=0&&sys[Lx.sys].offsetHeight>0); b.classList.toggle('on',on); b.classList.toggle('ghost',w!==prim); if(on){ const y=sys[Lx.sys]; b.style.top=y.offsetTop+'px'; b.style.height=y.offsetHeight+'px'; b.style.left=(y.offsetLeft+Lx.x/100*y.offsetWidth)+'px'; } });
  return out; }
function scoreTap(e){ if(!P||typeof P.k!=='number') return; const k=P.k, s=L.steps[k], w=P.who||'A'; const sys=[...$('#sco').querySelectorAll('.sy')].filter(y=>y.offsetHeight>0);
  const el=sys.find(y=>{ const r=y.getBoundingClientRect(); return e.clientY>=r.top&&e.clientY<=r.bottom; })||sys[0]; const j=+el.dataset.j, sy=s.sys[j], r=el.getBoundingClientRect();
  const xp=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*sy.w; let b=sy.bars.find(b=>xp>=b[1]&&xp<b[2])||(xp<sy.bars[0][1]?sy.bars[0]:sy.bars[sy.bars.length-1]);
  const f=Math.max(0,Math.min(.95,(xp-b[1])/(b[2]-b[1]))), n=b[0], bt=L.bt[w], c=clip(k,w); const idx=L.order?L.order.findIndex((v,i)=>v===n&&bt[i]>=c[0]-2):n-1;
  let tAbs=n===0?Math.max(c[0],bt[0]-(bt[1]-bt[0])/3):(idx>=0?bt[idx]+f*(bt[idx+1]-bt[idx]):c[0]); playW(w,Math.max(0,Math.min(c[1]-c[0]-0.2,tAbs-c[0]))); }
/* ---------- 유튜브 ---------- */
const YTP={A:null,B:null}; let YTready=false;
function ytLoad(){ if(window.YT&&YT.Player){ YTready=true; return; } if($('#ytapi')) return; window.onYouTubeIframeAPIReady=()=>{ YTready=true; ytMake(); }; const s=document.createElement('script'); s.id='ytapi'; s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); }
function ytMake(){ if(!YTready||!L||YTP.A) return; ['A','B'].forEach(w=>{ YTP[w]=new YT.Player('yt'+w,{width:'100%',height:'100%',videoId:L[w].yt,playerVars:{playsinline:1,rel:0,modestbranding:1,controls:1,origin:location.origin},
  events:{onReady:()=>{ YTP[w]._ok=true; YTP[w]._vid=L[w].yt; },onStateChange:e=>{ if(P&&P.who===w){ if(e.data===1){ P.loading=false; P.playing=true; P.err=null; loop(); endWatch(); } else if((e.data===2||e.data===0)&&P.playing){ P.playing=false; draw(); } } },
  onError:e=>{ if(P&&P.who===w){ P.err=w; P.loading=false; P.playing=false; $('#yerrl').href=`https://www.youtube.com/watch?v=${L[w].yt}`; $('#yerr').classList.add('on'); draw(); } }}}); }); }
function ytSong(){ ytLoad(); if(YTP.A&&YTP.A._ok){ ['A','B'].forEach(w=>{ if(YTP[w]._vid!==L[w].yt){ try{ YTP[w].cueVideoById(L[w].yt); }catch(e){} YTP[w]._vid=L[w].yt; } }); } else ytMake(); }
const ok=w=>YTP[w]&&YTP[w]._ok;
function ytShow(){ const on=!!(P&&P.who&&(P.playing||P.loading||P.err===P.who)); ['A','B'].forEach(w=>$('#yp'+w).classList.toggle('on',on&&P.who===w)); if(!(P&&P.err)) $('#yerr').classList.remove('on'); }
function playW(w,tRel){ if(!P||P.k===null) return; const o=w==='A'?'B':'A', c=clip(P.k,w); if(ok(o)) try{ YTP[o].pauseVideo(); }catch(e){}
  if(tRel==null) tRel=(P.who===w&&!P.ended&&P.t<c[1]-c[0]-0.3)?P.t:0; P.who=w; P.ended=false; P.err=null; P.t=tRel; P.loading=true; P.playing=false; P.t0=performance.now();
  if(ok(w)){ try{ YTP[w].seekTo(c[0]+tRel,true); YTP[w].playVideo(); }catch(e){} } else ytSong();
  if(typeof P.k==='number'){ (heard[L.id][P.k] ||= {}); } draw(); loop(); }
function toggle(w){ if(!P) return; if(P.who===w&&(P.playing||P.loading)){ pause(); return; } playW(w,null); }
function pause(){ if(!P) return; if(P.who&&ok(P.who)) try{ YTP[P.who].pauseVideo(); }catch(e){} P.playing=false; P.loading=false; cancelAnimationFrame(P.raf); draw(); }
function stopAll(){ ['A','B'].forEach(w=>{ if(ok(w)) try{ YTP[w].pauseVideo(); }catch(e){} }); if(P){ cancelAnimationFrame(P.raf); clearTimeout(P.eto); P.playing=false; P.loading=false; } }
function swapSame(){ if(!P||!P.who||!L.bt) return; const from=P.who, to=from==='A'?'B':'A', cf=clip(P.k,from), ct=clip(P.k,to);
  if(P.playing&&ok(from)) try{ P.t=Math.max(0,YTP[from].getCurrentTime()-cf[0]); }catch(e){}
  const pos=perfPos(L.bt[from],cf[0]+P.t); let tAbs=ct[0]; if(pos!==null&&pos>=0){ const bt=L.bt[to], i=Math.floor(pos), f=pos-i; if(bt[i+1]) tAbs=bt[i]+f*(bt[i+1]-bt[i]); }
  playW(to,Math.max(0,Math.min(ct[1]-ct[0]-0.1,tAbs-ct[0]))); }
function loop(){ if(!P) return; cancelAnimationFrame(P.raf); const f=()=>{ if(!P||!P.who) return; if(P.err){ P.playing=false; P.loading=false; draw(); return; } const w=P.who, c=clip(P.k,w), pl=YTP[w];
  if(ok(w)){ let st=-9,cur=0; try{ st=pl.getPlayerState(); cur=pl.getCurrentTime(); }catch(e){}
    if(st===1){ if(!P.playing){ P.playing=true; endWatch(); } P.loading=false; P.t=Math.max(0,cur-c[0]); if(cur>=c[1]-0.05){ try{ pl.pauseVideo(); }catch(e){} done(w); return; } }
    else if((st===2||st===0)&&!P.loading) P.playing=false; else if(P.loading&&performance.now()-P.t0>12000) P.loading=false; }
  draw(); if(P.playing||P.loading) P.raf=requestAnimationFrame(f); }; P.raf=requestAnimationFrame(f); }
function endWatch(){ if(!P) return; clearTimeout(P.eto); if(!P.playing||!ok(P.who)) return; const w=P.who, c=clip(P.k,w); let cur=0; try{ cur=YTP[w].getCurrentTime(); }catch(e){ return; }
  if(cur>=c[1]-0.12){ try{ YTP[w].pauseVideo(); }catch(e){} done(w); return; } if(typeof P.k==='number'&&cur-c[0]>10) heard[L.id][P.k][w]=1; P.eto=setTimeout(endWatch,Math.max(30,Math.min(400,(c[1]-cur)*1000-80))); }
function done(w){ P.playing=false; P.t=clip(P.k,w)[1]-clip(P.k,w)[0]; P.ended=true; if(typeof P.k==='number') heard[L.id][P.k][w]=1; draw(); }
function setNow(){ const nowH=P&&P.who?`<b>${P.who} ${esc(L[P.who].full)}</b> · ${P.playing?'재생 중':P.loading?'불러오는 중':P.ended?'끝':'멈춤'}`:''; if($('#now').innerHTML!==nowH) $('#now').innerHTML=nowH; }
function draw(){ if(!P) return; const n=$('#stage .page:last-child'); if(!n) return; setNow(); const exp=!!(P.who&&(P.playing||P.loading||P.err===P.who)); if(n._fit&&n._fit.exp!==exp) fit();
  const Lx=drawBands(); const k=P.k;
  ['A','B'].forEach(x=>{ const b=$('#pl'+x,n); if(!b) return; const on=P.who===x&&(P.playing||P.loading); b.classList.toggle('on',on); if(typeof k==='number') b.classList.toggle('heard',!!(heard[L.id][k]&&heard[L.id][k][x]));
    const c=clip(k,x), s=$('#ps'+x,n); s.textContent=(P.who===x&&P.loading)?'불러오는 중…':P.err===x?'재생이 안 돼요':(P.who===x&&P.t>0)?`${P.playing?'재생 중':'멈춤'} ${f1(P.t)}${Lx[x]&&Lx[x].n?' · '+Lx[x].n+'마디':''}`:(P.who&&P.t>0&&Lx[x]&&Lx[x].n&&typeof k==='number')?`같은 때 ${Lx[x].n}마디`:(k==='full'?'처음부터 끝까지':`${fmt(c[0])}~${fmt(c[1])} (${Math.round(c[1]-c[0])}초)`);
    if(s.scrollWidth>s.clientWidth+1){ const alts=(P.who===x&&P.t>0)?[`${f1(P.t)}${Lx[x]&&Lx[x].n?' · '+Lx[x].n+'마디':''}`,`${fmt(P.t)}${Lx[x]&&Lx[x].n?' · '+Lx[x].n+'마디':''}`]:(k==='full'?['처음부터']:[`${fmt(c[0])}~${fmt(c[1])}`]); for(const al of alts){ s.textContent=al; if(s.scrollWidth<=s.clientWidth+1) break; } }
    const pr=$('#pr'+x,n); if(pr) pr.style.width=(P.who===x?Math.min(100,P.t/(c[1]-c[0])*100):0)+'%'; });
  const sw=$('#swp',n); if(sw) sw.classList.toggle('on',!!P.playing);
  if(typeof k==='number'){ const h=heard[L.id][k]||{}; const a=$('#aft',n); if(a) a.classList.toggle('ready',!!(h.A&&h.B)&&!a.classList.contains('open')); n.querySelector('.card').classList.toggle('done',!!(h.A&&h.B)); }
  ytShow(); }

  ps:()=>{ const w=P&&P.who; let st=null,cur=null; try{ st=w&&YTP[w].getPlayerState(); cur=w&&+YTP[w].getCurrentTime().toFixed(2); }catch(e){} return {who:w,playing:P&&P.playing,t:P&&+P.t.toFixed(2),state:st,cur,err:P&&P.err,vh:$('#vwrap')._h}; },
  sim:(w,t)=>{ P.who=w; P.playing=!!w; P.t=t||0; fit(); draw(); }, flip:()=>$('#aft').click(), P:()=>P };
