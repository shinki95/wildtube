<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>비교 듣기 · 10판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--red:#fa2d48;--ink:#1c1c1e;--sub:#8a8a8e;--line:#e5e5ea;--fill:#f2f2f7;--ease:cubic-bezier(.2,.8,.2,1);
--font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Apple SD Gothic Neo','Pretendard',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#d9d6d0}
body{font-family:var(--font);color:var(--ink);word-break:keep-all;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
#app{position:relative;width:100%;max-width:430px;height:100dvh;max-height:932px;background:#fff;overflow:hidden;overflow:clip}
.view{position:absolute;inset:0;overflow:hidden;background:#fff}
.hide{visibility:hidden;pointer-events:none}
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
/* ---- 둘러보기 (6판 그대로) ---- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;z-index:40;display:flex;justify-content:space-around;padding:4px 8px 22px;background:rgba(250,250,252,.78);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-top:.5px solid rgba(0,0,0,.12)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#9a9a9e;min-height:48px}
.tabbar button.on{color:var(--red)}
.page{position:absolute;inset:0;padding-bottom:90px}
.lt{padding:46px 20px 4px;font-size:34px;font-weight:800;letter-spacing:-.02em}
.sub0{padding:0 20px;font-size:16px;color:var(--sub)}
.shelf{margin-top:14px}
.sh{display:flex;justify-content:space-between;align-items:center;padding:0 20px;height:30px}
.sh b{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sh span{font-size:22px;color:var(--sub)}
.row{display:flex;gap:14px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:10px 20px 4px;scrollbar-width:none;scroll-padding:0 20px}
.row::-webkit-scrollbar{display:none}
.card{flex:none;width:186px;scroll-snap-align:start;text-align:left}
.duo{position:relative;border-radius:12px;overflow:hidden;background:#111;box-shadow:0 10px 24px -12px rgba(0,0,0,.55)}
.duo img{position:absolute;top:0;height:100%;object-fit:cover}
.duo img.a{left:0;width:62%}
.duo img.b{right:0;clip-path:polygon(38% 0,100% 0,100% 100%,0 100%);width:76%}
.duo .ab{position:absolute;bottom:8px;width:24px;height:24px;border-radius:6px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff}
.card b{display:block;font-size:16px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:block;font-size:16px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circ{flex:none;width:84px;text-align:center;scroll-snap-align:start}
.circ i{display:block;width:84px;height:84px;border-radius:50%;overflow:hidden;background:#ddd;box-shadow:0 4px 14px -8px rgba(0,0,0,.5)}
.circ img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.circ b{display:block;font-size:16px;font-weight:500;margin-top:7px}
.sbox{margin:6px 20px 0;height:44px;border-radius:12px;background:var(--fill);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--sub)}
.sbox input{flex:1;border:0;background:none;font:16px var(--font);outline:none;color:var(--ink);height:44px}
.list{padding:8px 20px}
.li{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.li .th{width:52px;height:52px;border-radius:8px;overflow:hidden;flex:none;position:relative}
.li .th img{position:absolute;top:0;height:100%;width:60%;object-fit:cover}
.li b{display:block;font-size:16px;font-weight:600}
.li span{display:block;font-size:15px;color:var(--sub)}

/* ---- 레슨 (애플 뮤직 톤) ---- */
#ls{position:absolute;inset:0;z-index:60;color:#fff;transform:translateY(100%);background:#000;overflow:hidden;overflow:clip;touch-action:pan-x pinch-zoom;user-select:none;-webkit-user-select:none}
#ls .bg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(34px) saturate(1.4) brightness(.42);transform:scale(1.1);transition:background-image .6s}
#ls .bg2{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.1) 40%,rgba(0,0,0,.45))}
.glass{background:rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 26px -12px rgba(0,0,0,.6)}
.dglass{background:rgba(10,10,12,.42);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 18px 40px -20px rgba(0,0,0,.8)}
.top{position:absolute;left:0;right:0;top:0;z-index:6;height:118px}
.hd{height:44px;display:flex;align-items:center;padding:0 4px}
.hd button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.hd .tt{flex:1;text-align:center;font-size:15px;font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:44px}
.nav{padding:0 14px}
.nmap{position:relative;height:10px;margin:0 6px}
.nmap .tr{position:absolute;left:0;right:0;top:3px;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
.nmap i{position:absolute;top:2px;height:6px;border-radius:3px;background:rgba(255,255,255,.55)}
.nmap i.on{background:var(--red);box-shadow:0 0 8px rgba(250,45,72,.8)}
.ncon{height:12px;margin:0 6px}
.ncon svg{width:100%;height:12px}
.nums{display:flex;justify-content:space-between}
.nums button{width:44px;height:44px;border-radius:50%;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .3s var(--ease),transform .3s var(--ease)}
.nums button.on{background:var(--red);border-color:var(--red);box-shadow:0 6px 18px -6px rgba(250,45,72,.9);transform:scale(1.06)}
.nums button.seen:not(.on){color:#ffb3be}
.pnm{height:30px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;text-overflow:ellipsis;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;padding:0 8px}
.pnm span{font-size:13px;font-weight:500;opacity:.75}
.stage{position:absolute;left:0;right:0;top:118px;bottom:52px;z-index:2}
.scr{position:absolute;inset:0;padding:6px 24px 10px 14px;display:flex;flex-direction:column}
.scr.bar{bottom:140px}
.bot{position:absolute;left:0;right:0;bottom:0;height:52px;z-index:7;display:flex;align-items:center;padding:0 2px}
.bot button{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.bot button[disabled]{opacity:.25}
.dots{flex:1;display:flex;justify-content:center;align-items:center;gap:12px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}
.dots .g{display:flex;align-items:center;gap:4px;opacity:.55}
.dots .g.on{opacity:1}
.dots .g i{width:6px;height:6px;border-radius:3px;background:#fff;opacity:.45}
.dots .g i.on{width:16px;opacity:1;background:var(--red)}
/* 글 카드 */
.tcard{flex:1;border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.kick{font-size:13px;font-weight:800;letter-spacing:.1em;color:#ff8a9b}
.tcard h3{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-top:4px}
.txt p{font-size:17px;line-height:1.68;margin-top:12px;color:rgba(255,255,255,.95);font-weight:450}
.txt p b{font-weight:800}
.pull{font-size:20px;font-weight:800;line-height:1.5;margin-top:16px;padding-left:14px;border-left:3px solid var(--red)}
.two{display:grid;grid-template-columns:1fr 1px 1fr;margin-top:12px;border-top:1px solid rgba(255,255,255,.35)}
.two .ln{background:rgba(255,255,255,.25)}
.two .c{padding:10px 10px 4px 0}
.two .c.b{padding:10px 0 4px 12px}
.two .tg{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800}
.two .tg i{font-style:normal;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.two .c p{font-size:17px;line-height:1.62;margin-top:6px;color:rgba(255,255,255,.95)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:17px;line-height:1.55}
.chk b{flex:none;font-size:13px;font-weight:800;padding:4px 8px;border-radius:7px;margin-top:2px}
.note{font-size:14px;opacity:.8;margin-top:10px;line-height:1.5}
.tbl .r{margin-top:12px}
.tbl .k{font-size:16px;font-weight:700}
.tbl .row{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:16px;font-variant-numeric:tabular-nums}
.tbl .row span{width:18px;font-weight:800}
.tbl .row i{display:block;height:14px;border-radius:7px;transform-origin:left}
.tbl .row em{font-style:normal;font-weight:800;min-width:52px}
.more{font-size:13px;opacity:.75;margin-top:auto;padding-top:8px;text-align:right}
/* 표지 */
.cv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:900px}
.cv .stack{position:relative;width:290px;height:248px}
.cv .ca,.cv .cb{position:absolute;width:194px;height:194px;border-radius:14px;overflow:hidden;box-shadow:0 26px 50px -18px rgba(0,0,0,.85)}
.cv .ca{left:0;top:0;transform:rotateY(14deg) rotateZ(-3deg)}
.cv .cb{right:0;bottom:0;transform:rotateY(-14deg) rotateZ(3deg)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .tg{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:8px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cv h1{font-size:32px;font-weight:800;letter-spacing:-.025em;margin-top:26px;text-align:center}
.cv .vs{font-size:20px;color:#ff6b80;font-weight:600;margin-top:4px}
.cv .q{font-size:19px;font-weight:600;line-height:1.45;text-align:center;margin-top:14px}
/* 듣기 */
.vid{position:relative;width:316px;aspect-ratio:16/9;margin:2px auto 0;border-radius:12px;overflow:hidden;flex:none;box-shadow:0 18px 36px -16px rgba(0,0,0,.8)}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s var(--ease)}
.vid .yt{position:absolute;left:8px;bottom:6px;font-size:12px;font-weight:700;background:rgba(0,0,0,.55);padding:3px 7px;border-radius:6px}
.vid .who{position:absolute;right:8px;top:8px;font-size:12px;font-weight:800;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.55)}
.lanes{margin:12px 0 0}
.lane{background:#fbfaf7;border-radius:14px;padding:6px 6px 4px;color:var(--ink);margin-bottom:8px;box-shadow:0 12px 28px -16px rgba(0,0,0,.7);border:2px solid transparent;transition:border-color .3s var(--ease)}
.lane.on{border-color:var(--c)}
.lh{display:flex;justify-content:space-between;align-items:center;font-size:15px;height:24px;font-weight:600;padding:0 4px}
.lh i{font-style:normal;display:inline-flex;width:20px;height:20px;border-radius:6px;background:var(--c);color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center;margin-right:6px}
.lh .clk{color:var(--c);font-variant-numeric:tabular-nums}
.sc{position:relative}
.sc img{position:absolute;left:0;top:0;width:100%;transition:opacity .35s var(--ease);opacity:0}
.sc img.on{opacity:1}
.sc .done{position:absolute;top:8%;bottom:8%;left:0;background:var(--c);opacity:.12;border-radius:3px}
.sc .hdl{position:absolute;top:2%;bottom:2%;width:4px;margin-left:-2px;background:var(--c);border-radius:2px;opacity:0;transition:opacity .25s}
.sc.live .hdl{opacity:1}
.lane.ghost .sc .hdl{opacity:0}
.lane.ghost .sc.live .hdl{opacity:.45;background:repeating-linear-gradient(180deg,var(--c) 0 6px,transparent 6px 10px)}
.lane.ghost .sc .done{opacity:.05}
.sw{height:44px;margin:0 auto 8px;padding:0 16px;border-radius:22px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;opacity:.35;transition:opacity .3s}
.sw.on{opacity:1}
.abtn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto}
.big{height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:700;transition:transform .25s var(--ease),background .3s}
.big:active{transform:scale(.96)}
.big .k{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.big.on{background:rgba(255,255,255,.92);color:var(--ink)}
.big.b.on{color:var(--red)}
/* 미니 A/B 바 */
.pbar{position:absolute;left:8px;right:8px;bottom:56px;height:136px;z-index:8;border-radius:20px;padding:8px;display:flex;gap:10px;transition:transform .45s var(--ease),opacity .3s;background:rgba(30,30,32,.62)}
.pbar.off{transform:translateY(40px);opacity:0;pointer-events:none}
.pbar .pv{position:relative;width:204px;height:115px;border-radius:10px;overflow:hidden;flex:none}
.pbar .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.pbar .pv span{position:absolute;left:6px;bottom:5px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:5px}
.pbar .pr{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.pbar .ab2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pbar .ab2 button{height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:16px}
.pbar .ab2 button.on{background:rgba(255,255,255,.92);color:var(--ink)}
.pbar .ab2 button.b.on{color:var(--red)}
.pbar .st{font-size:13px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;height:16px}
.pbar .sw2{height:44px;border-radius:14px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;opacity:.4}
.pbar .sw2.on{opacity:1}
/* 끝 */
.curve{border-radius:20px;padding:14px 12px 12px}
.curve .lg{display:flex;gap:12px;font-size:14px;margin-bottom:6px;flex-wrap:wrap}
.curve .lg b{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.curve svg.cv2{width:100%;height:auto}
.endbt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto}
.go{height:56px;border-radius:16px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ---- 10판: 번호 없는 곡 지도 + 어포던스 ---- */
.nmap{position:relative;height:44px;margin:0 6px;cursor:pointer;touch-action:none}
.nmap .tr{position:absolute;left:0;right:0;top:19px;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.nmap i{position:absolute;top:17px;height:10px;border-radius:5px;background:transparent;border:1.5px solid rgba(255,255,255,.65);box-sizing:border-box;transition:background .3s,border-color .3s,transform .25s var(--ease)}
.nmap i.past{background:rgba(255,255,255,.55);border-color:transparent}
.nmap i.on{background:var(--red);border-color:var(--red);box-shadow:0 0 10px rgba(250,45,72,.85);transform:scaleY(1.25)}
.nmap i.hov{border-color:#fff;transform:scaleY(1.5)}
.nmap .thumb{position:absolute;top:11px;width:4px;height:22px;margin-left:-2px;border-radius:2px;background:#fff;opacity:0;transition:opacity .2s}
.nmap.drag .thumb{opacity:1}
.bub{position:absolute;top:84px;z-index:20;max-width:300px;padding:9px 14px;border-radius:14px;font-size:15px;font-weight:700;white-space:nowrap;opacity:0;transform:translate(-50%,-6px);transition:opacity .2s,transform .2s var(--ease);pointer-events:none;background:rgba(20,20,22,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.22);box-shadow:0 10px 24px -10px rgba(0,0,0,.8)}
.bub.on{opacity:1;transform:translate(-50%,0)}
.bub small{display:block;font-size:13px;font-weight:500;opacity:.8;margin-top:2px}
.bub::before{content:"";position:absolute;left:var(--ax,50%);top:-6px;width:12px;height:12px;margin-left:-6px;background:rgba(20,20,22,.88);transform:rotate(45deg);border-left:1px solid rgba(255,255,255,.22);border-top:1px solid rgba(255,255,255,.22)}
.pnm{height:30px}
.peek{position:absolute;right:7px;top:18px;bottom:22px;width:12px;border-radius:0 14px 14px 0;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-left:0;transition:opacity .3s,bottom .3s}
.peek.bar{bottom:156px}
.peek.off{opacity:0}
.nxl{width:auto!important;min-width:48px;padding:0 6px 0 12px;border-radius:24px!important;gap:2px;font-size:14px;font-weight:700}
.nxl span{opacity:.85}
.dots{gap:14px}
.dots .g{gap:5px;opacity:.5}
.dots .g svg{width:15px;height:15px}
.dots .g i{width:8px;height:3px;border-radius:2px}
.dots .g i.on{width:16px}
.tcard.dglass{box-shadow:none;border-color:rgba(255,255,255,.07);background:rgba(0,0,0,.26)}
.big{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.08));box-shadow:0 6px 0 rgba(0,0,0,.38),0 16px 28px -12px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .12s,box-shadow .12s,background .3s}
.big:active,.press:active{transform:translateY(4px)!important;box-shadow:0 2px 0 rgba(0,0,0,.38),0 6px 14px -8px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.35)!important}
.press{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.08));box-shadow:0 4px 0 rgba(0,0,0,.38),0 12px 22px -10px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .12s,box-shadow .12s}
.lane{cursor:pointer;position:relative}
.lane .ftip{position:absolute;top:30px;padding:4px 9px;border-radius:9px;background:var(--c);color:#fff;font-size:13px;font-weight:800;transform:translate(-50%,-110%);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:3}
.lane .ftip.on{opacity:1}
.tapcap{font-size:13px;opacity:.75;text-align:center;margin:-2px 0 6px}
.cv .stack{filter:drop-shadow(0 30px 30px rgba(0,0,0,.45));transform:translateY(-6px)}
/* 평단 카드 (c) */
.whr{display:flex;align-items:center;gap:10px;margin-top:12px}
.whr .pc{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 6px 14px -6px rgba(0,0,0,.7)}
.whr .pc img{width:100%;height:100%;object-fit:cover;display:block}
.whr b{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.whr span{font-size:18px;font-weight:800}
.claim .txt p{font-size:20px;font-weight:700;line-height:1.52;letter-spacing:-.01em}
.claim .txt p.note{font-size:14px;font-weight:450}
.lbtn{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:800;margin-top:14px;width:100%}
.lbtn.B{color:#fff}
.lbtn i{font-style:normal;width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.lb2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 판 비교용 (a)(b) */
.segv{display:grid;grid-template-columns:1fr 1fr;border-radius:12px;padding:3px;margin-top:12px;background:rgba(255,255,255,.14);height:48px;position:relative}
.segv button{position:relative;z-index:1;font-size:16px;font-weight:700;border-radius:9px}
.segv button.on{background:rgba(255,255,255,.92);color:var(--ink)}

<script>
const D={"items": [{"id": "brahms-op118-2", "por": "brahms", "title": "인터메초 118-2", "comp": "브람스", "q": "굴드가 37초 더 길어요. 어디서 시간을 쓸까요?", "A": {"s": "페라이어", "y": 2010}, "B": {"s": "굴드", "y": 1960}}, {"id": "chopin-nocturne-20", "por": "chopin", "title": "녹턴 20번", "comp": "쇼팽", "q": "임윤찬이 34초쯤 더 길어요. 어디서 시간을 쓸까요?", "A": {"s": "조성진", "y": 2017}, "B": {"s": "임윤찬", "y": 2023}}, {"id": "bach-goldberg-aria", "por": "bach", "title": "골드베르크 아리아", "comp": "바흐", "q": "26년 뒤 같은 아리아가 71초 길어졌어요.", "A": {"s": "굴드", "y": 1955}, "B": {"s": "굴드", "y": 1981}}, {"id": "debussy-clair-de-lune", "por": "debussy", "title": "달빛", "comp": "드뷔시", "q": "조성진이 15초 더 길어요. 어디서 시간을 쓸까요?", "A": {"s": "기제킹", "y": 1953}, "B": {"s": "조성진", "y": 2017}}, {"id": "chopin-prelude-15", "por": "chopin", "title": "전주곡 ‘빗방울’", "comp": "쇼팽", "q": "조성진이 44초 더 길어요. 어디서 시간을 쓸까요?", "A": {"s": "조성진", "y": 2015}, "B": {"s": "폴리니", "y": 1974}}, {"id": "schumann-traumerei", "por": "schumann", "title": "트로이메라이", "comp": "슈만", "q": "꿈꾸듯 느린 호로비츠가 오히려 29초 짧아요.", "A": {"s": "호로비츠", "y": 1986}, "B": {"s": "아르헤리치", "y": 1983}}], "brahms": {"steps": [{"t": "처음 여덟 마디", "bl": "1~8마디", "ex": "곡은 세 음짜리 짧은 동기로 시작해요. 한 음 내려갔다가 위로 올라가는 이 작은 몸짓이 곡 전체의 씨앗이고, 뒤에서 계속 모양을 바꿔 돌아와요.", "pt": "첫 두 마디를 어떻게 꺼내는지 들어 보세요. 망설이며 시작하는지, 바로 흘러가는지.", "af": ["첫 두 마디에 페라이어는 5.5초, 굴드는 4.0초를 써요. ‘느리고 무거운 굴드’라는 평과 달리 시작은 굴드가 더 빨라요. 8마디 문장 끝에서는 둘 다 숨을 쉬어요(3.6초, 3.2초).", "처음 48마디 전체도 118초 대 122초로 거의 같아요. 그러니 37초는 아직 나오지 않았어요."], "bars": [["첫 두 마디", 5.5, 4.0], ["1~48마디", 118, 122]], "a": [0, 24], "b": [0, 21], "rng": [1, 8], "sys": [{"img": "img/s1_0.png", "w": 1100, "h": 236, "bars": [[0, 250, 293], [1, 293, 426], [2, 426, 589], [3, 589, 755], [4, 755, 909], [5, 909, 1044]]}, {"img": "img/s1_1.png", "w": 1100, "h": 229, "bars": [[6, 107, 308], [7, 308, 460], [8, 460, 592], [9, 593, 710], [10, 710, 873]]}], "cr": {"src": "음반 전체 평에서", "A": "이 음반의 페라이어는 앞으로 흘러가는 빠른 브람스라는 평을 들어요. 감정은 담되 감상에 젖지 않고, 문장을 긴 호흡으로 그린다는 말이 자주 붙어요.", "B": "굴드의 브람스 간주곡에는 대체로 템포가 느리고 무겁다는 평이 따라다녀요.", "chk": "숫자는 반대예요. 첫 두 마디는 페라이어 5.5초, 굴드 4.0초로 굴드가 더 빨라요. ‘빠른 페라이어, 느린 굴드’는 이 시작에는 맞지 않아요.", "v": "no"}}, {"t": "‘조금 빠르게’라고 쓴 곳", "bl": "38~48마디", "ex": "38마디에 cresc. un poco animato, ‘점점 크게, 조금 활기 있게’라고 적혀 있어요. 그리고 45마디에서 rit.(점점 느리게)로 브레이크를 걸고, 46마디 più lento(더 느리게)로 넘어가요.", "pt": "‘조금 빠르게’에서 정말 걸음이 빨라지는지, 그리고 브레이크를 어디서부터 거는지 들어 보세요.", "af": ["38~44마디에 페라이어 14.6초, 굴드 17.6초. 페라이어는 지시대로 실제로 빨라지고, 굴드는 거의 빨라지지 않아요. 그런데 45~48마디 브레이크 구간은 15.7초 대 15.8초로 똑같아요. 굴드는 빨라졌다 느려지는 굴곡을 작게, 페라이어는 크게 그려요. 굴드에게 ‘앞으로 가는 힘이 모자란다’는 평이 나오는 곳이 이런 자리예요."], "bars": [["38~44마디 (조금 빠르게)", 14.6, 17.6], ["45~48마디 (느려지기)", 15.7, 15.8]], "a": [89.6, 120.5], "b": [89.2, 123.2], "rng": [38, 48], "sys": [{"img": "img/s2_0.png", "w": 1100, "h": 244, "bars": [[38, 449, 602], [39, 602, 745], [40, 745, 890], [41, 890, 1044]]}, {"img": "img/s2_1.png", "w": 1100, "h": 253, "bars": [[42, 107, 287], [43, 287, 435], [44, 435, 581], [45, 581, 739], [46, 739, 892], [47, 892, 1044]]}, {"img": "img/s2_2.png", "w": 1100, "h": 229, "bars": [[48, 107, 138]]}], "cr": {"src": "곡 전체 평에서", "A": "이 대목을 따로 다룬 평은 없어요. 빠르기의 미세한 변화를 매끄럽게 다룬다는 칭찬은 같은 음반의 다른 곡(헨델 변주곡) 이야기예요.", "B": "템포가 지나치게 무거워 리듬의 추진력이 모자랄 때가 있다는 지적이 있어요.", "chk": "숫자와 맞아요. ‘조금 빠르게’ 구간에 페라이어 14.6초, 굴드 17.6초. 굴드는 거의 빨라지지 않아요.", "v": "yes"}}, {"t": "장조에서 단조로, 엇갈리는 두 손", "bl": "47~56마디", "ex": "가장조가 올림바단조로 어두워지고, 49마디부터 오른손은 한 박을 셋으로, 왼손은 둘로 나눠요. 크기가 다른 톱니바퀴 두 개가 맞물려 도는 것처럼 박의 처음에서만 맞고 그 사이는 계속 어긋나요. 악보에서 위아래 손의 음표 묶음 모양(3 표시)이 다른 걸 보세요.", "pt": "밝던 장조가 어두워지는 순간, 그다음 오른손 셋과 왼손 둘이 서로 다르게 흔들리는 느낌을 들어 보세요. 반복할 때는 오른손 노래 밑에서 움직이는 다른 선도 찾아보세요.", "af": ["이 부분 처음 8마디는 두 사람이 비슷해요(17.9초, 18.9초). 그런데 이 8마디를 반복할 때 굴드만 느려져요(페라이어 19.1초, 굴드 21.9초). 굴드가 시간을 쓰기 시작하는 곳이 여기예요.", "평단이 굴드의 이 녹음에서 자주 꼽는 ‘반복 때 끌어올리는 숨은 대선율’이 바로 이 반복이에요. 느려지는 2.8초는 그 안쪽 선을 들리게 하려고 쓰는 시간으로 들어 볼 수 있어요."], "bars": [["49~56마디 처음", 17.9, 18.9], ["49~56마디 반복", 19.1, 21.9]], "a": [110.0, 139.1], "b": [113.9, 142.8], "rng": [47, 56], "sys": [{"img": "img/s3_0.png", "w": 1100, "h": 253, "bars": [[47, 893, 1044]]}, {"img": "img/s3_1.png", "w": 1100, "h": 229, "bars": [[48, 107, 138], [49, 242, 448], [50, 448, 642], [51, 642, 835], [52, 835, 1044]]}, {"img": "img/s3_2.png", "w": 1100, "h": 269, "bars": [[53, 107, 309], [54, 309, 490], [55, 490, 684], [56, 684, 901]]}], "cr": {"src": "이 대목을 짚은 평", "A": "이 대목을 따로 다룬 평은 없어요. 세부를 하나하나 드러내면서도 문장을 길게 잇는다는 일반 평이 이곳의 담담한 반복과 이어져요.", "B": "가운데 부분을 반복할 때 오른손 노래 밑의 대선율을 끌어올린다는 평이 있어요. 주제가 단조로 다시 나올 때도 그 선이 살아 있고, 안쪽 성부를 도드라지게 한다는 말이 함께 붙어요.", "chk": "숫자와 맞아요. 반복에서 굴드만 2.8초 느려져요(19.1초 대 21.9초). 숨은 선을 들려주려고 쓰는 시간으로 들을 수 있어요.", "v": "yes"}}, {"t": "57마디, 찬송가 같은 화음", "bl": "57~64마디", "ex": "어두운 단조가 57마디에서 올림바장조로 풀리며 찬송가처럼 조용한 화음이 나와요. 악보에는 pp(아주 여리게), 그리고 più lento(더 느리게). 곡에서 가장 고요한 곳이에요.", "pt": "마디가 지날수록 걸음이 어떻게 바뀌는지 들어 보세요. 일정하게 흐르는지, 점점 멈춰 서는지.", "af": ["같은 8마디에 페라이어 24초, 굴드 31초. 굴드는 마디마다 조금씩 더 느려져서 한 마디 3초 남짓이 끝으로 가면 4초를 넘어요. 페라이어는 첫 마디만 길게 잡고 나머지는 거의 일정하게 흘러가요. ‘혼자 치는 듯한 내밀함’이 숫자로 보이는 곳이에요."], "bars": [["57~64마디", 24, 31]], "a": [150.4, 181.6], "b": [157.1, 195.4], "rng": [57, 64], "sys": [{"img": "img/s4_0.png", "w": 1100, "h": 269, "bars": [[57, 901, 1044]]}, {"img": "img/s4_1.png", "w": 1100, "h": 257, "bars": [[58, 107, 269], [59, 269, 425], [60, 425, 610], [61, 610, 774], [62, 774, 910], [63, 910, 1044]]}, {"img": "img/s4_2.png", "w": 1100, "h": 244, "bars": [[64, 107, 255]]}], "cr": {"src": "이 곡을 짚은 평", "A": "이 곡에서는 조금 더 머물렀으면 슬픔이 더 살았을 거라는 아쉬움이 있어요. 반대로 겉의 단맛을 덜어 내고도 알맞은 정서를 만든다는 칭찬도 있어요. 녹음 2분 34초쯤 작은 잡음이 있다는 지적도 있는데, 바로 이 대목 근처예요.", "B": "굴드 자신은 이 간주곡 녹음을 두고 ‘완전한 내향성, 짧게 터지는 아픔, 그리고 길게 이어지는 숨죽인 슬픔’이라고 했어요.", "chk": "숫자와 맞아요. 같은 8마디에 페라이어 24초, 굴드 31초. ‘덜 머무는 페라이어’가 여기서 가장 크게 보여요.", "v": "yes"}}, {"t": "처음 주제로 돌아오는 길", "bl": "69~77마디", "ex": "69마디쯤 크게 부풀었다가 rit.(점점 느리게), 그리고 76마디 a tempo(원래 빠르기로)에서 첫 주제가 돌아와요. 이 ‘느려졌다가 돌아오기’를 얼마나 하느냐가 두 사람의 가장 큰 차이예요.", "pt": "첫 주제가 돌아오는 첫 마디를 잘 들어 보세요. 바로 원래 걸음으로 돌아오는지, 한참 붙잡는지.", "af": ["65~75마디에 페라이어 26초, 굴드 39초. 돌아온 첫 마디(76마디)는 페라이어 3.6초, 굴드 6.9초로 거의 두 배예요. 페라이어는 a tempo 지시대 function sentences(t){ return t.split(/(?<=[.?!요다)])\s+/).filter(Boolean); }
/* 한 화면에 들어가는 만큼만: 넘치면 문장 단위로 다음 화면으로 */
function measBox(bar,cls){ const m=$('#meas'); m.innerHTML=`<div style="position:relative;height:${$('#stage').clientHeight}px"><div class="scr${bar?' bar':''}"><div class="tcard dglass ${cls||''}"><div class="mb"></div></div></div></div>`; return {card:m.querySelector('.tcard'),mb:m.querySelector('.mb')}; }
function fitsIn(B,html){ B.mb.innerHTML=html+'<div class="more">다음 화면에 이어져요 ›</div>'; return B.card.scrollHeight<=B.card.clientHeight+0.5; }
function paginate(bar,head,blocks,cls){ // blocks: [{p:'문단'}|{pull:'...'}|{raw:'html'}]
  const B=measBox(bar,cls), pages=[]; let cur='';
  const q=blocks.map(b=>({...b}));
  const render=b=>b.p!==undefined?`<p>${b.p}</p>`:b.pull!==undefined?`<div class="pull">${b.pull}</div>`:b.raw;
  while(q.length){ const b=q.shift(); const h=render(b);
    if(fitsIn(B,head+`<div class="txt">${cur+h}</div>`)){ cur+=h; continue; }
    if(b.p!==undefined||b.pull!==undefined){ const key=b.p!==undefined?'p':'pull'; const ss=sentences(b[key]); let take=[];
      for(const s of ss){ const t=[...take,s].join(' '); if(fitsIn(B,head+`<div class="txt">${cur+render({[key]:t})}</div>`)) take.push(s); else break; }
      if(take.length){ cur+=render({[key]:take.join(' ')}); q.unshift({[key]:ss.slice(take.length).join(' ')}); }
      else if(!cur){ cur=h; } else q.unshift(b);
    } else { if(!cur){ cur=h; } else q.unshift(b); }
    pages.push(cur); cur='';

  ['A','B'].forEach(x=>{ const on=w===x&&play; const ti=$('#t'+x); if(ti) ti.innerHTML=on?IC.pause:IC.play; const bb=$('#b'+x); if(bb) bb.classList.toggle('on',on); $('#q'+x).classList.toggle('on',on); $('#q'+x+'i').textContent=on?'❚❚':'▶'; });
  const sw=$('#sw'); if(sw) sw.classList.toggle('on',play); $('#qsw').classList.toggle('on',play); const o=w==='A'?'B':'A'; if(play){ if($('#swt')) $('#swt').textContent=`같은 자리에서 ${o}로`; $('#qswt').textContent=`같은 자리 ${o}`; }
  const vb=w==='B'; ['#vb','#pvb'].forEach(s=>{ const e=$(s); if(e) e.style.opacity=vb?1:0; }); ['#va','#pva'].forEach(s=>{ const e=$(s); if(e) e.style.opacity=vb?0:1; }); if($('#vw')) $('#vw').textContent=vb?`B ${it.B.s}`:`A ${it.A.s}`;
  $('#qst').textContent = w?`${w} ${f1(t)} · ${barTxt(w==='B'?Lb:La,k)}`:'A·B를 눌러 비교'; }
function toggle(w){ if(!P) return; if(P.who===w&&P.raf){ pauseP(); return; } if(P.who!==w) P.t=0; P.who=w; const c=clip(P.k,w); P.dur=c[1]-c[0]; if(P.t>=P.dur) P.t=0; runP(); }
function runP(){ cancelAnimationFrame(P.raf); P.last=performance.now(); const f=()=>{ const n=performance.now(); P.t+=(n-P.last)/1000; P.last=n; if(P.t>=P.dur){ P.t=P.dur; P.raf=0; draw(); return; } draw(); P.raf=requestAnimationFrame(f); }; P.raf=requestAnimationFrame(f); draw(); }
function pauseP(){ if(P&&P.raf){ cancelAnimationFrame(P.raf); P.raf=0; draw(); } }
function stopP(){ if(P&&P.raf){ cancelAnimationFrame(P.raf); P.raf=0; } }
function swapSame(){ if(!P||!P.raf) return; const k=P.k, from=P.who, to=from==='A'?'B':'A', cf=clip(k,from), ct=clip(k,to); const pos=perfPos(from==='A'?BR.btA:BR.btB,cf[0]+P.t); let tAbs=ct[0];
  if(pos!==null&&pos>=0){ const bt=to==='A'?BR.btA:BR.btB, i=Math.floor(pos), f=pos-i; tAbs=bt[i]+f*(bt[i+1]-bt[i]); }
  P.who=to; P.dur=ct[1]-ct[0]; P.t=Math.max(0,Math.min(P.dur-0.1,tAbs-ct[0])); runP(); }

function curveHTML(){ const A=BR.btA,B=BR.btB,n=Math.min(A.length,B.length)-1,W=340,H=170;
  const spb=bt=>{ const r=[]; for(let i=0;i<n;i++){ const s=[]; for(let j=Math.max(0,i-2);j<=Math.min(n-1,i+2);j++) s.push(bt[j+1]-bt[j]); r.push(s.reduce((a,b)=>a+b,0)/s.length); } return r; };
  const a=spb(A), b=spb(B), mx=Math.max(...a,...b)*1.05, mn=Math.min(...a,...b)*.9;
  const path=v=>v.map((y,i)=>`${i?'L':'M'}${(i/(n-1)*W).toFixed(1)},${(H-(y-mn)/(mx-mn)*H).toFixed(1)}`).join(' ');
  const rg=BR.steps.map(s=>{ const i0=A.findIndex(t=>t>=s.a[0]), i1=A.findIndex(t=>t>=s.a[1]); return [i0/(n-1),(i1<0?n-1:i1)/(n-1)]; });
  return `<div class="curve dglass"><div class="kick">곡 전체 빠르기</div><h3 style="font-size:22px;font-weight:800;margin:4px 0 10px">어디서 갈라지나</h3><div class="lg"><span><b style="background:#fff"></b>A ${esc(it.A.s)}</span><span><b style="background:var(--red)"></b>B ${esc(it.B.s)}</span><span style="opacity:.8;margin-left:auto">마디당 초 · 위가 느림</span></div>
   <div class="ehint" style="font-size:13px;opacity:.8;margin-bottom:4px">구간 띠를 누르면 그 포인트로 가요</div><div id="cwrap" style="position:relative;touch-action:none;cursor:pointer"><svg class="cv2" viewBox="0 -6 ${W} ${H+12}" aria-label="곡 전체 마디당 시간">${rg.map(([x0,x1],i)=>`<rect class="band" data-i="${i}" data-c="${(x0+x1)/2}" x="${x0*W}" y="0" width="${Math.max(6,(x1-x0)*W)}" height="${H}" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.35)" stroke-width="1"/>`).join('')}<path d="${path(a)}" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="${path(b)}" fill="none" stroke="#fa2d48" stroke-width="2.6" stroke-linejoin="round"/></svg></div>
   <div style="display:flex;justify-content:space-between;font-size:13px;opacity:.8;margin-top:2px"><span>처음</span><span>가운데</span><span>끝</span></div><p class="note">${esc(BR.credit)}</p></div>
   <div class="endbt"><button class="go glass" id="eb1">처음으로</button><button class="go glass" id="eb2">다른 곡</button></div>`; }
function initEnd(n){ $('#eb1',n).onclick=()=>go(0,-1); $('#eb2',n).onclick=closeLs; const cw=$('#cwrap',n); let dn=false,cur=-1; const bands=[...cw.querySelectorAll('.band')];
  const at=e=>{ const r=cw.getBoundingClientRect(), xp=(e.clientX-r.left)/r.width; let best=0,bd=9; bands.forEach(b=>{ const d=Math.abs(+b.dataset.c-xp); if(d<bd){bd=d;best=+b.dataset.i;} }); cur=best; bands.forEach(b=>b.setAttribute('fill',+b.dataset.i===cur?'rgba(250,45,72,.35)':'rgba(255,255,255,.12)'));
    const s=BR.steps[cur], bb=$('#bub'), A=$('#app').getBoundingClientRect(); showBub(cur,e.clientX-A.left); bb.style.top=(r.top-A.top-58)+'px'; };
  cw.onpointerdown=e=>{ dn=true; cw.setPointerCapture(e.pointerId); at(e); }; cw.onpointermove=e=>{ if(dn) at(e); };
  cw.onpointerup=()=>{ if(!dn) return; dn=false; setTimeout(()=>{ hideBub(); $('#bub').style.top=''; },500); if(cur>=0) jumpPt(cur+1); };
  n.querySelectorAll('.cv2 path').forEach((p,i)=>{ const L=p.getTotalLength(); p.style.strokeDasharray=L; anim(p,[{strokeDashoffset:L},{strokeDashoffset:0}],{delay:200+i*200,duration:1100}); }); }
addEventListener('resize',()=>{ if(it&&SCR.length){ const cur=SCR[si]; build(); const j=SCR.findIndex(s=>s.pt===cur.pt&&s.kind===cur.kind); go(Math.max(0,j),0); } });

  if(v==='a') return `<div class="tcard dglass"><div class="kick">(a) A|B 전환 · 평단에서는</div><div class="segv"><button class="on">A ${esc(it.A.s)}</button><button>B ${esc(it.B.s)}</button></div><button class="lsw glass press">♪ 바꿀 때 그 연주 듣기 · 켬</button><div class="txt"><p>${esc(cr.A)}</p></div>${verdict(cr)}</div>`;

  return SCR.find(x=>x.pt===3&&x.kind==='crit'&&x.html.includes('data-play="B"')).html; }

  bub:(i)=>{ const m=$('#nmap'), r=m.getBoundingClientRect(), s=BR.steps[i], x=r.left+((s.rng[0]+s.rng[1])/2-1)/BR.total*r.width; m.classList.add('drag'); $('#thumb').style.left=((x-r.left)/r.width*100)+'%'; m.querySelectorAll('i').forEach(e=>e.classList.toggle('hov',+e.dataset.i===i)); showBub(i,x-$('#app').getBoundingClientRect().left); }, open:k=>openStory(D.items[k||0]), go:i=>go(i,0), list:()=>SCR.map((s,i)=>i+':'+s.pt+':'+s.kind), find:(pt,kind,n)=>SCR.findIndex((s,i)=>s.pt===pt&&s.kind===kind&&SCR.slice(0,i).filter(x=>x.pt===pt&&x.kind===kind).length===(n||0)),
