<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Playfair+Display:ital,wght@0,700;0,800;1,600&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--paper:#fff;--ink:#161616;--sub:#5c5c5c;--soft:#e7e7e7;--red:#c8102e;--A:#161616;--B:#c8102e;--serif:'Noto Serif KR',serif;--mast:'Playfair Display',serif;--ease:cubic-bezier(.22,.8,.24,1)}

body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);word-break:keep-all;display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:relative;width:100%;max-width:430px;height:100dvh;max-height:932px;background:var(--paper);overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}

.num{font-family:var(--mast);font-variant-numeric:lining-nums tabular-nums}

.ib{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:22px}
.cta{height:56px;width:100%;background:var(--red);color:#fff;font-size:18px;font-weight:700}
/* ① 고르기 */
#pick{background:#fff}
.deck{position:absolute;inset:0;overflow:hidden;touch-action:none}
.rail{position:absolute;left:0;right:0;top:0;will-change:transform}
.pg{position:absolute;left:0;right:0;cursor:pointer}
.pg .ph{position:absolute;left:0;right:0;top:0;height:60%;overflow:hidden;background:#111}
.pg .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block;filter:grayscale(1) contrast(1.05)}
.pg .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 70%,rgba(0,0,0,.12) 100%)}
.pg .tx{position:absolute;left:0;right:0;top:60%;bottom:0;padding:22px 22px 26px;display:flex;flex-direction:column}

.top{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 12px;height:52px;color:#fff}

.cnt{position:absolute;right:20px;bottom:26px;z-index:4;font-size:15px;color:var(--sub)}
.sheet{position:absolute;left:0;right:0;top:0;background:#fff;z-index:20;box-shadow:0 20px 40px -20px rgba(0,0,0,.4);transform:translateY(-102%);transition:transform .45s var(--ease);padding:14px 16px 16px}
.sheet.on{transform:none}
.sheet .r1{display:flex;gap:8px}
.sheet input{flex:1;height:48px;border:1.5px solid var(--ink);font:16px 'Pretendard',sans-serif;padding:0 12px;outline:none;border-radius:0}

.res button{display:flex;width:100%;min-height:52px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--soft);font-size:16px}

.dim{position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:15;opacity:0;pointer-events:none;transition:opacity .35s}

/* ② 짝 카드 */
#pair .bar{border-bottom:1px solid var(--ink)}

.half{position:relative;flex:1;overflow:hidden;background:#111}

.half.b .who .tg{background:var(--B)}

#pair .foot,#q .foot,#after .foot{flex:none;padding:12px 16px 16px}
/* ②-1 질문 */
#q .body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 26px}
#q .duo{display:flex;gap:14px;margin-bottom:30px}

#q .qq{font-family:var(--serif);font-weight:900;font-size:34px;line-height:1.3;letter-spacing:-.02em}

.prog{flex:1;height:3px;background:var(--soft);margin:0 10px;position:relative;overflow:hidden}

.stage{position:relative;flex:1;overflow:hidden}
.step{position:absolute;inset:0;display:flex;flex-direction:column}
.vid{position:relative;aspect-ratio:16/9;background:#111;flex:none;overflow:hidden}

.vid .ab{position:absolute;top:8px;z-index:2;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;transition:opacity .3s}
.st{padding:14px 18px 2px}
.st h2{font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.25;overflow:hidden}
.st h2 span{display:inline-block}

.lane{margin-top:10px;padding:0 0 2px;border-left:5px solid transparent;transition:border-color .3s var(--ease)}
.lane.on{border-left-color:var(--c)}
.lh{display:flex;justify-content:space-between;align-items:center;font-size:16px;padding:0 16px 0 11px;height:26px}
.lh b{display:flex;align-items:center;gap:8px}
.lh .tg{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;background:var(--c)}
.lh .clk{font-size:18px;font-weight:700;color:var(--c)}
.sc{position:relative;aspect-ratio:1010/252;margin:2px 6px 0 2px}
.sc img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .3s var(--ease)}
.sc .done{position:absolute;top:0;bottom:0;left:0;background:var(--c);opacity:.10}
.sc .hd{position:absolute;top:-3px;bottom:-3px;width:4px;margin-left:-2px;background:var(--c);opacity:0;transition:opacity .25s}
.sc.live .hd{opacity:1}
.full{margin:12px 16px 0}
.full img{width:100%;max-height:190px;object-fit:contain;object-position:left top;display:block}
.ctrl{margin-top:auto;padding:10px 16px 16px;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;flex:none}
.ctrl button{height:56px;font-size:17px;font-weight:700;border:2px solid var(--c);color:var(--c);transition:background-color .25s,color .25s}
.ctrl button.on{background:var(--c);color:#fff}
.ctrl .both{--c:var(--ink)}
/* ③-1 들은 뒤 */
#after .body{flex:1;display:flex;flex-direction:column;padding:8px 26px 0}
#after .k{font-size:16px;color:var(--sub)}
.bars{flex:1;display:flex;gap:34px;align-items:flex-end;justify-content:center;padding:20px 10px 0;border-bottom:2px solid var(--ink);min-height:0}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:112px}
.col .v{font-size:46px;font-weight:700;line-height:1;margin-bottom:8px}
.col .v small{font:600 18px 'Pretendard';margin-left:2px}
.col .r{width:100%;background:var(--c);transform-origin:bottom}
.col .pp{width:56px;height:56px;border-radius:50%;overflow:hidden;margin-bottom:10px;border:3px solid #fff;outline:2px solid var(--c);order:-1;flex:none}
.col .pp img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
#after .cc{font-family:var(--serif);font-weight:900;font-size:28px;line-height:1.3;margin-top:22px;overflow:hidden}
#after .cc span{display:inline-block}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:#fff;font-size:15px;padding:12px 14px;opacity:0;transform:translateY(8px);transition:.3s var(--ease);pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head><body><div id="app">
<section class="scr" id="pick">
  <div class="top"><div class="tabs" id="tabs"><button class="on" data-s="week">이번 주</button><button data-s="comp">작곡가</button><button data-s="perf">연주자</button></div><button class="ib srch" id="so" aria-label="찾기"><i></i></button></div>

</section>

<section class="scr hide" id="q"></section>
<section class="scr hide" id="listen"><div class="bar"><button class="ib" id="lb" aria-label="뒤로">‹</button><div class="prog"><i id="pgb"></i></div><button class="ib" id="ln" aria-label="들은 뒤">›</button></div><div class="stage" id="stage"></div></section>

</div>
<script>
const D = {"items": [{"id": "brahms-op118-2", "por": "brahms", "lines": ["브람스", "인터메초 118-2"], "q": "굴드가 37초 더 길어요. 어디서 시간을 쓸까요?", "comp": "브람스", "A": {"s": "페라이어", "y": 2010}, "B": {"s": "굴드", "y": 1960}}, {"id": "bach-goldberg-aria", "por": "bach", "lines": ["바흐", "골드베르크 아리아"], "q": "26년 뒤 같은 아리아가 71초 길어졌어요. 어디서 늘었을까요?", "comp": "바흐", "A": {"s": "굴드", "y": 1955}, "B": {"s": "굴드", "y": 1981}}, {"id": "chopin-nocturne-20", "por": "chopin", "lines": ["쇼팽", "녹턴 20번"], "q": "임윤찬이 34초쯤 더 길어요. 어디서 시간을 쓸까요?", "comp": "쇼팽", "A": {"s": "조성진", "y": 2017}, "B": {"s": "임윤찬", "y": 2023}}, {"id": "chopin-prelude-15", "por": "chopin", "lines": ["쇼팽", "전주곡 ‘빗방울’"], "q": "조성진이 44초 더 길어요. 어디서 시간을 쓸까요?", "comp": "쇼팽", "A": {"s": "조성진", "y": 2015}, "B": {"s": "폴리니", "y": 1974}}, {"id": "debussy-clair-de-lune", "por": "debussy", "lines": ["드뷔시", "달빛"], "q": "조성진이 15초 더 길어요. 어디서 시간을 쓸까요?", "comp": "드뷔시", "A": {"s": "기제킹", "y": 1953}, "B": {"s": "조성진", "y": 2017}}, {"id": "schumann-traumerei", "por": "schumann", "lines": ["슈만", "트로이메라이"], "q": "꿈꾸듯 느린 호로비츠가 오히려 29초 짧아요. 어디서 갈릴까요?", "comp": "슈만", "A": {"s": "호로비츠", "y": 1986}, "B": {"s": "아르헤리치", "y": 1983}}], "brahms": {"steps": [{"t": "처음 여덟 마디", "pt": "첫 두 마디, 망설이나 바로 흐르나", "bar": ["첫 두 마디", 5.5, 4.0], "cc": "시작은 오히려 굴드가 더 빨라요.", "clips": [["A", 0, 24], ["B", 0, 21]], "img": null}, {"t": "‘조금 빠르게’라고 쓴 곳", "pt": "‘조금 빠르게’에서 정말 빨라지나", "bar": ["38~44마디 (조금 빠르게)", 14.6, 17.6], "cc": "지시대로 빨라지는 건 페라이어예요.", "clips": [["A", 89.6, 120.5], ["B", 89.2, 123.2]], "img": "img/brahms_2.png"}, {"t": "장조에서 단조로, 엇갈리는 두 손", "pt": "반복할 때 걸음이 바뀌나", "bar": ["49~56마디 반복", 19.1, 21.9], "cc": "반복에서 굴드만 느려져요.", "clips": [["A", 110.0, 139.1], ["B", 113.9, 142.8]], "img": "img/brahms_3.png"}, {"t": "57마디, 찬송가 같은 화음", "pt": "마디가 지날수록 멈춰 서나", "bar": ["57~64마디", 24, 31], "cc": "찬송가 대목, 굴드가 7초 더 써요.", "clips": [["A", 150.4, 181.6], ["B", 157.1, 195.4]], "img": "img/brahms_4.png"}, {"t": "처음 주제로 돌아오는 길", "pt": "돌아오는 첫 마디를 붙잡나", "bar": ["76마디", 3.6, 6.9], "cc": "돌아온 첫 마디, 굴드는 거의 두 배.", "clips": [["A", 190.2, 213.2], ["B", 206.5, 243.5]], "img": "img/brahms_5.png"}, {"t": "같은 주제, 처음과 돌아왔을 때", "pt": "같은 선율, 처음보다 무거운가", "bar": ["돌아와서 76~83마디", 20.3, 26.5], "cc": "같은 선율을 굴드는 훨씬 느리게.", "clips": [["A", 207.1, 228.5], ["B", 233.1, 260.8]], "img": "img/brahms_6.png"}, {"t": "마지막: 여기서는 둘이 비슷해요", "pt": "마지막 걸음과 여운", "bar": ["마지막 4마디", 15.7, 16.5], "cc": "끝에서는 둘이 거의 같아요.", "clips": [["A", 284.5, 310.4], ["B", 318.6, 346.9]], "img": "img/brahms_7.png"}], "btA": [1.91, 4.67, 7.39, 9.73, 12.4, 14.79, 17.32, 19.8, 23.35, 26.02, 28.45, 30.65, 33.65, 35.94], "btB": [1.31, 3.23, 5.34, 7.41, 10.17, 12.14, 14.58, 17.06, 20.28, 22.63, 24.69, 27.08, 29.89, 32.0]}};
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EASE = 'cubic-bezier(.22,.8,.24,1)';
const anim = (el, kf, o={}) => RM || !el ? {finished: Promise.resolve()} : el.animate(kf, {duration: 450, easing: EASE, fill: 'both', ...o});
const yt = (it, w, sq) => `img/yt_${it.id}_${w}${sq?'_sq':''}.jpg`;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
// 화면 넘김: 새 화면이 dir 방향에서 미끄러져 들어옴
function goScreen(from, to, dir=1){
  const F=$('#'+from), T=$('#'+to); T.classList.remove('hide');
  anim(T,[{transform:`translateX(${dir*100}%)`},{transform:'none'}],{duration:450,fill:'none'});
  anim(F,[{transform:'none',opacity:1},{transform:`translateX(${-dir*28}%)`,opacity:.4}],{duration:450,fill:'none'}).finished.then(()=>F.classList.add('hide'));
  if (RM) F.classList.add('hide');
}
let cur = D.items[0];

/* ① 고르기: 표지 넘기기 */
let order = D.items.slice(), ci = 0, H = 0;
function pageHTML(it,k){ return `<div class="pg" data-k="${k}" style="top:${k*H}px;height:${H}px"><div class="ph"><img src="img/p_${it.por}.jpg" alt="${esc(it.comp)} 초상"></div>
  <div class="tx"><div class="cmp">${esc(it.lines[0])}</div><h2>${esc(it.lines[1])}</h2><div class="vs"><span>${esc(it.A.s)}</span><em>vs</em><span style="color:var(--red)">${esc(it.B.s)}</span></div></div></div>`; }
function buildDeck(){ H=$('#deck').clientHeight; $('#rail').innerHTML=order.map(pageHTML).join(''); setRail(false);
  $('#rail').querySelectorAll('.pg').forEach(p=>p.onclick=()=>{ if(!moved) openPair(order[+p.dataset.k]); }); }
function setRail(a=true,dy=0){ const r=$('#rail'); r.style.transition=a&&!RM?'transform .5s var(--ease)':'none'; r.style.transform=`translateY(${-ci*H+dy}px)`; $('#cnt').textContent=`${ci+1} / ${order.length}`; }
function go(k){ ci=Math.max(0,Math.min(order.length-1,k)); setRail(true); }
let y0=null, moved=false;
$('#deck').addEventListener('pointerdown',e=>{y0=e.clientY;moved=false;});
$('#deck').addEventListener('pointermove',e=>{ if(y0===null)return; const dy=e.clientY-y0; if(Math.abs(dy)>6)moved=true; if(moved) setRail(false,dy*.9); });
$('#deck').addEventListener('pointerup',e=>{ if(y0===null)return; const dy=e.clientY-y0; y0=null; if(moved){ go(ci+(dy<-60?1:dy>60?-1:0)); setTimeout(()=>moved=false,0);} });
let wl=0; $('#deck').addEventListener('wheel',e=>{ e.preventDefault(); const n=Date.now(); if(n-wl<600||Math.abs(e.deltaY)<8)return; wl=n; go(ci+(e.deltaY>0?1:-1)); },{passive:false});
$('#tabs').onclick=e=>{ const b=e.target.closest('button'); if(!b)return; $('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  order=D.items.slice(); if(b.dataset.s==='comp') order.sort((a,b)=>a.comp.localeCompare(b.comp,'ko')); if(b.dataset.s==='perf') order.sort((a,b)=>a.A.s.localeCompare(b.A.s,'ko'));
  ci=0; anim($('#rail'),[{opacity:1},{opacity:0}],{duration:180}).finished.then(()=>{ buildDeck(); $('#rail').getAnimations().forEach(a=>a.cancel()); anim($('#rail'),[{opacity:0,transform:'translateY(24px)'},{opacity:1,transform:'none'}],{duration:380,fill:'none'}); }); };
function sheet(on){ $('#sheet').classList.toggle('on',on); $('#dim').classList.toggle('on',on); if(on){ $('#qi').value=''; results(''); } }
function results(q){ q=q.trim().toLowerCase(); const r=D.items.filter(it=>!q||[it.comp,it.lines.join(' '),it.A.s,it.B.s].join(' ').toLowerCase().includes(q));
  $('#res').innerHTML=r.map(it=>`<button data-id="${it.id}"><b>${esc(it.lines.join(' '))}</b><small>${esc(it.A.s)} vs ${esc(it.B.s)}</small></button>`).join('')||'<div style="padding:14px 0;color:var(--sub)">찾는 곡이 아직 없어요</div>';
  $('#res').querySelectorAll('button').forEach(b=>b.onclick=()=>{ sheet(false); order=D.items.slice(); buildDeck(); go(order.findIndex(x=>x.id===b.dataset.id)); }); }
$('#so').onclick=()=>sheet(true); $('#sx').onclick=()=>sheet(false); $('#dim').onclick=()=>sheet(false); $('#qi').oninput=e=>results(e.target.value);

/* ② 짝 카드 */
function openPair(it){
  cur = it;
  $('#pair').innerHTML = `<div class="bar"><button class="ib" id="pb" aria-label="목록">‹</button><span class="mast">${esc(it.lines.join(' · '))}</span><span style="width:48px"></span></div>
   <div class="half a"><img src="${yt(it,'A',1)}" alt="A 연주 영상 썸네일"><div class="who"><span class="tg">A</span><div class="nm">${esc(it.A.s)}</div><div class="y num">${it.A.y||''}</div></div></div>
   <div class="half b"><img src="${yt(it,'B',1)}" alt="B 연주 영상 썸네일"><div class="who"><span class="tg">B</span><div class="nm">${esc(it.B.s)}</div><div class="y num">${it.B.y||''}</div></div></div>
   <div class="vsc" id="vsc">vs</div>
   <div class="foot"><button class="cta" id="pstart">비교 시작</button></div>`;
  $('#pb').onclick = () => goScreen('pair','pick',-1);
  $('#pstart').onclick = () => openQ();
  goScreen('pick','pair',1);
  requestAnimationFrame(()=>{ const a=$('.half.a').getBoundingClientRect(), A=$('#app').getBoundingClientRect(); $('#vsc').style.top=(a.bottom-A.top-32+3)+'px'; });
  anim($('.half.a .who'),[{transform:'translateX(-60px)',opacity:0},{transform:'none',opacity:1}],{delay:300,duration:500});
  anim($('.half.b .who'),[{transform:'translateX(60px)',opacity:0},{transform:'none',opacity:1}],{delay:300,duration:500});
  anim($('.half.a img'),[{transform:'scale(1.08)'},{transform:'none'}],{duration:900});
  anim($('.half.b img'),[{transform:'scale(1.08)'},{transform:'none'}],{duration:900});
  anim($('#vsc'),[{transform:'scale(.3)',opacity:0},{transform:'none',opacity:1}],{delay:650,duration:350});
}

/* ②-1 질문 */
function splitQ(q){ const i=q.indexOf('. '); return i>0 ? [q.slice(0,i+1), q.slice(i+2)] : [q]; }
function openQ(){
  const it = cur;
  $('#q').innerHTML = `<div class="bar"><button class="ib" id="qb" aria-label="뒤로">‹</button><span></span><span style="width:48px"></span></div>
   <div class="body"><div class="duo"><div><img src="${yt(it,'A',1)}" alt="A"></div><div class="b"><img src="${yt(it,'B',1)}" alt="B"></div></div>
   <div class="qq">${splitQ(it.q).map(l=>`<span class="ln"><span>${esc(l)}</span></span>`).join('')}</div></div>
   <div class="foot"><button class="cta" id="qgo">들으러 가기</button></div>`;
  $('#qb').onclick = () => goScreen('q','pair',-1);
  $('#qgo').onclick = () => { if (it.id!=='brahms-op118-2') { toast('이 시험 페이지에선 브람스만 들어 볼 수 있어요'); return; } setStep(0,0); goScreen('q','listen',1); };
  goScreen('pair','q',1);
  $('#q').querySelectorAll('.qq .ln>span').forEach((s,i)=>anim(s,[{transform:'translateY(105%)'},{transform:'none'}],{delay:250+i*110}));
  $('#q').querySelectorAll('.duo div').forEach((d,i)=>anim(d,[{transform:`translateX(${i?24:-24}px)`,opacity:0},{transform:'none',opacity:1}],{delay:150,duration:420}));
}

/* ③ 듣기 */
const B = D.brahms;
const L1=[210,252,387,549,715,870,1005], L2=[105,269,420,553,670,833,1005], CW=1010;
function barPos(bt,t){ if(t<bt[0]){const beat=(bt[1]-bt[0])/3,p0=bt[0]-beat; return t<p0?null:-1+(t-p0)/beat;} for(let i=0;i<bt.length-1;i++) if(bt[i]<=t&&t<bt[i+1]) return i+(t-bt[i])/(bt[i+1]-bt[i]); return null; }
function place(b){ if(b===null) return null; if(RM) b=Math.floor(b);
  if(b<5){ const i=Math.floor(b)+1,f=b-Math.floor(b); return {line:1,x:(L1[i]+f*(L1[i+1]-L1[i]))/CW*100,x0:L1[0]/CW*100}; }
  const k=b-5,i=Math.min(5,Math.floor(k)),f=k-i; return {line:2,x:(L2[i]+f*(L2[i+1]-L2[i]))/CW*100,x0:L2[0]/CW*100}; }
const fmt = t => `${Math.floor(t/60)}:${(t%60).toFixed(1).padStart(4,'0')}`;
let si=0, play=null;
function laneHTML(w){ const c=w==='A'?'var(--A)':'var(--B)', nm=w==='A'?cur.A.s:cur.B.s;
  return `<div class="lane" id="lane${w}" style="--c:${c}"><div class="lh"><b><span class="tg">${w}</span>${esc(nm)}</b><span class="clk num" id="t${w}">0:00.0</span></div>
   <div class="sc" id="sc${w}"><img src="img/score_l1.png" alt="악보" id="i${w}1"><img src="img/score_l2.png" alt="" id="i${w}2" style="opacity:0"><div class="done" id="d${w}"></div><div class="hd" id="h${w}"></div></div></div>`; }
function stepHTML(k){ const s=B.steps[k];
  const mid = k===0 ? laneHTML('A')+laneHTML('B') : `<div class="full"><img src="${s.img}" alt="악보"></div><div class="lane" style="--c:var(--ink)"><div class="lh"><b>같은 시계</b><span class="clk num" id="tk">0:00.0</span></div></div>`;
  return `<div class="step"><div class="vid" id="vid"><img id="va" src="${yt(cur,'A')}" alt="A 영상" style="left:0;width:100%"><img id="vb" src="${yt(cur,'B')}" alt="B 영상" style="left:0;width:100%;opacity:0"><span class="ab" id="vla" style="left:8px;background:var(--A);opacity:0">A</span><span class="ab" id="vlb" style="right:8px;background:var(--B);opacity:0">B</span><div class="play"></div><span class="yt">YouTube</span></div>
   <div class="st"><h2><span>${esc(s.t)}</span></h2><p>${esc(s.pt)}</p></div>${mid}
   <div class="ctrl"><button style="--c:var(--A)" data-m="A">A 듣기</button><button style="--c:var(--B)" data-m="B">B 듣기</button><button class="both" data-m="AB">동시에 보기</button></div></div>`; }
function setStep(k,dir=0){ stop(); const st=$('#stage'), old=st.querySelector('.step'); st.insertAdjacentHTML('beforeend',stepHTML(k)); const nw=st.lastElementChild; si=k;
  $('#pgb').style.width=`${(k+1)/B.steps.length*100}%`;
  nw.querySelectorAll('.ctrl button').forEach(b=>b.onclick=()=>toggle(b.dataset.m));
  if(old){ if(dir&&!RM){ anim(old,[{transform:'none',opacity:1},{transform:`translateX(${-dir*30}%)`,opacity:0}],{duration:380}).finished.then(()=>old.remove()); anim(nw,[{transform:`translateX(${dir*100}%)`},{transform:'none'}],{duration:450,fill:'none'}); } else old.remove(); }
  anim(nw.querySelector('.st h2 span'),[{transform:'translateY(110%)'},{transform:'none'}],{delay:dir?200:120});
  if(k===0){ drawAt(0,'A',true); drawAt(0,'B',true); } }
function video(m){ const a=$('#va'), b=$('#vb'); if(!a) return;
  if(m==='AB'){ a.style.opacity=1; b.style.opacity=1; a.style.width='50%'; b.style.width='50%'; b.style.left='50%'; }
  else { a.style.width=b.style.width='100%'; b.style.left='0'; a.style.opacity=m==='B'?0:1; b.style.opacity=m==='B'?1:0; }
  $('#vla').style.opacity = m==='AB'?1:0; $('#vlb').style.opacity = m==='AB'?1:0; $('.vid .play').style.opacity = m?0:1; }
function drawAt(t,w,reset){ const bt=w==='A'?B.btA:B.btB, end=w==='A'?24:21, tt=Math.min(t,end), b=barPos(bt,tt), p=place(b), sc=$('#sc'+w); if(!sc) return null;
  $('#t'+w).textContent=fmt(reset?0:tt);
  if(!p||reset){ $('#d'+w).style.width='0'; sc.classList.remove('live'); $('#i'+w+'1').style.opacity=1; $('#i'+w+'2').style.opacity=0; return null; }
  $('#i'+w+'1').style.opacity=p.line===1?1:0; $('#i'+w+'2').style.opacity=p.line===2?1:0;
  $('#d'+w).style.left=p.x0+'%'; $('#d'+w).style.width=Math.max(0,p.x-p.x0)+'%'; $('#h'+w).style.left=p.x+'%'; sc.classList.add('live'); return b; }
function frame(t){ const m=play.mode; if(si===0){ if(m.includes('A')) drawAt(t,'A'); if(m.includes('B')) drawAt(t,'B'); } else { const tk=$('#tk'); if(tk) tk.textContent=fmt(t); } }
function toggle(m){ if(play&&play.mode===m){ stop(); return; } stop(); play={mode:m,t0:performance.now()};
  $('#stage').querySelectorAll('.ctrl button').forEach(b=>b.classList.toggle('on',b.dataset.m===m)); video(m);
  if(si===0) ['A','B'].forEach(w=>{ $('#lane'+w).classList.toggle('on',m.includes(w)); if(!m.includes(w)) drawAt(0,w,true); });
  const s=B.steps[si], len=w=>{const c=s.clips.find(c=>c[0]===w); return c[2]-c[1];}, end=m==='AB'?Math.max(len('A'),len('B')):len(m);
  const tick=()=>{ const t=(performance.now()-play.t0)/1000; frame(Math.min(t,end)); if(t<end) play.raf=requestAnimationFrame(tick); else { stop(true); openAfter(); } };
  play.raf=requestAnimationFrame(tick); }
function stop(keep){ if(play) cancelAnimationFrame(play.raf); play=null; if(keep) return; document.querySelectorAll('.ctrl button').forEach(b=>b.classList.remove('on')); document.querySelectorAll('.lane').forEach(l=>l.classList.remove('on')); video(null); }
$('#lb').onclick=()=>{ stop(); if(si===0) goScreen('listen','q',-1); else setStep(si-1,-1); };
$('#ln').onclick=()=>{ stop(); openAfter(); };

/* ③-1 들은 뒤 */
function openAfter(){ const s=B.steps[si], [k,a0,b0]=s.bar, m=Math.max(a0,b0), last=si===B.steps.length-1, dec=!Number.isInteger(a0)||!Number.isInteger(b0), a=dec?a0.toFixed(1):a0, b=dec?b0.toFixed(1):b0;
  $('#after').innerHTML=`<div class="bar"><button class="ib" id="ab2" aria-label="다시 듣기">‹</button><span></span><span style="width:48px"></span></div>
   <div class="body"><div class="k">${esc(k)}</div><div class="bars">
    <div class="col" style="--c:var(--A)"><div class="v num">${a}<small>초</small></div><div class="r" style="height:${a0/m*72}%"></div><div class="pp"><img src="${yt(cur,'A',1)}" alt="A"></div></div>
    <div class="col" style="--c:var(--B)"><div class="v num" style="color:var(--B)">${b}<small>초</small></div><div class="r" style="height:${b0/m*72}%"></div><div class="pp"><img src="${yt(cur,'B',1)}" alt="B"></div></div></div>
   <div class="cc"><span>${esc(s.cc)}</span></div></div>
   <div class="foot"><button class="cta" id="anx">${last?'처음으로':'다음 구간'}</button></div>`;
  $('#ab2').onclick=()=>goScreen('after','listen',-1);
  $('#anx').onclick=()=>{ if(last){ goScreen('after','pick',1); return; } setStep(si+1,0); goScreen('after','listen',1); };
  goScreen('listen','after',1);
  $('#after').querySelectorAll('.col .r').forEach((r,i)=>anim(r,[{transform:'scaleY(0)'},{transform:'none'}],{delay:300+i*120,duration:600}));
  $('#after').querySelectorAll('.col .v').forEach((v,i)=>anim(v,[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{delay:600+i*120,duration:350}));
  anim($('#after .cc span'),[{transform:'translateY(110%)'},{transform:'none'}],{delay:900,duration:450});
}
/* 시험용 손잡이 */
window.__t = { show:(id)=>{ document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('hide',s.id!==id)); },
  pair:()=>openPair(D.items[0]), q:()=>{cur=D.items[0]; openQ();}, listen:()=>{cur=D.items[0]; setStep(0,0); window.__t.show('listen');},
  freeze:(m,t)=>{ stop(); play={mode:m,t0:0}; $('#stage').querySelectorAll('.ctrl button').forEach(b=>b.classList.toggle('on',b.dataset.m===m)); video(m); ['A','B'].forEach(w=>$('#lane'+w)&&$('#lane'+w).classList.toggle('on',m.includes(w))); frame(t); play=null; },
  after:()=>{ cur=D.items[0]; si=0; openAfter(); } };
buildDeck(); addEventListener('resize',buildDeck);
</script></body></html>
