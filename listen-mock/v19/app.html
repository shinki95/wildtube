<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>비교 듣기 · 19판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#0b0b0c;--t1:#ffffff;--t2:rgba(255,255,255,.6);--t3:rgba(255,255,255,.36);--g1:rgba(255,255,255,.08);--g2:rgba(255,255,255,.16);--shadow:rgba(0,0,0,.6);--a:#4189dd;--b:#ff3b55;--paper:#f6f4ef;--mark:#b38209;--ink:#1c1c1e;--ink2:rgba(28,28,30,.62)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:color-mix(in srgb,var(--ink) 12%,var(--paper))}
body{font-family:var(--font);color:var(--ink);word-break:keep-all;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
#app{position:relative;width:100%;max-width:430px;height:100dvh;max-height:932px;background:var(--t1);overflow:hidden;overflow:clip}
.view{position:absolute;inset:0;overflow:hidden;background:var(--t1)}
.hide{visibility:hidden;pointer-events:none}
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
/* ---- 둘러보기 (6판 그대로) ---- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;z-index:40;display:flex;justify-content:space-around;padding:4px 8px 22px;background:color-mix(in srgb,var(--t1) 80%,transparent);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-top:.5px solid color-mix(in srgb,var(--bg) 15%,transparent)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink2);min-height:48px}
.tabbar button.on{color:var(--b)}
.page{position:absolute;inset:0;padding-bottom:90px}
.lt{padding:46px 20px 4px;font-size:34px;font-weight:800;letter-spacing:-.02em}
.sub0{padding:0 20px;font-size:16px;color:var(--ink2)}
.shelf{margin-top:14px}
.sh{display:flex;justify-content:space-between;align-items:center;padding:0 20px;height:30px}
.sh b{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sh span{font-size:22px;color:var(--ink2)}
.row{display:flex;gap:14px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:10px 20px 4px;scrollbar-width:none;scroll-padding:0 20px}
.row::-webkit-scrollbar{display:none}
.card{flex:none;width:186px;scroll-snap-align:start;text-align:left}
.duo{position:relative;border-radius:12px;overflow:hidden;background:var(--bg);box-shadow:0 10px 24px -12px var(--shadow)}
.duo img{position:absolute;top:0;height:100%;object-fit:cover}
.duo img.a{left:0;width:62%}
.duo img.b{right:0;clip-path:polygon(38% 0,100% 0,100% 100%,0 100%);width:76%}
.duo .ab{position:absolute;bottom:8px;width:24px;height:24px;border-radius:6px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--t1)}
.card b{display:block;font-size:16px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:block;font-size:16px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circ{flex:none;width:84px;text-align:center;scroll-snap-align:start}
.circ i{display:block;width:84px;height:84px;border-radius:50%;overflow:hidden;background:color-mix(in srgb,var(--ink) 10%,transparent);box-shadow:0 4px 14px -8px color-mix(in srgb,var(--bg) 40%,transparent)}
.circ img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.circ b{display:block;font-size:16px;font-weight:500;margin-top:7px}
.sbox{margin:6px 20px 0;height:44px;border-radius:12px;background:var(--paper);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--ink2)}
.sbox input{flex:1;border:0;background:none;font:16px var(--font);outline:none;color:var(--ink);height:44px}
.list{padding:8px 20px}
.li{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:.5px solid color-mix(in srgb,var(--ink) 10%,transparent);width:100%;text-align:left}
.li .th{width:52px;height:52px;border-radius:8px;overflow:hidden;flex:none;position:relative}
.li .th img{position:absolute;top:0;height:100%;width:60%;object-fit:cover}
.li b{display:block;font-size:16px;font-weight:600}
.li span{display:block;font-size:15px;color:var(--ink2)}

/* ---- 레슨 (애플 뮤직 톤) ---- */
#ls{position:absolute;inset:0;z-index:60;color:var(--t1);transform:translateY(100%);background:var(--bg);overflow:hidden;overflow:clip;touch-action:pan-x pinch-zoom;user-select:none;-webkit-user-select:none}
#ls .bg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(34px) saturate(1.4) brightness(.42);transform:scale(1.1);transition:background-image .6s}
#ls .bg2{position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 40%,transparent),color-mix(in srgb,var(--bg) 15%,transparent) 40%,color-mix(in srgb,var(--bg) 40%,transparent))}
.glass{background:var(--g2);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--g2);box-shadow:inset 0 1px 0 var(--t3),0 10px 26px -12px var(--shadow)}
.dglass{background:color-mix(in srgb,var(--ink) 50%,transparent);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--g2);box-shadow:inset 0 1px 0 var(--g1),0 18px 40px -20px var(--shadow)}
.top{position:absolute;left:0;right:0;top:0;z-index:6;height:118px}
.hd{height:44px;display:flex;align-items:center;padding:0 4px}
.hd button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.hd .tt{flex:1;text-align:center;font-size:15px;font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:44px}
.nav{padding:0 14px}
.nmap{position:relative;height:10px;margin:0 6px}
.nmap .tr{position:absolute;left:0;right:0;top:3px;height:4px;border-radius:2px;background:var(--g2)}
.nmap i{position:absolute;top:2px;height:6px;border-radius:3px;background:var(--t2)}
.nmap i.on{background:var(--b);box-shadow:0 0 8px color-mix(in srgb,var(--b) 75%,transparent)}
.ncon{height:12px;margin:0 6px}
.ncon svg{width:100%;height:12px}
.nums{display:flex;justify-content:space-between}
.nums button{width:44px;height:44px;border-radius:50%;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .3s var(--ease),transform .3s var(--ease)}
.nums button.on{background:var(--b);border-color:var(--b);box-shadow:0 6px 18px -6px color-mix(in srgb,var(--b) 75%,transparent);transform:scale(1.06)}
.nums button.seen:not(.on){color:color-mix(in srgb,var(--b) 45%,var(--t1))}
.pnm{height:30px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;text-overflow:ellipsis;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;padding:0 8px}
.pnm span{font-size:13px;font-weight:500;opacity:.75}
.stage{position:absolute;left:0;right:0;top:118px;bottom:52px;z-index:2}
.scr{position:absolute;inset:0;padding:6px 24px 10px 14px;display:flex;flex-direction:column}
.scr.bar{bottom:140px}
.bot{position:absolute;left:0;right:0;bottom:0;height:52px;z-index:7;display:flex;align-items:center;padding:0 2px}
.bot button{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.bot button[disabled]{opacity:.25}
.dots{flex:1;display:flex;justify-content:center;align-items:center;gap:12px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}
.dots .g{display:flex;align-items:center;gap:4px;opacity:.55}
.dots .g.on{opacity:1}
.dots .g i{width:6px;height:6px;border-radius:3px;background:var(--t1);opacity:.45}
.dots .g i.on{width:16px;opacity:1;background:var(--b)}
/* 글 카드 */
.tcard{flex:1;border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.kick{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--b)}
.tcard h3{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-top:4px}
.txt p{font-size:17px;line-height:1.68;margin-top:12px;color:var(--t1);font-weight:450}
.txt p b{font-weight:800}
.pull{font-size:20px;font-weight:800;line-height:1.5;margin-top:16px;padding-left:14px;border-left:3px solid var(--b)}
.two{display:grid;grid-template-columns:1fr 1px 1fr;margin-top:12px;border-top:1px solid var(--t3)}
.two .ln{background:var(--t3)}
.two .c{padding:10px 10px 4px 0}
.two .c.b{padding:10px 0 4px 12px}
.two .tg{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800}
.two .tg i{font-style:normal;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.two .c p{font-size:17px;line-height:1.62;margin-top:6px;color:var(--t1)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:17px;line-height:1.55}
.chk b{flex:none;font-size:13px;font-weight:800;padding:4px 8px;border-radius:7px;margin-top:2px}
.note{font-size:14px;opacity:.8;margin-top:10px;line-height:1.5}
.tbl .r{margin-top:12px}
.tbl .k{font-size:16px;font-weight:700}
.tbl .row{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:16px;font-variant-numeric:tabular-nums}
.tbl .row span{width:18px;font-weight:800}
.tbl .row i{display:block;height:14px;border-radius:7px;transform-origin:left}
.tbl .row em{font-style:normal;font-weight:800;min-width:52px}
.more{font-size:13px;opacity:.75;margin-top:auto;padding-top:8px;text-align:right}
/* 표지 */
.cv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:900px}
.cv .stack{position:relative;width:290px;height:248px}
.cv .ca,.cv .cb{position:absolute;width:194px;height:194px;border-radius:14px;overflow:hidden;box-shadow:0 26px 50px -18px var(--shadow)}
.cv .ca{left:0;top:0;transform:rotateY(14deg) rotateZ(-3deg)}
.cv .cb{right:0;bottom:0;transform:rotateY(-14deg) rotateZ(3deg)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .tg{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:8px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cv h1{font-size:32px;font-weight:800;letter-spacing:-.025em;margin-top:26px;text-align:center}
.cv .vs{font-size:20px;color:var(--b);font-weight:600;margin-top:4px}
.cv .q{font-size:19px;font-weight:600;line-height:1.45;text-align:center;margin-top:14px}
/* 듣기 */
.vid{position:relative;width:316px;aspect-ratio:16/9;margin:2px auto 0;border-radius:12px;overflow:hidden;flex:none;box-shadow:0 18px 36px -16px var(--shadow)}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s var(--ease)}
.vid .yt{position:absolute;left:8px;bottom:6px;font-size:12px;font-weight:700;background:var(--shadow);padding:3px 7px;border-radius:6px}
.vid .who{position:absolute;right:8px;top:8px;font-size:12px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--shadow)}
.lanes{margin:12px 0 0}
.lane{background:var(--paper);border-radius:14px;padding:6px 6px 4px;color:var(--ink);margin-bottom:8px;box-shadow:0 12px 28px -16px var(--shadow);border:2px solid transparent;transition:border-color .3s var(--ease)}
.lane.on{border-color:var(--c)}
.lh{display:flex;justify-content:space-between;align-items:center;font-size:15px;height:24px;font-weight:600;padding:0 4px}
.lh i{font-style:normal;display:inline-flex;width:20px;height:20px;border-radius:6px;background:var(--c);color:var(--t1);font-size:12px;font-weight:800;align-items:center;justify-content:center;margin-right:6px}
.lh .clk{color:var(--c);font-variant-numeric:tabular-nums}
.sc{position:relative}
.sc img{position:absolute;left:0;top:0;width:100%;transition:opacity .35s var(--ease);opacity:0}
.sc img.on{opacity:1}
.sc .done{position:absolute;top:8%;bottom:8%;left:0;background:var(--c);opacity:.12;border-radius:3px}
.sc .hdl{position:absolute;top:2%;bottom:2%;width:4px;margin-left:-2px;background:var(--c);border-radius:2px;opacity:0;transition:opacity .25s}
.sc.live .hdl{opacity:1}
.lane.ghost .sc .hdl{opacity:0}
.lane.ghost .sc.live .hdl{opacity:.45;background:repeating-linear-gradient(180deg,var(--c) 0 6px,transparent 6px 10px)}
.lane.ghost .sc .done{opacity:.05}
.sw{height:44px;margin:0 auto 8px;padding:0 16px;border-radius:22px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;opacity:.35;transition:opacity .3s}
.sw.on{opacity:1}
.abtn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto}
.big{height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:700;transition:transform .25s var(--ease),background .3s}
.big:active{transform:scale(.96)}
.big .k{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.big.on{background:var(--t1);color:var(--ink)}
.big.b.on{color:var(--b)}
/* 미니 A/B 바 */
.pbar{position:absolute;left:8px;right:8px;bottom:56px;height:136px;z-index:8;border-radius:20px;padding:8px;display:flex;gap:10px;transition:transform .45s var(--ease),opacity .3s;background:color-mix(in srgb,var(--ink) 85%,transparent)}
.pbar.off{transform:translateY(40px);opacity:0;pointer-events:none}
.pbar .pv{position:relative;width:204px;height:115px;border-radius:10px;overflow:hidden;flex:none}
.pbar .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.pbar .pv span{position:absolute;left:6px;bottom:5px;font-size:11px;font-weight:700;background:var(--shadow);padding:2px 6px;border-radius:5px}
.pbar .pr{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.pbar .ab2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pbar .ab2 button{height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:16px}
.pbar .ab2 button.on{background:var(--t1);color:var(--ink)}
.pbar .ab2 button.b.on{color:var(--b)}
.pbar .st{font-size:13px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;height:16px}
.pbar .sw2{height:44px;border-radius:14px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;opacity:.4}
.pbar .sw2.on{opacity:1}
/* 끝 */
.curve{border-radius:20px;padding:14px 12px 12px}
.curve .lg{display:flex;gap:12px;font-size:14px;margin-bottom:6px;flex-wrap:wrap}
.curve .lg b{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.curve svg.cv2{width:100%;height:auto}
.endbt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto}
.go{height:56px;border-radius:16px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ---- 10판: 번호 없는 곡 지도 + 어포던스 ---- */
.nmap{position:relative;height:44px;margin:0 6px;cursor:pointer;touch-action:none}
.nmap .tr{position:absolute;left:0;right:0;top:19px;height:6px;border-radius:3px;background:var(--g1)}
.nmap i{position:absolute;top:17px;height:10px;border-radius:5px;background:transparent;border:1.5px solid var(--t2);box-sizing:border-box;transition:background .3s,border-color .3s,transform .25s var(--ease)}
.nmap i.past{background:var(--t2);border-color:transparent}
.nmap i.on{background:var(--b);border-color:var(--b);box-shadow:0 0 10px color-mix(in srgb,var(--b) 75%,transparent);transform:scaleY(1.25)}
.nmap i.hov{border-color:var(--t1);transform:scaleY(1.5)}
.nmap .thumb{position:absolute;top:11px;width:4px;height:22px;margin-left:-2px;border-radius:2px;background:var(--t1);opacity:0;transition:opacity .2s}
.nmap.drag .thumb{opacity:1}
.bub{position:absolute;top:84px;z-index:20;max-width:300px;padding:9px 14px;border-radius:14px;font-size:15px;font-weight:700;white-space:nowrap;opacity:0;transform:translate(-50%,-6px);transition:opacity .2s,transform .2s var(--ease);pointer-events:none;background:color-mix(in srgb,var(--ink) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--g2);box-shadow:0 10px 24px -10px var(--shadow)}
.bub.on{opacity:1;transform:translate(-50%,0)}
.bub small{display:block;font-size:13px;font-weight:500;opacity:.8;margin-top:2px}
.bub::before{content:"";position:absolute;left:var(--ax,50%);top:-6px;width:12px;height:12px;margin-left:-6px;background:color-mix(in srgb,var(--ink) 85%,transparent);transform:rotate(45deg);border-left:1px solid var(--g2);border-top:1px solid var(--g2)}
.pnm{height:30px}
.peek{position:absolute;right:7px;top:18px;bottom:22px;width:12px;border-radius:0 14px 14px 0;background:var(--g1);border:1px solid var(--g2);border-left:0;transition:opacity .3s,bottom .3s}
.peek.bar{bottom:156px}
.peek.off{opacity:0}
.nxl{width:auto!important;min-width:48px;padding:0 6px 0 12px;border-radius:24px!important;gap:2px;font-size:14px;font-weight:700}
.nxl span{opacity:.85}
.dots{gap:14px}
.dots .g{gap:5px;opacity:.5}
.dots .g svg{width:15px;height:15px}
.dots .g i{width:8px;height:3px;border-radius:2px}
.dots .g i.on{width:16px}
.tcard.dglass{box-shadow:none;border-color:var(--g1);background:color-mix(in srgb,var(--bg) 40%,transparent)}
.big{background:linear-gradient(180deg,var(--t3),var(--g1));box-shadow:0 6px 0 color-mix(in srgb,var(--bg) 40%,transparent),0 16px 28px -12px var(--shadow),inset 0 1px 0 var(--t2);transition:transform .12s,box-shadow .12s,background .3s}
.big:active,.press:active{transform:translateY(4px)!important;box-shadow:0 2px 0 color-mix(in srgb,var(--bg) 40%,transparent),0 6px 14px -8px var(--shadow),inset 0 1px 0 var(--t3)!important}
.press{background:linear-gradient(180deg,var(--t3),var(--g1));box-shadow:0 4px 0 color-mix(in srgb,var(--bg) 40%,transparent),0 12px 22px -10px var(--shadow),inset 0 1px 0 var(--t2);transition:transform .12s,box-shadow .12s}
.lane{cursor:pointer;position:relative}
.lane .ftip{position:absolute;top:30px;padding:4px 9px;border-radius:9px;background:var(--c);color:var(--t1);font-size:13px;font-weight:800;transform:translate(-50%,-110%);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:3}
.lane .ftip.on{opacity:1}
.tapcap{font-size:13px;opacity:.75;text-align:center;margin:-2px 0 6px}
.cv .stack{filter:drop-shadow(0 30px 30px color-mix(in srgb,var(--bg) 40%,transparent));transform:translateY(-6px)}
/* 평단 카드 (c) */
.whr{display:flex;align-items:center;gap:10px;margin-top:12px}
.whr .pc{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 6px 14px -6px var(--shadow)}
.whr .pc img{width:100%;height:100%;object-fit:cover;display:block}
.whr b{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.whr span{font-size:18px;font-weight:800}
.claim .txt p{font-size:20px;font-weight:700;line-height:1.52;letter-spacing:-.01em}
.claim .txt p.note{font-size:14px;font-weight:450}
.lbtn{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:800;margin-top:14px;width:100%}
.lbtn.B{color:var(--t1)}
.lbtn i{font-style:normal;width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.lb2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 판 비교용 (a)(b) */

<script>
const D={"items": [{"id": "brahms-op118-2", "por": "brahms", "title": "인터메초 118-2", "comp": "브람스", "q": "만년의 페라이어는 따뜻하게 노래하고, 젊은 굴드는 속삭이듯 안으로 파고들어요.", "A": {"s": "페라이어", "y": 2010}, "B": {"s": "굴드", "y": 1960}}, {"id": "chopin-nocturne-20", "por": "chopin", "title": "녹턴 20번", "comp": "쇼팽", "q": "임윤찬이 34초쯤 더 길어요. 어디서 시간을 쓸까요?", "A": {"s": "조성진", "y": 2017}, "B": {"s": "임윤찬", "y": 2023}}, {"id": "bach-goldberg-aria", "por": "bach", "title": "골드베르크 아리아", "comp": "바흐", "q": "26년 뒤 같은 아리아가 71초 길어졌어요.", "A": {"s": "굴드", "y": 1955}, "B": {"s": "굴드", "y": 1981}}, {"id": "debussy-clair-de-lune", "por": "debussy", "title": "달빛", "comp": "드뷔시", "q": "조성진이 15초 더 길어요. 어디서 시간을 쓸까요?", "A": {"s": "기제킹", "y": 1953}, "B": {"s": "조성진", "y": 2017}}, {"id": "chopin-prelude-15", "por": "chopin", "title": "전주곡 ‘빗방울’", "comp": "쇼팽", "q": "조성진이 44초 더 길어요. 어디서 시간을 쓸까요?", "A": {"s": "조성진", "y": 2015}, "B": {"s": "폴리니", "y": 1974}}, {"id": "schumann-traumerei", "por": "schumann", "title": "트로이메라이", "comp": "슈만", "q": "꿈꾸듯 느린 호로비츠가 오히려 29초 짧아요.", "A": {"s": "호로비츠", "y": 1986}, "B": {"s": "아르헤리치", "y": 1983}}], "brahms": {"steps": [{"t": "처음 여덟 마디", "bl": "1~8마디", "ex": "곡은 세 음짜리 짧은 동기로 시작해요. 한 음 내려갔다가 위로 올라가는 이 작은 몸짓이 곡 전체의 씨앗이에요. 페라이어는 첫 문장을 긴 호흡 하나로 이어 그려요. 굴드는 '느린 굴드'라는 말과 달리 첫 두 마디를 오히려 먼저 꺼내요.", "pt": "세 음짜리 첫 몸짓이 한 숨에 이어지는지 느껴 보세요.", "af": ["페라이어는 감정을 담되 감상에 젖지 않고, 첫 문장을 길게 이어 가요. 여덟 마디 문장 끝에서는 둘 다 같은 자리에서 숨을 쉬어요."], "bars": [["첫 두 마디", 5.5, 4.0]], "a": [0.0, 24.0], "b": [0.0, 21.0], "rng": [1, 8], "sys": [{"img": "img/s1_0.png", "w": 1100, "h": 236, "bars": [[0, 250, 293], [1, 293, 426], [2, 426, 589], [3, 589, 755], [4, 755, 909], [5, 909, 1044]]}, {"img": "img/s1_1.png", "w": 1100, "h": 229, "bars": [[6, 107, 308], [7, 308, 460], [8, 460, 592], [9, 593, 710], [10, 710, 873]]}], "cr": {"src": "음반 전체 평에서", "A": "이 음반의 페라이어는 앞으로 흘러가는 빠른 브람스라는 평을 들어요. 감정은 담되 감상에 젖지 않고, 문장을 긴 호흡으로 그린다는 말이 자주 붙어요.", "B": "굴드의 브람스 간주곡에는 대체로 템포가 느리고 무겁다는 평이 따라다녀요.", "chk": "숫자는 반대예요. 첫 두 마디는 페라이어 5.5초, 굴드 4.0초로 굴드가 더 빨라요. ‘빠른 페라이어, 느린 굴드’는 이 시작에는 맞지 않아요.", "v": "no"}, "bl0": "1~8마디"}, {"t": "'조금 빠르게'라고 쓴 곳", "bl": "38~48마디", "ex": "이 대목 첫머리에 '점점 크게, 조금 활기 있게'(cresc. un poco animato)라는 지시가 붙어요. 곧이어 브레이크(rit.)를 걸고 더 느린 곳(più lento)으로 넘어가요. 페라이어는 지시대로 걸음을 재촉했다가 풀어 주고, 굴드는 무게를 덜지 않고 같은 걸음을 지켜요.", "pt": "'조금 활기 있게'에서 음악이 앞으로 기우는지, 제자리에서 버티는지 느껴 보세요.", "af": ["페라이어 쪽은 악보의 지시를 소리로 그대로 옮겨요. 굴드에게는 템포가 무거워 앞으로 가는 힘이 모자랄 때가 있다는 평이 따라다니고, 이 대목이 그 말과 맞아요."], "bars": [["조금 빠르게 (38~44마디)", 14.6, 17.6]], "a": [89.6, 120.5], "b": [89.2, 123.2], "rng": [38, 48], "sys": [{"img": "img/s2_0.png", "w": 1100, "h": 244, "bars": [[38, 449, 602], [39, 602, 745], [40, 745, 890], [41, 890, 1044]]}, {"img": "img/s2_1.png", "w": 1100, "h": 253, "bars": [[42, 107, 287], [43, 287, 435], [44, 435, 581], [45, 581, 739], [46, 739, 892], [47, 892, 1044]]}, {"img": "img/s2_2.png", "w": 1100, "h": 229, "bars": [[48, 107, 138]]}], "cr": {"src": "곡 전체 평에서", "A": "이 대목을 따로 다룬 평은 없어요. 빠르기의 미세한 변화를 매끄럽게 다룬다는 칭찬은 같은 음반의 다른 곡(헨델 변주곡) 이야기예요.", "B": "템포가 지나치게 무거워 리듬의 추진력이 모자랄 때가 있다는 지적이 있어요.", "chk": "숫자와 맞아요. ‘조금 빠르게’ 구간에 페라이어 14.6초, 굴드 17.6초. 굴드는 거의 빨라지지 않아요.", "v": "yes"}, "bl0": "38~48마디"}, {"t": "장조에서 단조로, 엇갈리는 두 손", "bl": "47~56마디", "ex": "밝던 가장조가 올림바단조로 어두워져요. 그다음부터 오른손은 한 박을 셋으로, 왼손은 둘로 나눠서 두 손이 박의 처음에서만 만나요. 페라이어는 이 여덟 마디를 반복할 때도 처음과 같은 결로 담담하게 이어 가요. 굴드는 반복에서 오른손 노래 밑에 숨은 다른 선을 끌어올려요.", "pt": "반복할 때 오른손 노래 밑에서 따로 움직이는 선이 들리는지 느껴 보세요.", "af": ["굴드는 반복에서 안쪽의 숨은 선을 드러내고, 그 선을 들려주느라 걸음을 조금 늦춰요. 페라이어는 반복을 처음과 비슷한 결로 흘려보내요."], "bars": [["49~56마디 반복", 19.1, 21.9]], "a": [110.0, 139.1], "b": [113.9, 142.8], "rng": [47, 56], "sys": [{"img": "img/s3_0.png", "w": 1100, "h": 253, "bars": [[47, 893, 1044]]}, {"img": "img/s3_1.png", "w": 1100, "h": 229, "bars": [[48, 107, 138], [49, 242, 448], [50, 448, 642], [51, 642, 835], [52, 835, 1044]]}, {"img": "img/s3_2.png", "w": 1100, "h": 269, "bars": [[53, 107, 309], [54, 309, 490], [55, 490, 684], [56, 684, 901]]}], "cr": {"src": "이 대목을 짚은 평", "A": "이 대목을 따로 다룬 평은 없어요. 세부를 하나하나 드러내면서도 문장을 길게 잇는다는 일반 평이 이곳의 담담한 반복과 이어져요.", "B": "가운데 부분을 반복할 때 오른손 노래 밑의 대선율을 끌어올린다는 평이 있어요. 주제가 단조로 다시 나올 때도 그 선이 살아 있고, 안쪽 성부를 도드라지게 한다는 말이 함께 붙어요.", "chk": "숫자와 맞아요. 반복에서 굴드만 2.8초 느려져요(19.1초 대 21.9초). 숨은 선을 들려주려고 쓰는 시간으로 들을 수 있어요.", "v": "yes"}, "bl0": "47~56마디"}, {"t": "57마디, 찬송가 같은 화음", "bl": "57~64마디", "ex": "어두운 단조가 올림바장조로 풀리면서 찬송가처럼 조용한 화음이 나와요. 악보에는 아주 여리게(pp), 더 느리게(più lento). 곡에서 가장 고요한 곳이에요. 페라이어는 첫 마디만 길게 잡고 나머지는 담백하게 흘려보내요. 굴드는 마디마다 조금씩 더 멈춰 서요.", "pt": "화음이 바뀔 때마다 걸음이 그대로 흐르는지, 점점 멈춰 서는지 느껴 보세요.", "af": ["페라이어의 고요함은 겉의 단맛을 덜어 낸 담백한 쪽이에요. 여기서 조금 더 머물렀으면 하는 아쉬움도 함께 듣는 연주예요. 굴드 자신은 이 녹음을 두고 '길게 이어지는 숨죽인 슬픔'이라고 했어요."], "bars": [["57~64마디", 24, 31]], "a": [150.4, 181.6], "b": [157.1, 195.4], "rng": [57, 64], "sys": [{"img": "img/s4_0.png", "w": 1100, "h": 269, "bars": [[57, 901, 1044]]}, {"img": "img/s4_1.png", "w": 1100, "h": 257, "bars": [[58, 107, 269], [59, 269, 425], [60, 425, 610], [61, 610, 774], [62, 774, 910], [63, 910, 1044]]}, {"img": "img/s4_2.png", "w": 1100, "h": 244, "bars": [[64, 107, 255]]}], "cr": {"src": "이 곡을 짚은 평", "A": "이 곡에서는 조금 더 머물렀으면 슬픔이 더 살았을 거라는 아쉬움이 있어요. 반대로 겉의 단맛을 덜어 내고도 알맞은 정서를 만든다는 칭찬도 있어요. 녹음 2분 34초쯤 작은 잡음이 있다는 지적도 있는데, 바로 이 대목 근처예요.", "B": "굴드 자신은 이 간주곡 녹음을 두고 ‘완전한 내향성, 짧게 터지는 아픔, 그리고 길게 이어지는 숨죽인 슬픔’이라고 했어요.", "chk": "숫자와 맞아요. 같은 8마디에 페라이어 24초, 굴드 31초. ‘덜 머무는 페라이어’가 여기서 가장 크게 보여요.", "v": "yes"}, "bl0": "57~64마디"}, {"t": "처음 주제로 돌아오는 길", "bl": "69~77마디", "ex": "크게 부풀었다가 점점 느려지고(rit.), '원래 빠르기로'(a tempo)라는 지시와 함께 첫 주제가 돌아와요. 페라이어는 부푼 정점을 법석 없이 지나 보내고 곧장 원래 걸음으로 돌아와요. 굴드는 돌아오기를 주저하듯 첫 음들을 오래 붙잡아요.", "pt": "첫 주제가 돌아오는 첫 마디가 곧장 이어지는지, 한참 붙잡히는지 느껴 보세요.", "af": ["페라이어는 아름다운 소리에 듣는 사람을 오래 잠기게 두지 않는 엄격함이 있다는 평을 들어요. 정점도, 돌아오는 길도 그 엄격함으로 지나가요."], "bars": [["돌아온 첫 마디 (76마디)", 3.6, 6.9]], "a": [190.2, 213.2], "b": [206.5, 243.5], "rng": [69, 77], "sys": [{"img": "img/s5_0.png", "w": 1100, "h": 230, "bars": [[69, 107, 306], [70, 306, 501], [71, 501, 691], [72, 691, 891], [73, 891, 1044]]}, {"img": "img/s5_1.png", "w": 1100, "h": 258, "bars": [[74, 107, 300], [75, 300, 474], [76, 474, 604], [77, 604, 729]]}], "cr": {"src": "작품 118 전체 평에서", "A": "곡의 정점을 별다른 법석 없이 지나가게 두어 기대를 살짝 비껴간다는 평이 있어요. 아름다운 소리에 듣는 이를 완전히 잠기게 두지 않는 엄격함이 있다는 말도 붙어요.", "B": "이 대목을 따로 다룬 평은 없어요. 느린 템포와 즉흥처럼 들리는 분위기라는 일반 평이 이곳에서 가장 길게 들려요.", "chk": "숫자와 맞아요. 65~75마디에 페라이어 26초, 굴드 39초. 돌아온 첫 마디는 3.6초 대 6.9초예요.", "v": "yes"}, "bl0": "69~77마디"}, {"t": "같은 주제, 처음과 돌아왔을 때", "bl": "76~83마디 (처음 1~8마디와 같은 선율)", "ex": "이 대목은 곡의 처음 여덟 마디와 같은 선율이에요. 페라이어는 처음과 거의 같은 걸음, 같은 결로 다시 노래해요. 굴드는 같은 선율을 처음보다 훨씬 천천히 끌고 가서, 돌아온 뒤의 다른 마음으로 쳐요.", "pt": "1번 대목의 첫 선율과 견주어, 같은 노래가 처음처럼 오는지 다른 마음으로 오는지 느껴 보세요.", "af": ["페라이어는 같은 노래를 같은 노래로 되풀이하고, 굴드는 돌아온 노래에 다른 무게를 실어요. 굴드는 이 녹음에 브람스 녹음에서 들어 보지 못한 즉흥의 분위기를 담았다고 스스로 말했어요."], "bars": [["돌아와서 (76~83마디)", 20.3, 26.5]], "a": [207.1, 228.5], "b": [233.1, 260.8], "rng": [76, 83], "sys": [{"img": "img/s6_0.png", "w": 1100, "h": 258, "bars": [[76, 475, 604], [77, 604, 730], [78, 730, 886], [79, 886, 1044]]}, {"img": "img/s6_1.png", "w": 1100, "h": 237, "bars": [[80, 107, 284], [81, 284, 404], [82, 404, 566], [83, 566, 735]]}], "cr": {"src": "일반 평에서", "A": "이 대목을 따로 다룬 평은 없어요. 작은 곡마다 꼼꼼히 들여다보면서도 즉흥처럼 자연스러운 흐름을 만든다는 일반 평이 있어요.", "B": "굴드는 이 녹음에 ‘브람스 녹음에서 들어 보지 못한 즉흥의 분위기’를 담았다고 스스로 말했어요.", "chk": "숫자로 보면 페라이어는 처음과 돌아와서가 거의 같고(21.4초, 20.3초), 굴드는 돌아와서 40% 가까이 느려요(19.0초 → 26.5초).", "v": "yes"}, "bl0": "76~83마디 (처음 1~8마디와 같은 선율)"}, {"t": "마지막: 여기서는 둘이 비슷해요", "bl": "110~116마디", "ex": "곡의 끝은 다시 느려지며(più lento) 조용히 닫혀요. 앞에서 그렇게 달랐던 두 사람이 여기서는 나란히 걸어요.", "pt": "마지막 화음이 사라질 때까지의 여운을 느껴 보세요.", "af": ["둘의 차이는 곡 전체에 퍼져 있지 않고, 가운데 고요한 화음과 돌아오는 길에 모여 있어요. 이 대목을 따로 다룬 평은 없어요."], "bars": [["마지막 4마디", 15.7, 16.5]], "a": [284.5, 310.4], "b": [318.6, 346.9], "rng": [110, 116], "sys": [{"img": "img/s7_0.png", "w": 1100, "h": 252, "bars": [[110, 107, 277], [111, 277, 411], [112, 411, 544], [113, 544, 694], [114, 694, 835], [115, 835, 987], [116, 987, 1041]]}], "cr": {"src": "", "A": "", "B": "", "chk": "숫자로 보면 끝에서는 둘이 거의 같아요(마지막 네 마 intro": ["1893년 여름, 브람스가 오스트리아 바트 이슐에서 쓴 말년의 피아노 소품이에요. 교향곡과 협주곡을 다 쓴 뒤였고, 완성한 원고를 클라라 슈만에게 보내자 클라라는 ‘작은 크기 안에 감정이 가득하다’고 답했어요. 악보 첫머리에는 안단테 테네라멘테, 걷는 빠르기로 다정하게. 형식은 A-B-A 세 도막이에요."], "critA": "<b>페라이어 (2010).</b> 이 음반은 이듬해 큰 음반상 기악 부문을 받았고, 평단이 가장 자주 쓰는 말은 ‘구조가 또렷한데 자유롭게 들린다’, ‘감정은 있되 감상에 빠지지 않는다’예요. 긴 호흡으로 문장을 그리고, 곡의 정점을 크게 강조하지 않고 담담하게 지나간다는 평도 겹쳐요. 다만 바로 이 곡에서는 평이 갈려요. ‘더 노래했으면 좋겠다’는 쪽과 ‘단맛을 덜어 내서 오히려 깊다’는 쪽이에요.", "critB": "<b>굴드 (1960).</b> 즉흥처럼 들리는, 혼자 치는 듯한 내밀함으로 유명해요. 굴드 자신도 아낀 음반이고, 친구가 ‘자기 자신을 위해 치는데 문을 열어 둔 것 같다’고 했다는 말을 전했어요. 평단은 안쪽 성부, 특히 가운데 부분을 반복할 때 숨은 대선율을 끌어올린다는 점을 자주 꼽아요. 반대로 템포가 무거워 앞으로 가는 힘이 모자란다는 평도 꾸준히 있어요.", "critNote": "아래 일곱 대목에서 이 말들이 실제 소리의 어디에서 들리는지 하나씩 들어 볼게요.", "outro": ["<b>정리.</b> 굴드가 길게 치는 건 전체를 느리게 쳐서가 아니라 가운데 끝(찬송가)과 돌아오는 길, 그리고 돌아온 주제에 시간을 몰아 쓰기 때문이에요. 페라이어는 ‘조금 빠르게’, ‘a tempo’ 같은 빠르기 지시를 더 그대로 따르며 문장의 처음과 끝에서만 숨을 줘요.", "평단의 말로 바꾸면 페라이어는 ‘감정은 있되 감상은 없는’ 쪽, 굴드는 ‘문을 열어 둔 채 혼자 치는’ 쪽이에요. 다만 ‘굴드는 느리다’는 통념은 반만 맞아요. 시작과 끝은 오히려 비슷하거나 굴드가 빨라요."], "note": "마디 시간은 악보 MIDI와 녹음을 자동 정렬(DTW)해서 잰 값이라 몇 초 오차가 있을 수 있어요.", "credit": "악보: Mutopia Project (Simrock 1892 판 기반, 퍼블릭 도메인)", "skip": [124], "form": [["A", 1, 48], ["B", 49, 75], ["A′", 76, 116]], "short": ["첫 여덟 마디", "조금 빠르게", "엇갈리는 두 손", "찬송가 화음", "돌아오는 길", "같은 주제 다시", "마지막"], "rec": {"A": "5분 10초", "B": "5분 47초"}, "yt": {"A": "1y4Iz9Y47Xo", "B": "7wjqpCh7a4Y"}, "v0": {"intro": "<p>1893년 여름, 브람스가 오스트리아 바트 이슐에서 쓴 말년의 피아노 소품이에요. 교향곡과 협주곡을 다 쓴 뒤였고, 완성한 원고를 클라라 슈만에게 보내자 클라라는 \"작은 크기 안에 감정이 가득하다\"고 답했어요. 악보 첫머리에는 안단테 테네라멘테, 걷는 빠르기로 다정하게. 형식은 A-B-A 세 도막이에요.</p>", "outro": "<p><b>정리.</b> 페라이어는 감정을 담되 감상에 젖지 않고, 정점과 고요함을 담백하게 지나 보내며 문장을 길게 이어 가요. 굴드는 안쪽에 숨은 선을 끌어올리고, 고요한 화음과 돌아오는 길에서 숨죽인 듯 오래 머물러요. 굴드가 머무는 곳은 가운데에 모여 있고, 시작과 끝은 둘이 거의 같아요.</p>", "credit": "악보: Mutopia Project (Simrock 1892 판 기반, 퍼블릭 도메인)"}}}, IC={"search": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><c function sentences(t){ return t.split(/(?<=[.?!요다)])\s+/).filter(Boolean); }
/* 한 화면에 들어가는 만큼만: 넘치면 문장 단위로 다음 화면으로 */
function measBox(bar,cls){ const m=$('#meas'); m.innerHTML=`<div style="position:relative;height:${$('#stage').clientHeight}px"><div class="scr${bar?' bar':''}"><div class="tcard dglass ${cls||''}"><div class="mb"></div></div></div></div>`; return {card:m.querySelector('.tcard'),mb:m.querySelector('.mb')}; }
function fitsIn(B,html){ B.mb.innerHTML=html+'<div class="more">다음 화면에 이어져요 ›</div>'; return B.card.scrollHeight<=B.card.clientHeight+0.5; }
function paginate(bar,head,blocks,cls){ // blocks: [{p:'문단'}|{pull:'...'}|{raw:'html'}]
  const B=measBox(bar,cls), pages=[]; let cur='';
  const q=blocks.map(b=>({...b}));
  const render=b=>b.p!==undefined?`<p>${b.p}</p>`:b.pull!==undefined?`<div class="pull">${b.pull}</div>`:b.raw;
  while(q.length){ const b=q.shift(); const h=render(b);
    if(fitsIn(B,head+`<div class="txt">${cur+h}</div>`)){ cur+=h; continue; }
    if(b.p!==undefined||b.pull!==undefined){ const key=b.p!==undefined?'p':'pull'; const ss=sentences(b[key]); let take=[];
      for(const s of ss){ const t=[...take,s].join(' '); if(fitsIn(B,head+`<div class="txt">${cur+render({[key]:t})}</div>`)) take.push(s); else break; }
      if(take.length){ cur+=render({[key]:take.join(' ')}); q.unshift({[key]:ss.slice(take.length).join(' ')}); }
      else if(!cur){ cur=h; } else q.unshift(b);
    } else { if(!cur){ cur=h; } else q.unshift(b); }
    pages.push(cur); cur='';
  }
  if(cur) pages.push(cur); return pages; }
function twoHTML(a,b){ return `<div class="two"><div class="c"><span class="tg"><i style="background:var(--t1);color:var(--ink)">A</i>${esc(it.A.s)}</span><p>${a}</p></div><div class="ln"></div><div class="c b"><span class="tg" style="color:var(--b)"><i style="background:var(--b);color:var(--t1)">B</i>${esc(it.B.s)}</span><p>${b}</p></div></div>`; }
function paginate2(bar,head,aText,bText,tail){ // A/B 두 단, 문장 단위로 나눠 담기
  const B=measBox(bar), pages=[]; const qa=sentences(aText), qb=sentences(bText); let tailLeft=tail;
  while(qa.length||qb.length||tailLeft){ let a=[],b=[];
    let moved=true; while(moved){ moved=false;
      if(qa.length&&fitsIn(B,head+twoHTML([...a,qa[0]].join(' '),b.join(' ')))){ a.push(qa.shift()); moved=true; }
      if(qb.length&&fitsIn(B,head+twoHTML(a.join(' '),[...b,qb[0]].join(' ')))){ b.push(qb.shift()); moved=true; } }
    if(!a.length&&!b.length&&(qa.length||qb.length)){ if(qa.length) a.push(qa.shift()); if(qb.length) b.push(qb.shift()); }
    let html=(a.length||b.length)?twoHTML(a.join(' ')||'…',b.join(' ')||'…'):'';
    if(!qa.length&&!qb.length&&tailLeft){ if(!html||fitsIn(B,head+html+tailLeft)){ html+=tailLeft; tailLeft=''; } }
    pages.push(html); }
  return pages; }

function fitScreen(bar,head,pre,fillers,post,cls){ // pre/post 는 꼭, fillers 는 들어가는 만큼, 남는 건 시트로
  const B=measBox(bar,cls); const btn='<button class="morebtn">자세히 ›</button>';
  const H=(f)=>head+pre.join('')+`<div class="txt">${f.join('')}</div>`+post.join('')+btn;
  const ok=html=>{ B.mb.innerHTML=html; return B.card.scrollHeight<=B.card.clientHeight+0.5; };
  const used=[], q=fillers.map(x=>({...x})), rest=[];
  while(q.length){ const b=q.shift(); const h=b.p!==undefined?`<p>${b.p}</p>`:b.raw;
