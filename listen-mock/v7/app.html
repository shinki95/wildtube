const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EASE='cubic-bezier(.2,.8,.2,1)';

const art=(it,w,sq=1)=>`img/yt_${it.id}_${w}${sq?'_sq':''}.jpg`;

const seen={};
/* ---------- 둘러보기 (6판) ---------- */
function duoHTML(it,size){return `<div class="duo" style="width:${size}px;height:${size}px"><img class="a" src="${art(it,'A')}" alt=""><img class="b" src="${art(it,'B')}" alt=""><span class="ab" style="left:8px;background:var(--ink)">A</span><span class="ab" style="right:8px;background:var(--red)">B</span></div>`;}
const comps=[...new Map(D.items.map(it=>[it.por,it])).values()];
const perfs=[]; D.items.forEach(it=>['A','B'].forEach(w=>{ if(!perfs.find(p=>p.s===it[w].s)) perfs.push({s:it[w].s,it,w}); }));
$('#bpage').innerHTML=`<div class="lt">비교 듣기</div>
 <div class="shelf"><div class="sh"><b>바로 비교할 수 있어요</b><span>›</span></div><div class="row">${D.items.map((it,k)=>`<button class="card" data-k="${k}">${duoHTML(it,186)}<b>${esc(it.comp)} ${esc(it.title)}</b><span>${esc(it.A.s)} vs ${esc(it.B.s)}</span></button>`).join('')}</div></div>
 <div class="shelf"><div class="sh"><b>작곡가</b><span>›</span></div><div class="row">${comps.map(it=>`<button class="circ" data-c="${it.por}"><i><img src="img/p_${it.por}.jpg" alt=""></i><b>${esc(it.comp)}</b></button>`).join('')}</div></div>

function rowHTML(it,sub){return `<button class="li" data-id="${it.id}"><span class="th"><img src="${art(it,'A')}" style="left:0" alt=""><img src="${art(it,'B')}" style="right:0" alt=""></span><span><b>${esc(it.comp)} ${esc(it.title)}</b><span>${esc(sub)}</span></span></button>`;}
function sres(q){q=q.trim().toLowerCase(); const r=D.items.filter(it=>!q||[it.comp,it.title,it.A.s,it.B.s].join(' ').toLowerCase().includes(q)); $('#sres').innerHTML=r.map(it=>rowHTML(it,`${it.A.s} vs ${it.B.s}`)).join('')||'<div class="sub0" style="padding:16px 0">찾는 곡이 아직 없어요</div>'; $('#sres').querySelectorAll('.li').forEach(b=>b.onclick=()=>openStory(D.items.find(x=>x.id===b.dataset.id)));}
$('#qi').oninput=e=>sres(e.target.value);
function lib(){ const r=D.items.filter(it=>seen[it.id]); $('#lib').innerHTML=r.map(it=>rowHTML(it,`${seen[it.id]}장까지 봄`)).join('')||'<div class="sub0" style="padding:16px 0">아직 본 스토리가 없어요</div>'; $('#lib').querySelectorAll('.li').forEach(b=>b.onclick=()=>openStory(D.items.find(x=>x.id===b.dataset.id)));}

/* ---------- 스토리 ---------- */
const BR=D.brahms;
let it=null, pages=[], pi=0, P=null; // P = 재생 상태 {who,t,dur,raf,last}
function buildPages(){ pages=[{type:'cover'}]; if(it.id==='brahms-op118-2'){ BR.steps.forEach((s,k)=>{ pages.push({type:'listen',k}); pages.push({type:'diff',k}); }); pages.push({type:'end'}); } else pages.push({type:'soon'}); }
function openStory(x){ it=x; buildPages(); pi=0; const S=$('#story');
  $('#segs').innerHTML=pages.map(()=>'<i><b></b></i>').join('');
  $('#hmini').innerHTML=`<img src="${art(it,'A')}" style="left:0" alt=""><img src="${art(it,'B')}" style="right:0" alt="">`;
  $('#h1').textContent=`${it.comp} ${it.title}`;
  S.style.transition=RM?'none':'transform .5s var(--ease)'; S.style.transform='translateY(0)';
  show(0,0); }
function closeStory(){ stopP(); const S=$('#story'); S.style.transition=RM?'none':'transform .45s var(--ease)'; S.style.transform='translateY(100%)'; seen[it.id]=Math.max(seen[it.id]||0,pi+1); }
$('#sx').onclick=closeStory;
function segFill(){ $('#segs').querySelectorAll('i b').forEach((b,i)=>{ let w=i<pi?1:0; if(i===pi){ const p=pages[pi]; w = p.type==='listen' ? (P&&P.dur?Math.min(1,P.t/P.dur):(P&&P.doneAny?1:0)) : 1; } b.style.width=(w*100)+'%'; }); }
function show(i,dir){ stopP(); pi=Math.max(0,Math.min(pages.length-1,i)); const p=pages[pi], pg=$('#pg');
  const h2 = p.type==='listen'||p.type==='diff' ? `${p.k+1} / ${BR.steps.length} 단계` : (p.type==='cover'?`${it.A.s} vs ${it.B.s}`:'정리');
  $('#h2').textContent=h2;
  $('#sbg').style.backgroundImage=`url(${art(it, p.type==='diff'||p.type==='end'?'B':'A')})`;
  pg.innerHTML = p.type==='cover'?coverHTML(): p.type==='listen'?listenHTML(p.k): p.type==='diff'?diffHTML(p.k): p.type==='end'?endHTML(): soonHTML();
  if(dir && !RM) anim(pg,[{transform:`translateX(${dir*40}px)`,opacity:0},{transform:'none',opacity:1}],{duration:380,fill:'none'});
  P = p.type==='listen' ? {who:null,t:0,dur:0,doneAny:false,heard:{}} : null;
  if(p.type==='listen') initListen(p.k); if(p.type==='diff') animDiff(); if(p.type==='cover') animCover(); if(p.type==='end') initEnd();
  segFill(); seen[it.id]=Math.max(seen[it.id]||0,pi+1); }
/* 곡 지도: 지금 구간만 빨강 */
function mapHTML(rng){ const T=BR.total, l=(rng[0]-1)/T*100, w=Math.max(1.5,(rng[1]-rng[0]+1)/T*100);
  return `<div class="map"><em>곡 전체</em><span>${rng[0]}~${rng[1]}마디 / ${T}</span><div class="tr"></div>${BR.steps.map(s=>`<div class="st" style="left:${(s.rng[0]-1)/T*100}%;width:${(s.rng[1]-s.rng[0]+1)/T*100}%"></div>`).join('')}<div class="cur" style="left:${l}%;width:${w}%"></div></div>`; }
/* 표지 장 */
function coverHTML(){ return `<div class="cv"><div class="stack"><div class="ca"><img src="${art(it,'A')}" alt="A 음반"><span class="tg" style="background:#fff;color:var(--ink)">A</span></div><div class="cb"><img src="${art(it,'B')}" alt="B 음반"><span class="tg" style="background:var(--red)">B</span></div></div>
  <h1>${esc(it.comp)} ${esc(it.title)}</h1><div class="vs">${esc(it.A.s)} vs ${esc(it.B.s)}</div><div class="q">${esc(it.q)}</div></div><div class="tapnext">오른쪽을 눌러 시작 ›</div>`; }
function animCover(){ anim($('.cv .ca'),[{transform:'translate(40px,30px) rotateY(14deg) rotateZ(-3deg) scale(.85)',opacity:0},{transform:'rotateY(14deg) rotateZ(-3deg)',opacity:1}],{delay:120,duration:600});
  anim($('.cv .cb'),[{transform:'translate(-40px,-30px) rotateY(-14deg) rotateZ(3deg) scale(.85)',opacity:0},{transform:'rotateY(-14deg) rotateZ(3deg)',opacity:1}],{delay:220,duration:600}); }
function soonHTML(){ return `<div class="en"><div class="k">준비 중</div><h2>이 곡은 단계별 스토리를 만들고 있어요.</h2><div class="bt"><button class="big glass" id="eb2">다른 곡</button><span></span></div></div>`; }
/* 듣기 장 */
function idxToBar(i){ return i<56 ? i+1 : i-7; } // 49~56마디 반복을 녹음 순서대로
function perfPos(bt,tAbs){ if(tAbs<bt[0]){ const beat=(bt[1]-bt[0])/3, p0=bt[0]-beat; return tAbs<p0?null:-1+(tAbs-p0)/beat; } for(let i=0;i<bt.length-1;i++) if(bt[i]<=tAbs&&tAbs<bt[i+1]) return i+(tAbs-bt[i])/(bt[i+1]-bt[i]); return null; }
function locate(k,pos){ if(pos===null) return null; const s=BR.steps[k]; let n,f;
  if(pos<0){ n=0; f=pos+1; } else { const i=Math.floor(pos); n=idxToBar(i); f=pos-i; }
  if(RM) f=0;
  for(let j=0;j<s.sys.length;j++){ const b=s.sys[j].bars.find(b=>b[0]===n); if(b) return {sys:j, x:(b[1]+f*(b[2]-b[1]))/s.sys[j].w*100, x0:s.sys[j].bars[0][1]/s.sys[j].w*100, n}; }
  return {sys:-1,n}; }
function laneHTML(k,w){ const s=BR.steps[k], c=w==='A'?'#1c1c1e':'#fa2d48', ar=s.sys[0].h/s.sys[0].w*100;
  return `<div class="lane" id="ln${w}" style="--c:${c}"><div class="lh"><span><i>${w}</i>${esc(it[w].s)}</span><span class="clk" id="c${w}">0:00.0 · ${s.rng[0]}마디</span></div>
   <div class="sc" id="sc${w}" style="padding-top:${ar}%">${s.sys.map((y,j)=>`<img src="${y.img}" class="${j?'':'on'}" data-j="${j}" alt="악보">`).join('')}<div class="done" id="d${w}"></div><div class="hd" id="hd${w}"></div></div></div>`; }
function listenHTML(k){ const s=BR.steps[k];
  return `${mapHTML(s.rng)}<div class="lt2"><h2>${esc(s.t)}</h2><p>${esc(s.pt)}</p></div>
   <div class="vid" id="vid"><img id="va" src="${art(it,'A',0)}" alt="A 영상 자리"><img id="vb" src="${art(it,'B',0)}" alt="B 영상 자리" style="opacity:0"><span class="yt">▶ YouTube</span><span class="who" id="vw">A ${esc(it.A.s)}</span></div>
   <div class="lanes">${laneHTML(k,'A')}${laneHTML(k,'B')}</div>
   <button class="sw glass" id="sw">${IC.swap}<span id="swt">같은 자리에서 B로</span></button>
   <div class="btns"><button class="big glass a" id="bA"><span class="k" style="background:#fff;color:var(--ink)">A</span><span id="tA">${IC.play}</span></button><button class="big glass b" id="bB"><span class="k" style="background:var(--red);color:#fff">B</span><span id="tB">${IC.play}</span></button></div>
   <div class="hint glass" id="hint"></div>`; }
function initListen(k){ $('#bA').onclick=()=>toggle('A'); $('#bB').onclick=()=>toggle('B'); $('#sw').onclick=swapSame; draw(); }
const clip=(k,w)=>{ const s=BR.steps[k]; return w==='A'?s.a:s.b; };
function drawLane(w,t,solid){ const k=pages[pi].k, c=clip(k,w), bt=w==='A'?BR.btA:BR.btB, end=c[1]-c[0], tt=Math.min(t,end);
  const L=locate(k, t>0?perfPos(bt,c[0]+tt):null), sc=$('#sc'+w); if(!sc) return;
  $('#c'+w).textContent=`${f1(tt)} · ${L&&L.n!==undefined?(L.n===0?'못갖춘마디':L.n+'마디'):BR.steps[k].rng[0]+'마디'}`;
  $('#ln'+w).classList.toggle('on',solid); $('#ln'+w).classList.toggle('ghost',!solid&&t>0);
  if(!L||L.sys<0){ sc.classList.remove('live'); $('#d'+w).style.width='0'; return; }
  sc.querySelectorAll('img').forEach(im=>im.classList.toggle('on',+im.dataset.j===L.sys));
  $('#d'+w).style.left=L.x0+'%'; $('#d'+w).style.width=Math.max(0,L.x-L.x0)+'%'; $('#hd'+w).style.left=L.x+'%'; sc.classList.add('live'); }
function draw(){ if(!P) return; const t=P.t, w=P.who; drawLane('A',t,w==='A'); drawLane('B',t,w==='B');
  ['A','B'].forEach(x=>{ $('#t'+x).innerHTML = P.who===x&&P.raf?IC.pause:IC.play; $('#b'+x).classList.toggle('on',P.who===x&&!!P.raf); });
  const play=!!P.raf; $('#sw').classList.toggle('on',play); if(play) $('#swt').textContent=`같은 자리에서 ${P.who==='A'?'B':'A'}로`;
  $('#va').style.opacity=P.who==='B'?0:1; $('#vb').style.opacity=P.who==='B'?1:0; $('#vw').textContent=P.who==='B'?`B ${it.B.s}`:`A ${it.A.s}`; segFill(); }
function toggle(w){ if(P.who===w&&P.raf){ pauseP(); return; } if(P.who!==w){ P.t=0; } P.who=w; const c=clip(pages[pi].k,w); P.dur=c[1]-c[0]; if(P.t>=P.dur) P.t=0; runP(); }
function runP(){ cancelAnimationFrame(P.raf); P.last=performance.now(); const f=()=>{ const n=performance.now(); P.t+=(n-P.last)/1000; P.last=n; if(P.t>=P.dur){ P.t=P.dur; P.raf=0; P.heard[P.who]=1; P.doneAny=true; draw(); finished(); return; } draw(); P.raf=requestAnimationFrame(f); }; P.raf=requestAnimationFrame(f); draw(); }
function pauseP(){ if(P&&P.raf){ cancelAnimationFrame(P.raf); P.raf=0; draw(); } }
function stopP(){ if(P&&P.raf){ cancelAnimationFrame(P.raf); P.raf=0; } }
function swapSame(){ const k=pages[pi].k, from=P.who, to=from==='A'?'B':'A', cf=clip(k,from), ct=clip(k,to);
  const pos=perfPos(from==='A'?BR.btA:BR.btB, cf[0]+P.t); let tAbs=ct[0];
  if(pos!==null && pos>=0){ const bt=to==='A'?BR.btA:BR.btB, i=Math.floor(pos), f=pos-i; tAbs=bt[i]+f*(bt[i+1]-bt[i]); }
  P.who=to; P.dur=ct[1]-ct[0]; P.t=Math.max(0,Math.min(P.dur-0.1,tAbs-ct[0])); runP(); }
function finished(){ const h=$('#hint'); if(!h) return; h.textContent = P.heard.A&&P.heard.B ? '오른쪽을 눌러 차이 보기 ›' : `${P.heard.A?'B':'A'}도 들어 보세요`; h.classList.add('on'); }
/* 차이 장 */
function diffHTML(k){ const s=BR.steps[k], [lab,a,b]=s.bar, m=Math.max(a,b), dec=!Number.isInteger(a)||!Number.isInteger(b);
  return `${mapHTML(s.rng)}<div class="df"><div class="k">${esc(s.t)} · ${esc(lab)}</div><div class="bars">
   <div class="rc"><div class="ph"><img src="${art(it,'A')}" alt=""></div><div class="v" data-v="${a}" data-d="${dec?1:0}">${dec?a.toFixed(1):a}<small>초</small></div><div class="who">A ${esc(it.A.s)}</div><div class="br" style="height:${a/m*48}%;background:#fff"></div></div>
   <div class="rc"><div class="ph"><img src="${art(it,'B')}" alt=""></div><div class="v" data-v="${b}" data-d="${dec?1:0}" style="color:#ff6b80">${dec?b.toFixed(1):b}<small>초</small></div><div class="who">B ${esc(it.B.s)}</div><div class="br" style="height:${b/m*48}%;background:var(--red)"></div></div></div>
   <div class="cc"><span>${esc(s.cc)}</span></div><div style="height:40px"></div></div>`; }
function animDiff(){ document.querySelectorAll('.df .br').forEach((x,i)=>anim(x,[{transform:'scaleY(0)'},{transform:'none'}],{delay:250+i*140,duration:650}));
  document.querySelectorAll('.df .v').forEach((v,i)=>{ if(RM) return; const tg=+v.dataset.v, d=+v.dataset.d, t0=performance.now()+250+i*140; const f=()=>{ const p=Math.min(1,Math.max(0,(performance.now()-t0)/650)); v.firstChild.textContent=(tg*(1-Math.pow(1-p,3))).toFixed(d); if(p<1&&document.body.contains(v)) requestAnimationFrame(f); }; requestAnimationFrame(f); });
  anim($('.df .cc span'),[{transform:'translateY(110%)'},{transform:'none'}],{delay:800,duration:450}); }
/* 끝 장: 곡 전체 A/B 빠르기 곡선 */
function endHTML(){ const A=BR.btA, B=BR.btB, n=Math.min(A.length,B.length)-1, W=340, H=150;
  const spb=bt=>{ const r=[]; for(let i=0;i<n;i++){ const s=[]; for(let j=Math.max(0,i-2);j<=Math.min(n-1,i+2);j++) s.push(bt[j+1]-bt[j]); r.push(s.reduce((a,b)=>a+b,0)/s.length); } return r; };
  const a=spb(A), b=spb(B), mx=Math.max(...a,...b)*1.05, mn=Math.min(...a,...b)*0.9;
  const path=v=>v.map((y,i)=>`${i?'L':'M'}${(i/(n-1)*W).toFixed(1)},${(H-(y-mn)/(mx-mn)*H).toFixed(1)}`).join(' ');
  const marks=BR.steps.map(s=>{ const i0=A.findIndex(t=>t>=s.a[0]), i1=A.findIndex(t=>t>=s.a[1]); return `<rect x="${i0/(n-1)*W}" y="0" width="${Math.max(2,(i1-i0)/(n-1)*W)}" height="${H}" fill="rgba(255,255,255,.08)"/>`; }).join('');
  return `<div class="en"><div class="k">정리</div><h2>${esc(BR.end)}</h2>
   <div class="curve glass"><div class="lg"><span><b style="background:#fff"></b>A ${esc(it.A.s)}</span><span><b style="background:var(--red)"></b>B ${esc(it.B.s)}</span><span style="opacity:.7;margin-left:auto">마디당 초 · 위가 느림</span></div>
   <svg viewBox="0 -6 ${W} ${H+12}" aria-label="곡 전체 마디당 시간">${marks}<path d="${path(a)}" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" class="pa"/><path d="${path(b)}" fill="none" stroke="#fa2d48" stroke-width="2.6" stroke-linejoin="round" class="pb"/></svg>
   <div style="display:flex;justify-content:space-between;font-size:13px;opacity:.7;margin-top:2px"><span>처음</span><span>가운데</span><span>끝</span></div></div>
   <div class="bt"><button class="big glass" id="eb1">처음으로</button><button class="big glass" id="eb2">다른 곡</button></div></div>`; }
function initEnd(){ $('#eb1').onclick=()=>show(0,-1); $('#eb2').onclick=closeStory; document.querySelectorAll('.curve path').forEach((p,i)=>{ const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=RM?0:L; anim(p,[{strokeDashoffset:L},{strokeDashoffset:0}],{delay:300+i*200,duration:1200}); }); }
document.addEventListener('click',e=>{ if(e.target.closest('#eb2')&&pages[pi]&&pages[pi].type==='soon') closeStory(); });
/* 스토리 손짓: 왼/오 탭, 길게 눌러 멈춤, 아래로 끌어 닫기 */
let g=null; const ST=$('#story');
ST.addEventListener('pointerdown',e=>{ if(e.target.closest('#sx')) return; g={x:e.clientX,y:e.clientY,t:performance.now(),held:false,drag:false,ex:!!e.target.closest('button,.lane,.vid,.curve')};
  g.timer=setTimeout(()=>{ if(g&&!g.drag){ g.held=true; g.wasPlaying=!!(P&&P.raf); pauseP(); ST.classList.add('held'); } },320); });
addEventListener('pointermove',e=>{ if(!g) return; const dy=e.clientY-g.y, dx=e.clientX-g.x; if(!g.drag && dy>12 && Math.abs(dy)>Math.abs(dx)){ g.drag=true; clearTimeout(g.timer); ST.style.transition='none'; }
  if(g.drag){ ST.style.transform=`translateY(${Math.max(0,dy)}px) scale(${1-Math.min(.08,dy/3000)})`; ST.style.borderRadius='18px'; } });
addEventListener('pointerup',e=>{ if(!g) return; clearTimeout(g.timer); const G=g; g=null; ST.classList.remove('held');
  if(G.drag){ const dy=e.clientY-G.y; ST.style.borderRadius='0'; if(dy>120) closeStory(); else { ST.style.transition='transform .35s var(--ease)'; ST.style.transform='translateY(0)'; } return; }
  if(G.held){ if(G.wasPlaying) runP(); return; }
  if(G.ex) return;
  const r=$('#app').getBoundingClientRect(); if(e.clientX-r.left < r.width*0.3) show(pi-1,-1); else { if(pi<pages.length-1) show(pi+1,1); } });
/* 시험 손잡이 */
window.__t={ open:k=>openStory(D.items[k||0]), go:i=>show(i,0), play:w=>toggle(w), at:(w,t)=>{ P.who=w; const c=clip(pages[pi].k,w); P.dur=c[1]-c[0]; P.t=t; stopP(); draw(); }, state:()=>({pi,type:pages[pi].type,who:P&&P.who,t:P&&+P.t.toFixed(2),playing:!!(P&&P.raf)}) };
</script></body></html>
