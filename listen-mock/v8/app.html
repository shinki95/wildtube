<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>비교 듣기 · 8판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&display=swap">
<style>
:root{--red:#fa2d48;--gred:#c8102e;--ink:#1c1c1e;--sub:#8a8a8e;--line:#e5e5ea;--fill:#f2f2f7;--ease:cubic-bezier(.2,.8,.2,1);
--font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Apple SD Gothic Neo','Pretendard',sans-serif;--serif:'Noto Serif KR',serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#d9d6d0}
body{font-family:var(--font);color:var(--ink);word-break:keep-all;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
#app{position:relative;width:100%;max-width:430px;height:100dvh;max-height:932px;background:#fff;overflow:hidden;overflow:clip}
.view{position:absolute;inset:0;overflow:hidden;background:#fff}
.hide{visibility:hidden;pointer-events:none}
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
/* ---- 둘러보기 (6판 그대로) ---- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;z-index:40;display:flex;justify-content:space-around;padding:4px 8px 22px;background:rgba(250,250,252,.78);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-top:.5px solid rgba(0,0,0,.12)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#9a9a9e;min-height:48px}
.tabbar button.on{color:var(--red)}
.page{position:absolute;inset:0;padding-bottom:90px}
.lt{padding:46px 20px 4px;font-size:34px;font-weight:800;letter-spacing:-.02em}
.sub0{padding:0 20px;font-size:16px;color:var(--sub)}
.shelf{margin-top:14px}
.sh{display:flex;justify-content:space-between;align-items:center;padding:0 20px;height:30px}
.sh b{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sh span{font-size:22px;color:var(--sub)}
.row{display:flex;gap:14px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:10px 20px 4px;scrollbar-width:none;scroll-padding:0 20px}
.row::-webkit-scrollbar{display:none}
.card{flex:none;width:186px;scroll-snap-align:start;text-align:left}
.duo{position:relative;border-radius:12px;overflow:hidden;background:#111;box-shadow:0 10px 24px -12px rgba(0,0,0,.55)}
.duo img{position:absolute;top:0;height:100%;object-fit:cover}
.duo img.a{left:0;width:62%}
.duo img.b{right:0;clip-path:polygon(38% 0,100% 0,100% 100%,0 100%);width:76%}
.duo .ab{position:absolute;bottom:8px;width:24px;height:24px;border-radius:6px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff}
.card b{display:block;font-size:16px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:block;font-size:16px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circ{flex:none;width:84px;text-align:center;scroll-snap-align:start}
.circ i{display:block;width:84px;height:84px;border-radius:50%;overflow:hidden;background:#ddd;box-shadow:0 4px 14px -8px rgba(0,0,0,.5)}
.circ img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.circ b{display:block;font-size:16px;font-weight:500;margin-top:7px}
.sbox{margin:6px 20px 0;height:44px;border-radius:12px;background:var(--fill);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--sub)}
.sbox input{flex:1;border:0;background:none;font:16px var(--font);outline:none;color:var(--ink);height:44px}
.list{padding:8px 20px}
.li{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.li .th{width:52px;height:52px;border-radius:8px;overflow:hidden;flex:none;position:relative}
.li .th img{position:absolute;top:0;height:100%;width:60%;object-fit:cover}
.li b{display:block;font-size:16px;font-weight:600}
.li span{display:block;font-size:15px;color:var(--sub)}

/* ---- 레슨 ---- */
#ls{position:absolute;inset:0;z-index:60;color:#fff;transform:translateY(100%);background:#000;overflow:hidden;overflow:clip}
#ls .bg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(34px) saturate(1.4) brightness(.45);transform:scale(1.1)}
.glass{background:rgba(255,255,255,.14);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 26px -12px rgba(0,0,0,.6)}
.top{position:absolute;left:0;right:0;top:0;z-index:6;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.35));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:.5px solid rgba(255,255,255,.15)}
.hd{height:48px;display:flex;align-items:center;gap:6px;padding:0 6px}
.hd button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.hd .tt{flex:1;text-align:center;font-size:15px;font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:44px}
.nav{padding:0 16px 8px}
.nmap{position:relative;height:10px;margin:2px 6px 0}
.nmap .tr{position:absolute;left:0;right:0;top:3px;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
.nmap i{position:absolute;top:2px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:background .3s}
.nmap i.on{background:var(--red);box-shadow:0 0 8px rgba(250,45,72,.8)}
.ncon{height:14px;margin:0 6px}
.ncon svg{width:100%;height:14px}
.nums{display:flex;justify-content:space-between}
.nums button{width:44px;height:44px;border-radius:50%;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .3s var(--ease),transform .3s var(--ease),color .3s}
.nums button.on{background:var(--red);border-color:var(--red);box-shadow:0 6px 18px -6px rgba(250,45,72,.9);transform:scale(1.06)}
.nums button.seen:not(.on){color:#ffb3be}
.pname{display:flex;align-items:center;gap:4px;margin-top:6px;min-height:52px}
.pname button{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.pname button[disabled]{opacity:.3}
.pname div{flex:1;text-align:center;font-size:19px;font-weight:800;letter-spacing:-.015em;line-height:1.25}
.pname div small{display:block;font-size:14px;font-weight:500;opacity:.7;margin-top:2px}
.body{position:absolute;left:0;right:0;bottom:0;z-index:2}
.pgx{padding:14px 12px 150px}
/* 매거진 종이 */
.paper{background:#fbfaf7;color:#1a1a1a;border-radius:16px;padding:20px 20px 22px;box-shadow:0 18px 40px -22px rgba(0,0,0,.8);margin-bottom:14px}
.kick{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--gred);text-transform:uppercase}
.kick.w{color:#ff8a9b}
.paper h3{font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.3;margin-top:6px;letter-spacing:-.01em}
.prose p{font-family:var(--serif);font-size:17px;line-height:1.75;margin-top:12px;color:#222}
.pull{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.6;margin-top:16px;padding:4px 0 4px 14px;border-left:3px solid var(--gred);color:#111}
.rule{height:0;border-top:1px solid #1a1a1a;margin:16px 0 0}
.two{display:grid;grid-template-columns:1fr 1px 1fr;margin-top:12px;border-top:2px solid #1a1a1a;border-bottom:1px solid #1a1a1a}
.two .ln{background:#1a1a1a}
.two .c{padding:12px 10px 14px 0}
.two .c.b{padding:12px 0 14px 12px}
.two .c .tg{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800}
.two .c .tg i{font-style:normal;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.two .c p{font-family:var(--serif);font-size:16px;line-height:1.7;margin-top:6px;color:#222}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:16px;line-height:1.55}
.chk b{flex:none;font-size:13px;font-weight:800;padding:3px 8px;border-radius:6px;color:#fff;margin-top:2px}
.note,.prose p.note{font-family:var(--font);font-size:13px;color:#777;margin-top:12px;line-height:1.5}
.prose p.none{font-size:16px;color:#555}
.tbl{margin-top:14px}
.tbl .r{margin-top:12px}
.tbl .k{font-size:15px;font-weight:700}
.tbl .row{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:15px;font-variant-numeric:tabular-nums}
.tbl .row span{width:18px;font-weight:800}
.tbl .row i{display:block;height:12px;border-radius:6px;transform-origin:left;transition:transform .7s var(--ease)}
.tbl .row em{font-style:normal;font-weight:700;min-width:48px}
.none{font-family:var(--serif);font-size:16px;color:#555;margin-top:10px}
/* 표지 */
.cv{display:flex;flex-direction:column;align-items:center;padding:16px 12px 22px;perspective:900px}
.cv .stack{position:relative;width:280px;height:236px}
.cv .ca,.cv .cb{position:absolute;width:186px;height:186px;border-radius:14px;overflow:hidden;box-shadow:0 26px 50px -18px rgba(0,0,0,.85)}
.cv .ca{left:0;top:0;transform:rotateY(14deg) rotateZ(-3deg)}
.cv .cb{right:0;bottom:0;transform:rotateY(-14deg) rotateZ(3deg)}
.cv img{width:100%;height:100%;object-fit:cover}
.cv .tg{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:8px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cv h1{font-size:32px;font-weight:800;letter-spacing:-.025em;margin-top:24px;text-align:center}
.cv .vs{font-size:20px;color:#ff6b80;font-weight:600;margin-top:4px}
.cv .q{font-size:18px;font-weight:600;line-height:1.45;text-align:center;margin-top:14px;opacity:.92}
.go{width:100%;height:56px;border-radius:16px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
/* 들어 보기 */
.lsn{margin-bottom:14px}
.lsn .kick{padding:2px 6px 8px}
.vid{position:relative;width:316px;aspect-ratio:16/9;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 18px 36px -16px rgba(0,0,0,.8)}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s var(--ease)}
.vid .yt{position:absolute;left:8px;bottom:6px;font-size:12px;font-weight:700;background:rgba(0,0,0,.55);padding:3px 7px;border-radius:6px}
.vid .who{position:absolute;right:8px;top:8px;font-size:12px;font-weight:800;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.55)}
.lanes{margin:12px 0 0}
.lane{background:#fbfaf7;border-radius:14px;padding:6px 6px 4px;color:var(--ink);margin-bottom:8px;box-shadow:0 12px 28px -16px rgba(0,0,0,.7);border:2px solid transparent;transition:border-color .3s var(--ease)}
.lane.on{border-color:var(--c)}
.lh{display:flex;justify-content:space-between;align-items:center;font-size:15px;height:24px;font-weight:600;padding:0 4px}
.lh i{font-style:normal;display:inline-flex;width:20px;height:20px;border-radius:6px;background:var(--c);color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center;margin-right:6px}
.lh .clk{color:var(--c);font-variant-numeric:tabular-nums}
.sc{position:relative}
.sc img{position:absolute;left:0;top:0;width:100%;transition:opacity .35s var(--ease);opacity:0}
.sc img.on{opacity:1}
.sc .done{position:absolute;top:8%;bottom:8%;left:0;background:var(--c);opacity:.12;border-radius:3px}
.sc .hdl{position:absolute;top:2%;bottom:2%;width:4px;margin-left:-2px;background:var(--c);border-radius:2px;opacity:0;transition:opacity .25s}
.sc.live .hdl{opacity:1}
.lane.ghost .sc .hdl{opacity:0}
.lane.ghost .sc.live .hdl{opacity:.45;background:repeating-linear-gradient(180deg,var(--c) 0 6px,transparent 6px 10px)}
.lane.ghost .sc .done{opacity:.05}
.sw{height:44px;margin:2px auto 8px;padding:0 16px;border-radius:22px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;opacity:.35;transition:opacity .3s}
.sw.on{opacity:1}
.abtn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:700;transition:transform .25s var(--ease),background .3s}
.big:active{transform:scale(.96)}
.big .k{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.big.on{background:rgba(255,255,255,.92);color:var(--ink)}
.big.b.on{color:var(--red)}
/* 접힌 플레이어 바 */
.pbar{position:absolute;left:8px;right:8px;bottom:10px;z-index:8;border-radius:20px;padding:8px;display:flex;gap:10px;align-items:stretch;transform:translateY(140%);transition:transform .45s var(--ease);background:rgba(30,30,32,.72)}
.pbar.on{transform:none}
.pbar .pv{position:relative;width:204px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;flex:none}
.pbar .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.pbar .pv span{position:absolute;left:6px;bottom:5px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:5px}
.pbar .pr{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.pbar .ab2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pbar .ab2 button{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:16px}
.pbar .ab2 button.on{background:rgba(255,255,255,.92);color:var(--ink)}
.pbar .ab2 button.b.on{color:var(--red)}
.pbar .st{font-size:14px;font-weight:600;text-align:center;opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar .sw2{height:44px;border-radius:14px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;opacity:.4}
.pbar .sw2.on{opacity:1}
.next{width:100%;min-height:60px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px;font-weight:700;text-align:left;margin-top:4px}
.next span{opacity:.7;font-weight:500;font-size:14px;display:block}
/* 끝 장 */
.curve{border-radius:16px;padding:12px 12px 10px;margin-bottom:14px}
.curve .lg{display:flex;gap:14px;font-size:14px;margin-bottom:4px;flex-wrap:wrap}
.curve .lg b{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.curve svg.cv2{width:100%;height:auto}
.endbt{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head><body><div id="app">
<section class="view" id="browse"><div class="page scroll" id="bpage"></div></section>
<section class="view hide" id="search"><div class="page"><div class="lt">검색</div><label class="sbox"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/></svg><input id="qi" placeholder="작곡가, 곡, 연주자" aria-label="검색"></label><div class="list scroll" id="sres" style="max-height:600px"></div></div></section>
<section class="view hide" id="library"><div class="page"><div class="lt">내 목록</div><div class="sub0">끝까지 본 스토리</div><div class="list" id="lib"></div></div></section>
<nav class="tabbar" id="tabs"><button class="on" data-v="browse"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z" fill="#fff"/></svg>둘러보기</button><button data-v="search"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/></svg>검색</button><button data-v="library"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="7" width="16" height="13" rx="2.5"/><path d="M6.5 4h11"/></svg>내 목록</button></nav>

<section id="ls" aria-label="비교 레슨"><div class="bg" id="lbg"></div>
  <div class="top" id="top"><div class="hd"><button id="lx" aria-label="닫기"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="tt" id="ltt"></div></div>
    <div class="nav"><div class="nmap" id="nmap"></div><div class="ncon" id="ncon"></div><div class="nums" id="nums"></div>
      <div class="pname"><button id="pv" aria-label="이전 포인트"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div id="pnm"></div><button id="nx" aria-label="다음 포인트"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div></div></div>
  <div class="body scroll" id="body"></div>
  <div class="pbar glass" id="pbar"><div class="pv"><img id="pva" alt="A 영상 자리"><img id="pvb" alt="B 영상 자리" style="opacity:0"><span>▶ YouTube</span></div>
    <div class="pr"><div class="ab2"><button class="glass a" id="qA" aria-label="A 듣기">A <span id="qAi"></span></button><button class="glass b" id="qB" aria-label="B 듣기">B <span id="qBi"></span></button></div>
      <div class="st" id="qst">A·B 고르면 재생</div><button class="sw2 glass" id="qsw"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg><span id="qswt">같은 자리</span></button></div></div>
</section>
</div>
<script>
const D={"items": [{"id": "brahms-op118-2", "por": "brahms", "title": "인터메초 118-2", "comp": "브람스", "q": "굴드가 37초 더 길어요. 어디서 시간을 쓸까요?", "A": {"s": "페라이어", "y": 2010}, "B": {"s": "굴드", "y": 1960}}, {"id": "chopin-nocturne-20", "por": "chopin", "title": "녹턴 20번", "comp": "쇼팽", "q": "임윤찬이 34초쯤 더 길어요. 어디서 시간을 쓸까요?", "A": {"s": "조성진", "y": 2017}, "B": {"s": "임윤찬", "y": 2023}}, {"id": "bach-goldberg-aria", "por": "bach", "title": "골드베르크 아리아", "comp": "바흐", "q": "26년 뒤 같은 아리아가 71초 길어졌어요.", "A": {"s": "굴드", "y": 1955}, "B": {"s": "굴드", "y": 1981}}, {"id": "debussy-clair-de-lune", "por": "debussy", "title": "달빛", "comp": "드뷔시", "q": "조성진이 15초 더 길어요. 어디서 시간을 쓸까요?", "A": {"s": "기제킹", "y": 1953}, "B": {"s": "조성진", "y": 2017}}, {"id": "chopin-prelude-15", "por": "chopin", "title": "전주곡 ‘빗방울’", "comp": "쇼팽", "q": "조성진이 44초 더 길어요. 어디서 시간을 쓸까요?", "A": {"s": "조성진", "y": 2015}, "B": {"s": "폴리니", "y": 1974}}, {"id": "schumann-traumerei", "por": "schumann", "title": "트로이메라이", "comp": "슈만", "q": "꿈꾸듯 느린 호로비츠가 오히려 29초 짧아요.", "A": {"s": "호로비츠", "y": 1986}, "B": {"s": "아르헤리치", "y": 1983}}], "brahms": {"steps": [{"t": "처음 여덟 마디", "bl": "1~8마디", "ex": "곡은 세 음짜리 짧은 동기로 시작해요. 한 음 내려갔다가 위로 올라가는 이 작은 몸짓이 곡 전체의 씨앗이고, 뒤에서 계속 모양을 바꿔 돌아와요.", "pt": "첫 두 마디를 어떻게 꺼내는지 들어 보세요. 망설이며 시작하는지, 바로 흘러가는지.", "af": ["첫 두 마디에 페라이어는 5.5초, 굴드는 4.0초를 써요. ‘느리고 무거운 굴드’라는 평과 달리 시작은 굴드가 더 빨라요. 8마디 문장 끝에서는 둘 다 숨을 쉬어요(3.6초, 3.2초).", "처음 48마디 전체도 118초 대 122초로 거의 같아요. 그러니 37초는 아직 나오지 않았어요."], "bars": [["첫 두 마디", 5.5, 4.0], ["1~48마디", 118, 122]], "a": [0, 24], "b": [0, 21], "rng": [1, 8], "sys": [{"img": "img/s1_0.png", "w": 1100, "h": 236, "bars": [[0, 250, 293], [1, 293, 426], [2, 426, 589], [3, 589, 755], [4, 755, 909], [5, 909, 1044]]}, {"img": "img/s1_1.png", "w": 1100, "h": 229, "bars": [[6, 107, 308], [7, 308, 460], [8, 460, 592], [9, 593, 710], [10, 710, 873]]}], "cr": {"src": "음반 전체 평에서", "A": "이 음반의 페라이어는 앞으로 흘러가는 빠른 브람스라는 평을 들어요. 감정은 담되 감상에 젖지 않고, 문장을 긴 호흡으로 그린다는 말이 자주 붙어요.", "B": "굴드의 브람스 간주곡에는 대체로 템포가 느리고 무겁다는 평이 따라다녀요.", "chk": "숫자는 반대예요. 첫 두 마디는 페라이어 5.5초, 굴드 4.0초로 굴드가 더 빨라요. ‘빠른 페라이어, 느린 굴드’는 이 시작에는 맞지 않아요.", "v": "no"}}, {"t": "‘조금 빠르게’라고 쓴 곳", "bl": "38~48마디", "ex": "38마디에 cresc. un poco animato, ‘점점 크게, 조금 활기 있게’라고 적혀 있어요. 그리고 45마디에서 rit.(점점 느리게)로 브레이크를 걸고, 46마디 più lento(더 느리게)로 넘어가요.", "pt": "‘조금 빠르게’에서 정말 걸음이 빨라지는지, 그리고 브레이크를 어디서부터 거는지 들어 보세요.", "af": ["38~44마디에 페라이어 14.6초, 굴드 17.6초. 페라이어는 지시대로 실제로 빨라지고, 굴드는 거의 빨라지지 않아요. 그런데 45~48마디 브레이크 구간은 15.7초 대 15.8초로 똑같아요. 굴드는 빨라졌다 느려지는 굴곡을 작게, 페라이어는 크게 그려요. 굴드에게 ‘앞으로 가는 힘이 모자란다’는 평이 나오는 곳이 이런 자리예요."], "bars": [["38~44마디 (조금 빠르게)", 14.6, 17.6], ["45~48마디 (느려지기)", 15.7, 15.8]], "a": [89.6, 120.5], "b": [89.2, 123.2], "rng": [38, 48], "sys": [{"img": "img/s2_0.png", "w": 1100, "h": 244, "bars": [[38, 449, 602], [39, 602, 745], [40, 745, 890], [41, 890, 1044]]}, {"img": "img/s2_1.png", "w": 1100, "h": 253, "bars": [[42, 107, 287], [43, 287, 435], [44, 435, 581], [45, 581, 739], [46, 739, 892], [47, 892, 1044]]}, {"img": "img/s2_2.png", "w": 1100, "h": 229, "bars": [[48, 107, 138]]}], "cr": {"src": "곡 전체 평에서", "A": "이 대목을 따로 다룬 평은 없어요. 빠르기의 미세한 변화를 매끄럽게 다룬다는 칭찬은 같은 음반의 다른 곡(헨델 변주곡) 이야기예요.", "B": "템포가 지나치게 무거워 리듬의 추진력이 모자랄 때가 있다는 지적이 있어요.", "chk": "숫자와 맞아요. ‘조금 빠르게’ 구간에 페라이어 14.6초, 굴드 17.6초. 굴드는 거의 빨라지지 않아요.", "v": "yes"}}, {"t": "장조에서 단조로, 엇갈리는 두 손", "bl": "47~56마디", "ex": "가장조가 올림바단조로 어두워지고, 49마디부터 오른손은 한 박을 셋으로, 왼손은 둘로 나눠요. 크기가 다른 톱니바퀴 두 개가 맞물려 도는 것처럼 박의 처음에서만 맞고 그 사이는 계속 어긋나요. 악보에서 위아래 손의 음표 묶음 모양(3 표시)이 다른 걸 보세요.", "pt": "밝던 장조가 어두워지는 순간, 그다음 오른손 셋과 왼손 둘이 서로 다르게 흔들리는 느낌을 들어 보세요. 반복할 때는 오른손 노래 밑에서 움직이는 다른 선도 찾아보세요.", "af": ["이 부분 처음 8마디는 두 사람이 비슷해요(17.9초, 18.9초). 그런데 이 8마디를 반복할 때 굴드만 느려져요(페라이어 19.1초, 굴드 21.9초). 굴드가 시간을 쓰기 시작하는 곳이 여기예요.", "평단이 굴드의 이 녹음에서 자주 꼽는 ‘반복 때 끌어올리는 숨은 대선율’이 바로 이 반복이에요. 느려지는 2.8초는 그 안쪽 선을 들리게 하려고 쓰는 시간으로 들어 볼 수 있어요."], "bars": [["49~56마디 처음", 17.9, 18.9], ["49~56마디 반복", 19.1, 21.9]], "a": [110.0, 139.1], "b": [113.9, 142.8], "rng": [47, 56], "sys": [{"img": "img/s3_0.png", "w": 1100, "h": 253, "bars": [[47, 893, 1044]]}, {"img": "img/s3_1.png", "w": 1100, "h": 229, "bars": [[48, 107, 138], [49, 242, 448], [50, 448, 642], [51, 642, 835], [52, 835, 1044]]}, {"img": "img/s3_2.png", "w": 1100, "h": 269, "bars": [[53, 107, 309], [54, 309, 490], [55, 490, 684], [56, 684, 901]]}], "cr": {"src": "이 대목을 짚은 평", "A": "이 대목을 따로 다룬 평은 없어요. 세부를 하나하나 드러내면서도 문장을 길게 잇는다는 일반 평이 이곳의 담담한 반복과 이어져요.", "B": "가운데 부분을 반복할 때 오른손 노래 밑의 대선율을 끌어올린다는 평이 있어요. 주제가 단조로 다시 나올 때도 그 선이 살아 있고, 안쪽 성부를 도드라지게 한다는 말이 함께 붙어요.", "chk": "숫자와 맞아요. 반복에서 굴드만 2.8초 느려져요(19.1초 대 21.9초). 숨은 선을 들려주려고 쓰는 시간으로 들을 수 있어요.", "v": "yes"}}, {"t": "57마디, 찬송가 같은 화음", "bl": "57~64마디", "ex": "어두운 단조가 57마디에서 올림바장조로 풀리며 찬송가처럼 조용한 화음이 나와요. 악보에는 pp(아주 여리게), 그리고 più lento(더 느리게). 곡에서 가장 고요한 곳이에요.", "pt": "마디가 지날수록 걸음이 어떻게 바뀌는지 들어 보세요. 일정하게 흐르는지, 점점 멈춰 서는지.", "af": ["같은 8마디에 페라이어 24초, 굴드 31초. 굴드는 마디마다 조금씩 더 느려져서 한 마디 3초 남짓이 끝으로 가면 4초를 넘어요. 페라이어는 첫 마디만 길게 잡고 나머지는 거의 일정하게 흘러가요. ‘혼자 치는 듯한 내밀함’이 숫자로 보이는 곳이에요."], "bars": [["57~64마디", 24, 31]], "a": [150.4, 181.6], "b": [157.1, 195.4], "rng": [57, 64], "sys": [{"img": "img/s4_0.png", "w": 1100, "h": 269, "bars": [[57, 901, 1044]]}, {"img": "img/s4_1.png", "w": 1100, "h": 257, "bars": [[58, 107, 269], [59, 269, 425], [60, 425, 610], [61, 610, 774], [62, 774, 910], [63, 910, 1044]]}, {"img": "img/s4_2.png", "w": 1100, "h": 244, "bars": [[64, 107, 255]]}], "cr": {"src": "이 곡을 짚은 평", "A": "이 곡에서는 조금 더 머물렀으면 슬픔이 더 살았을 거라는 아쉬움이 있어요. 반대로 겉의 단맛을 덜어 내고도 알맞은 정서를 만든다는 칭찬도 있어요. 녹음 2분 34초쯤 작은 잡음이 있다는 지적도 있는데, 바로 이 대목 근처예요.", "B": "굴드 자신은 이 간주곡 녹음을 두고 ‘완전한 내향성, 짧게 터지는 아픔, 그리고 길게 이어지는 숨죽인 슬픔’이라고 했어요.", "chk": "숫자와 맞아요. 같은 8마디에 페라이어 24초, 굴드 31초. ‘덜 머무는 페라이어’가 여기서 가장 크게 보여요.", "v": "yes"}}, {"t": "처음 주제로 돌아오는 길", "bl": "69~77마디", "ex": "69마디쯤 크게 부풀었다가 rit.(점점 느리게), 그리고 76마디 a tempo(원래 빠르기로)에서 첫 주제가 돌아와요. 이 ‘느려졌다가 돌아오기’를 얼마나 하느냐가 두 사람의 가장 큰 차이예요.", "pt": "첫 주제가 돌아오는 첫 마디를 잘 들어 보세요. 바로 원래 걸음으로 돌아오는지, 한참 붙잡는지.", "af": ["65~75마디에 페라이어 26초, 굴드 39초. 돌아온 첫 마디(76마디)는 페라이어 3.6초, 굴드 6.9초로 거의 두 배예요. 페라이어는 a tempo 지시대로 바로 돌아오고, 굴드는 돌아오기를 주저하듯 첫 음들을 오래 붙잡아요. 페라이어가 ‘정점을 담담하게 지나간다’는 평도 이 자리에서 확인돼요."], "bars": [["65~75마디", 26, 39], ["76마디", 3.6, 6.9]], "a": [190.2, 213.2], "b": [206.5, 243.5], "rng": [69, 77], "sys": [{"img": "img/s5_0.png", "w": 1100, "h": 230, "bars": [[69, 107, 306], [70, 306, 501], [71, 501, 691], [72, 691, 891], [73, 891, 1044]]}, {"img": "img/s5_1.png", "w": 1100, "h": 258, "bars": [[74, 107, 300], [75, 300, 474], [76, 474, 604], [77, 604, 729]]}], "cr": {"src": "작품 118 전체 평에서", "A": "곡의 정점을 별다른 법석 없이 지나가게 두어 기대를 살짝 비껴간다는 평이 있어요. 아름다운 소리에 듣는 이를 완전히 잠기게 두지 않는 엄격함이 있다는 말도 붙어요.", "B": "이 대목을 따로 다룬 평은 없어요. 느린 템포와 즉흥처럼 들리는 분위기라는 일반 평이 이곳에서 가장 길게 들려요.", "chk": "숫자와 맞아요. 65~75마디에 페라이어 26초, 굴드 39초. 돌아온 첫 마디는 3.6초 대 6.9초예요.", "v": "yes"}}, {"t": "같은 주제, 처음과 돌아왔을 때", "bl": "76~83마디 (처음 1~8마디와 같은 선율)", "ex": "76마디부터는 곡의 처음 여덟 마디와 같은 선율이에요. 이번에는 두 사람을 비교하는 것과 함께, 각자가 처음 칠 때와 돌아와서 칠 때가 같은지 들어 보세요. 1번 파트를 다시 들어도 좋아요.", "pt": "같은 선율인데 처음보다 무겁게 가는지, 처음처럼 가는지.", "af": ["페라이어는 처음 21.4초, 돌아와서 20.3초로 거의 같은 걸음이에요. 굴드는 처음 19.0초였는데 돌아와서는 26.5초, 40% 가까이 느려요. 같은 선율을 굴드는 ‘돌아온 뒤의 다른 마음’으로, 페라이어는 ‘같은 노래의 반복’으로 쳐요. 그다음 8마디(84~91)는 둘 다 17초대로 다시 같아져요."], "bars": [["처음 1~8마디", 21.4, 19.0], ["돌아와서 76~83마디", 20.3, 26.5]], "a": [207.1, 228.5], "b": [233.1, 260.8], "rng": [76, 83], "sys": [{"img": "img/s6_0.png", "w": 1100, "h": 258, "bars": [[76, 475, 604], [77, 604, 730], [78, 730, 886], [79, 886, 1044]]}, {"img": "img/s6_1.png", "w": 1100, "h": 237, "bars": [[80, 107, 284], [81, 284, 404], [82, 404, 566], [83, 566, 735]]}], "cr": {"src": "일반 평에서", "A": "이 대목을 따로 다룬 평은 없어요. 작은 곡마다 꼼꼼히 들여다보면서도 즉흥처럼 자연스러운 흐름을 만든다는 일반 평이 있어요.", "B": "굴드는 이 녹음에 ‘브람스 녹음에서 들어 보지 못한 즉흥의 분위기’를 담았다고 스스로 말했어요.", "chk": "숫자로 보면 페라이어는 처음과 돌아와서가 거의 같고(21.4초, 20.3초), 굴드는 돌아와서 40% 가까이 느려요(19.0초 → 26.5초).", "v": "yes"}}, {"t": "마지막: 여기서는 둘이 비슷해요", "bl": "110~116마디", "ex": "곡의 끝은 다시 느려지며(più lento) 조용히 닫혀요. 앞에서 그렇게 달랐던 두 사람이 여기서는 어떤지 들어 보세요.", "pt": "마지막 화음까지의 걸음과 여운.", "af": ["110~116마디는 페라이어 21.8초, 굴드 24.6초, 마지막 네 마디는 15.7초 , 194.79, 197.83, 201.1, 203.59, 206.49, 209.02, 211.87, 215.0, 218.51, 222.98, 227.74, 233.43, 240.37, 243.46, 246.36, 248.88, 252.25, 255.06, 257.54, 259.97, 262.92, 265.26, 266.96, 269.02, 271.27, 272.78, 275.12, 277.37, 279.34, 281.27, 282.87, 284.65, 286.34, 288.73, 291.03, 293.51, 296.46, 298.94, 302.45, 305.02, 307.04, 309.52, 312.37, 314.62, 316.69, 318.85, 321.56, 323.9, 326.9, 329.29, 332.93, 341.91, 343.41], "total": 116, "intro": ["1893년 여름, 브람스가 오스트리아 바트 이슐에서 쓴 말년의 피아노 소품이에요. 교향곡과 협주곡을 다 쓴 뒤였고, 완성한 원고를 클라라 슈만에게 보내자 클라라는 ‘작은 크기 안에 감정이 가득하다’고 답했어요. 악보 첫머리에는 안단테 테네라멘테, 걷는 빠르기로 다정하게. 형식은 A-B-A 세 도막이에요."], "critA": "<b>페라이어 (2010).</b> 이 음반은 이듬해 큰 음반상 기악 부문을 받았고, 평단이 가장 자주 쓰는 말은 ‘구조가 또렷한데 자유롭게 들린다’, ‘감정은 있되 감상에 빠지지 않는다’예요. 긴 호흡으로 문장을 그리고, 곡의 정점을 크게 강조하지 않고 담담하게 지나간다는 평도 겹쳐요. 다만 바로 이 곡에서는 평이 갈려요. ‘더 노래했으면 좋겠다’는 쪽과 ‘단맛을 덜어 내서 오히려 깊다’는 쪽이에요.", "critB": "<b>굴드 (1960).</b> 즉흥처럼 들리는, 혼자 치는 듯한 내밀함으로 유명해요. 굴드 자신도 아낀 음반이고, 친구가 ‘자기 자신을 위해 치는데 문을 열어 둔 것 같다’고 했다는 말을 전했어요. 평단은 안쪽 성부, 특히 가운데 부분을 반복할 때 숨은 대선율을 끌어올린다는 점을 자주 꼽아요. 반대로 템포가 무거워 앞으로 가는 힘이 모자란다는 평도 꾸준히 있어요.", "critNote": "아래에서 이 평들이 실제 소리에서 어디에 해당하는지 마디 시간으로 확인해 볼게요.", "outro": ["<b>정리.</b> 굴드가 길게 치는 건 전체를 느리게 쳐서가 아니라 가운데 끝(찬송가)과 돌아오는 길, 그리고 돌아온 주제에 시간을 몰아 쓰기 때문이에요. 페라이어는 ‘조금 빠르게’, ‘a tempo’ 같은 빠르기 지시를 더 그대로 따르며 문장의 처음과 끝에서만 숨을 줘요.", "평단의 말로 바꾸면 페라이어는 ‘감정은 있되 감상은 없는’ 쪽, 굴드는 ‘문을 열어 둔 채 혼자 치는’ 쪽이에요. 다만 ‘굴드는 느리다’는 통념은 반만 맞아요. 시작과 끝은 오히려 비슷하거나 굴드가 빨라요."], "note": "마디 시간은 악보 MIDI와 녹음을 자동 정렬(DTW)해서 잰 값이라 몇 초 오차가 있을 수 있어요.", "credit": "악보: Mutopia Project (Simrock 1892 판 기반, 퍼블릭 도메인)"}}, IC={"search": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"10.5\" cy=\"10.5\" r=\"7\"/><path d=\"M16 16l5 5\"/></svg>", "searchS": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap
