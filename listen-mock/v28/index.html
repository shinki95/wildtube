<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>비교 듣기 · 28판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Gowun+Batang:wght@400;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1ede6;--ink:#1d1c1a;--sub:#6b665e;--line:#ddd6ca;--a:#1f3a5f;--b:#9a4a2a;--tint:#6d5a44;--tintbg:#efe8dc;
--serif:"Cormorant Garamond","Gowun Batang",serif;--kr:"Gowun Batang",serif;--script:"Pinyon Script",cursive;
--sys:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.6 var(--kr);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.top{position:fixed;z-index:50;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;font:600 11px/1 var(--sys);letter-spacing:.16em;mix-blend-mode:difference;color:#fff;pointer-events:none}
.top a{pointer-events:auto;text-decoration:none;min-height:36px;display:flex;align-items:center}
/* 장면 공통 */
.stage{position:relative;height:100vh;height:100svh;overflow:hidden;perspective:1400px}
.layer{position:absolute;pointer-events:none}
.big{font:600 clamp(44px,13.5vw,118px)/.88 var(--serif);letter-spacing:.02em;text-transform:uppercase;margin:0}
.big small{display:block;font-size:.3em;letter-spacing:.14em;margin-top:.6em}
.scr{font:clamp(30px,9vw,66px)/1.1 var(--script);color:#8a6a46;margin:.25em 0 0 14%;transform:rotate(-6deg)}
.kick{font:600 11px/1 var(--sys);letter-spacing:.28em;color:var(--sub);margin-bottom:16px;text-transform:uppercase}
/* 표지 */
.hero-t{left:0;right:0;top:17svh;text-align:center;padding:0 16px}
.hero-t .sub{font:16px/1.5 var(--kr);color:var(--sub);margin-top:22px}
.skip{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);font:600 13px/1 var(--sys);text-decoration:none;border-bottom:1px solid;padding-bottom:3px;z-index:5}
.st{left:22px;right:22px;top:20svh;opacity:0}
.st p{font:700 clamp(23px,6.3vw,40px)/1.42 var(--kr);margin:0;max-width:13em}
.objw{position:absolute;left:50%;top:64%;width:0;height:0;transform-style:preserve-3d}
.obj{position:absolute;transform-style:preserve-3d;will-change:transform}
.vinyl{width:min(78vw,440px);aspect-ratio:1;border-radius:50%;position:absolute;left:0;top:0;transform:translate(-50%,-50%);box-shadow:0 40px 60px -20px rgba(0,0,0,.45)}
.disc{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#121212 0 1.2px,#1d1d1d 1.6px 2.8px);animation:spin 5s linear infinite}
.disc.stop{animation-play-state:paused}
.lbl{position:absolute;inset:33%;border-radius:50%;background:var(--lc,#e9dcc3);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:600 clamp(9px,2.4vw,13px)/1.25 var(--serif);letter-spacing:.12em;color:#2b1f14;text-transform:uppercase}
.lbl b{font-size:1.45em;letter-spacing:.06em}
.lbl::after{content:"";width:7%;aspect-ratio:1;border-radius:50%;background:#111;position:absolute}
.lbl span{position:relative;top:-14%}.lbl i{position:relative;top:14%;font-style:normal}
.sheen{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.16) 12%,transparent 18% 50%,rgba(255,255,255,.12) 58%,transparent 64%);pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.macro{position:absolute;inset:0;opacity:0;overflow:hidden;background:#111}
.m-lp{position:absolute;inset:0;background:repeating-radial-gradient(circle at -60% 50%,#0f0f0f 0 3px,#222 4px 7px,#151515 8px 10px)}
.m-lp::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%)}
.cap2{left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#fff;opacity:0;padding:0 20px}
.cap2 .e{font:600 clamp(28px,8vw,64px)/1 var(--serif);letter-spacing:.16em;text-transform:uppercase}
.cap2 .k{font:16px/1.5 var(--kr);margin-top:14px;opacity:.9}
.cap3{left:0;right:0;bottom:14svh;text-align:center;opacity:0}
.cap3 p{font:700 clamp(23px,6.4vw,40px)/1.35 var(--kr);margin:0}
.shelfS{position:absolute;inset:0;background:#1d1c1a;color:#f1ede6;padding:calc(env(safe-area-inset-top) + 70px) 20px 20px;opacity:0;display:flex;flex-direction:column;justify-content:center}
.shelfS h3{font:600 11px/1 var(--sys);letter-spacing:.24em;color:#a59d8f;margin:0 0 18px}
.rrow{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid #3a3733}
.rrow .cv{width:78px;height:78px;flex:none;background-size:cover;background-position:center;border-radius:2px;box-shadow:0 14px 26px -12px rgba(0,0,0,.6)}
.rrow .lt{font:600 11px/1 var(--sys);letter-spacing:.18em;color:#a59d8f}
.rrow .nm{font:600 26px/1.05 var(--serif);margin:4px 0 4px}
.rrow .fl{font:15px/1.45 var(--kr);color:#d9d2c6}
.badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font:700 11px/1 var(--sys);color:#fff;margin-right:6px;vertical-align:1px}
/* 글 장면 */
.tstage{background:var(--bg)}
.tx{position:absolute;left:22px;right:22px;top:16svh;opacity:0}
.tx p{font:clamp(20px,5.6vw,30px)/1.6 var(--kr);margin:0;max-width:20em}
.tx h4{font:600 11px/1 var(--sys);letter-spacing:.24em;color:var(--sub);margin:0 0 14px;text-transform:uppercase}
.tx .who{font:600 clamp(28px,8vw,48px)/1 var(--serif);margin:0 0 14px}
.qm{position:absolute;right:-2vw;bottom:-8svh;font:600 60vw/1 var(--serif);color:rgba(0,0,0,.05);pointer-events:none}
/* 대목 장면 */
.cstage{background:var(--bg)}
.ch-n{position:absolute;left:18px;top:calc(env(safe-area-inset-top) + 46px);font:600 clamp(80px,26vw,190px)/.8 var(--serif);color:rgba(29,28,26,.08);pointer-events:none}
.ctop{position:absolute;left:22px;right:22px;top:15svh}
.ctit{opacity:0}
.ctit .k2{font:600 11px/1 var(--sys);letter-spacing:.24em;color:var(--sub)}
.ctit h2{font:700 clamp(28px,7.6vw,46px)/1.25 var(--kr);margin:10px 0 6px}
.ctit .bl{font:600 13px/1 var(--sys);color:var(--sub)}
.form{display:flex;height:22px;margin-top:16px;border-radius:2px;overflow:hidden;position:relative;max-width:520px}
.form div{border-right:2px solid var(--bg);background:#d8d0c2;font:600 10px/22px var(--sys);color:#6b665e;padding-left:6px;white-space:nowrap;overflow:hidden}
.form .hl{position:absolute;top:-4px;bottom:-4px;border:2px solid var(--ink);border-radius:3px;background:rgba(29,28,26,.1)}
.sent{position:absolute;left:0;right:0;top:0;opacity:0}
.sent p{font:clamp(20px,5.5vw,29px)/1.6 var(--kr);margin:0;max-width:20em}
.sent.pt p{font-style:italic;padding-left:14px;border-left:3px solid #c9b48f}
.sent.pt h4{font:600 11px/1 var(--sys);letter-spacing:.24em;color:var(--sub);margin:0 0 12px}
.sframe{position:absolute;left:4vw;right:4vw;bottom:calc(env(safe-area-inset-bottom) + 4svh);height:40svh;perspective:900px;overflow:hidden;border-radius:3px}
.sheet{position:absolute;left:0;top:0;width:100%;transform-origin:0 0;background:#fbf8f1;box-shadow:0 30px 50px -24px rgba(40,25,10,.5)}
.sheet img{display:block;width:100%;mix-blend-mode:multiply}
/* 듣기 판 */
.deck{position:relative;z-index:2;background:var(--tintbg);transition:background .8s;padding:64px 18px 46px}
.deck .dh{font:600 11px/1 var(--sys);letter-spacing:.24em;color:var(--sub);text-transform:uppercase}
.deck .dt{font:700 22px/1.3 var(--kr);margin:8px 0 4px}
.deck .dp{font:15px/1.5 var(--kr);color:#4e4a43;margin:0 0 16px}
.shelf{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.sp{flex:none;width:86px;scroll-snap-align:start;text-align:left}
.sp .cv{width:86px;height:86px;background-size:cover;background-position:center;border-radius:2px;box-shadow:0 10px 18px -10px rgba(0,0,0,.5);position:relative;transition:transform .3s}
.sp .cv em{position:absolute;left:5px;top:5px;width:22px;height:22px;border-radius:50%;background:var(--rc);color:#fff;font:700 11px/22px var(--sys);text-align:center;font-style:normal}
.sp .nm{font:600 13px/1.2 var(--sys);margin-top:6px}
.sp .yr{font:12px/1.2 var(--sys);color:var(--sub)}
.sp.on .cv{transform:translateY(-6px);box-shadow:0 0 0 3px var(--tintbg),0 0 0 5px var(--rc),0 16px 22px -10px rgba(0,0,0,.5)}
.tt{position:relative;display:flex;align-items:center;gap:16px;margin:14px 0 4px}
.plinth{position:relative;width:min(56vw,300px);aspect-ratio:1.12;border-radius:14px;background:linear-gradient(145deg,#2b2926,#1a1917);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 30px -18px rgba(0,0,0,.6);flex:none}
.plat{position:absolute;left:5%;top:6%;width:80%;aspect-ratio:1;border-radius:50%;background:#0c0c0c;box-shadow:0 0 0 3px #3a3733}
.plat .rec2{position:absolute;inset:2%;border-radius:50%;overflow:hidden}
.plat .lab{position:absolute;inset:34%;border-radius:50%;background:var(--tint);transition:background .6s;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
.plat .lab b{font:700 15px/1 var(--sys)}
.plat .lab span{font:600 9px/1.2 var(--sys);letter-spacing:.06em;margin-top:3px;max-width:80%}
.plat .lab::after{content:"";position:absolute;width:7%;aspect-ratio:1;border-radius:50%;background:#ddd}
.arm{position:absolute;right:4%;top:6%;width:22%;height:78%;transform-origin:70% 8%;transform:rotate(-24deg);transition:transform .7s cubic-bezier(.4,1.4,.5,1)}
.arm.on{transform:rotate(4deg)}
.ctl{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.pb{min-height:56px;border-radius:99px;background:var(--ink);color:#fff;font:600 16px/1 var(--sys);display:flex;align-items:center;justify-content:center;gap:8px}
.now{font:13px/1.4 var(--sys);color:#4e4a43}
.now b{color:var(--ink)}
.hintc{font:12px/1.45 var(--sys);color:var(--sub)}
.score2{position:relative;background:#fbf8f1;padding:8px;border-radius:2px;margin-top:16px}
.score2 img{display:block;width:100%;mix-blend-mode:multiply}
.score2 canvas{position:absolute;left:8px;top:8px;pointer-events:none}
.sleeve{position:relative;width:100%;max-width:420px;aspect-ratio:16/9;background:#000;border-radius:3px;overflow:hidden;margin-top:14px;display:none}
.sleeve.on{display:block}
.sleeve>div{position:absolute;inset:0;visibility:hidden}.sleeve>div.on{visibility:visible}
.sleeve iframe{width:100%;height:100%}
.after{margin-top:20px;border-top:1px solid rgba(0,0,0,.12);padding-top:14px}
.after h4{margin:0 0 8px;font:600 11px/1 var(--sys);letter-spacing:.24em;color:var(--sub)}
.after p{margin:0;font:17px/1.65 var(--kr)}
.after.lock p{filter:blur(5px);user-select:none}
.after .open{font:600 13px/1 var(--sys);text-decoration:underline;margin-top:10px;min-height:40px}
.fly{position:fixed;z-index:80;border-radius:50%;pointer-events:none;background:repeating-radial-gradient(circle,#121212 0 1.2px,#1d1d1d 1.6px 2.8px)}
.fly i{position:absolute;inset:34%;border-radius:50%;background:var(--c)}
/* 마무리 */
.ostage{background:#1d1c1a;color:#f1ede6}
.ostage .tx p{color:#f1ede6}
.ostage .tx h4{color:#a59d8f}
.ovin{position:absolute;left:50%;bottom:-24vw;transform:translateX(-50%);width:110vw;max-width:760px;aspect-ratio:1;opacity:.5}
.others{background:#1d1c1a;color:#f1ede6;padding:30px 18px calc(env(safe-area-inset-bottom) + 60px)}
.others h3{font:600 11px/1 var(--sys);letter-spacing:.24em;color:#a59d8f;margin:0 0 16px}
.og{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oc{display:block;text-decoration:none;background:#2a2826;border-radius:4px;overflow:hidden}
.oc .pair{display:flex;height:86px}.oc .pair div{flex:1;background-size:cover;background-position:center}
.oc .t{font:600 14px/1.3 var(--kr);padding:10px 10px 2px}
.oc .w{font:12px/1.3 var(--sys);color:#a59d8f;padding:0 10px 12px}
.oc.cur{outline:2px solid #f1ede6}
@media (min-width:900px){
  .st,.tx,.ctop{left:8vw;right:52vw}
  .sframe{left:50vw;right:4vw;top:16svh;bottom:12svh;height:auto}
  .objw{top:60%}
  .deck{padding:50px 8vw}
  .deck-in{max-width:820px}
  .og{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="top"><a href="#others">비교 듣기 · 28판</a><span id="ttop"></span></div>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
const $=s=>document.querySelector(s), R='../../';
const qs=new URLSearchParams(location.search); const SID=qs.get('song')||'brahms-op118-2';
const EN={'brahms-op118-2':['Brahms','Intermezzo Op.118 Nº2','teneramente','#e7d3b0'],'chopin-nocturne-20':['Chopin','Nocturne Nº20','con gran espressione','#c9d6e8'],'chopin-nocturne-op9-2':['Chopin','Nocturne Op.9 Nº2','espressivo dolce','#efc9c3'],'chopin-prelude-15':['Chopin','Prelude Op.28 Nº15','sostenuto','#b9cdb5'],'debussy-clair-de-lune':['Debussy','Clair de lune','très expressif','#d9d2ec'],'schumann-traumerei':['Schumann','Träumerei','Kinderszenen','#f0dc9a'],'schubert-d899-3':['Schubert','Impromptu D.899 Nº3','Andante','#c4dfe0'],'bach-goldberg-aria':['Bach','Goldberg · Aria','Aria','#e9e4da']};
const strip=h=>h.replace(/<[^>]+>/g,'').trim();
const sents=t=>strip(t).split(/(?<=[.?!])\s+(?=[^\s])/).map(x=>x.trim()).filter(Boolean);
function groups(arr,max=120){ const out=[]; let cur=''; for(const s of arr){ if(cur && (cur+' '+s).length>max){ out.push(cur); cur=s; } else cur=cur?cur+' '+s:s; } if(cur) out.push(cur); return out; }
const yr=f=>(f.match(/\d{4}/)||[''])[0];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L, IDX, RECS=[];
gsap.registerPlugin(ScrollTrigger);

Promise.all([fetch(R+'listen/app/data/index.json').then(r=>r.json()), fetch(R+'listen/app/data/'+SID+'.json').then(r=>r.json()), fetch('data/'+SID+'.recs.json').then(r=>r.ok?r.json():null).catch(()=>null)])
.then(([ix,d,ex])=>{ IDX=ix.songs; L=d; const s=IDX.find(x=>x.id===SID);
  const half=(s.line||'').split(/,\s+/); 
  RECS=[{key:'A',name:d.A.name,full:d.A.full,yt:d.A.yt,cover:d.A.cover,bt:d.bt.A,clips:d.steps.map(x=>x.a),feel:half[0]||'',col:'#1f3a5f'},
        {key:'B',name:d.B.name,full:d.B.full,yt:d.B.yt,cover:d.B.cover,bt:d.bt.B,clips:d.steps.map(x=>x.b),feel:half.slice(1).join(', ')||'',col:'#9a4a2a'}];
  if(ex&&ex.recs) ex.recs.forEach((r,i)=>RECS.push({key:String.fromCharCode(67+i),name:r.name,full:r.full,yt:r.yt,cover:r.cover,bt:r.bt,clips:r.clips,feel:r.feel,col:null}));
  build(s); });

function build(s){ const e=EN[SID]||[L.short,'','','#e7d3b0']; document.title=L.short+' · 비교 듣기'; $('#ttop').textContent=String(s.no).padStart(2,'0')+' / '+String(IDX.length).padStart(2,'0');
  const N=RECS.length; const NW=['','한','두','세','네','다섯','여섯','일곱','여덟'][N]||String(N);
  const intro=groups(L.intro.flatMap(sents),95).slice(0,4);
  let h=`<section class="stage" id="hero">
   <div class="layer hero-t" id="heroT"><div class="kick">Compare · Listen · Nº ${s.no}</div><h1 class="big">${e[0]}<small>${e[1]}</small></h1><div class="scr">${e[2]}</div><div class="sub">같은 악보, ${NW} 연주</div></div>
   ${intro.map((t,i)=>`<div class="layer st" id="st${i}"><p>${esc(t)}</p></div>`).join('')}
   <div class="objw" id="objw"><div class="obj" id="obj"><div class="vinyl"><div class="disc"><div class="lbl" style="--lc:${e[3]}"><span><b>${e[0]}</b></span><i>${e[1]}</i></div></div><div class="sheen"></div></div></div></div>
   <div class="macro" id="macro"><div class="m-lp"></div></div>
   <div class="layer cap2" id="cap2"><div class="e">One score</div><div class="k">같은 악보를</div></div>
   <div class="layer cap3" id="cap3"><p>${NW} 사람이 다르게 쳐요.</p></div>
   <div class="shelfS" id="shelfS"><h3>${NW} 연주</h3>${RECS.map(r=>`<div class="rrow"><div class="cv" style="background-image:url(${R+r.cover})"></div><div><div class="lt"><span class="badge" style="background:${r.col||'#6d5a44'}" data-k="${r.key}">${r.key}</span>${yr(r.full)}</div><div class="nm">${esc(r.name)}</div><div class="fl">${esc(r.feel)}</div></div></div>`).join('')}</div>
   <a class="skip" id="skip" href="#ch0">바로 첫 대목으로 ↓</a></section>`;
  // 평단
  const crit=[]; L.critics.forEach(c=>{ const m=c.match(/^<b>(.*?)<\/b>\s*/); const who=m?strip(m[1]).replace(/\.$/,''):''; const body=m?c.slice(m[0].length):c; groups(sents(body),130).forEach((t,i)=>crit.push({who:i===0?who:'',t})); });
  h+=`<section class="stage tstage" id="crit"><div class="qm">“</div>${crit.map((c,i)=>`<div class="layer tx" id="cr${i}"><h4>평단에서는</h4>${c.who?`<div class="who">${esc(c.who)}</div>`:''}<p>${esc(c.t)}</p></div>`).join('')}</section>`;
  // 대목들
  L.steps.forEach((st,k)=>{ const ex=groups(sents(st.ex),80);
    h+=`<section class="stage cstage" id="ch${k}"><div class="ch-n">${String(k+1).padStart(2,'0')}</div>
     <div class="ctop"><div class="ctit" id="ct${k}"><div class="k2">대목 ${k+1} / ${L.steps.length}</div><h2>${esc(st.t)}</h2><div class="bl">${esc(st.bl)}</div>${formBar(st)}</div>
      ${ex.map((t,i)=>`<div class="sent" id="se${k}_${i}"><p>${esc(t)}</p></div>`).join('')}
      <div class="sent pt" id="sp${k}"><h4>이렇게 들어 보세요</h4><p>${esc(st.pt)}</p></div></div>
     <div class="sframe" id="sf${k}"><div class="sheet" id="sh${k}"><img src="${R+st.img}" alt=""></div></div></section>
     ${deckHTML(st,k)}`; });
  // 마무리
  const outro=groups(L.outro.flatMap(sents),110);
  h+=`<section class="stage ostage" id="outro"><div class="ovin"><div class="vinyl" style="width:100%;left:50%;top:50%;position:absolute"><div class="disc"><div class="lbl" style="--lc:${e[3]}"><span><b>${e[0]}</b></span><i>${e[1]}</i></div></div><div class="sheen"></div></div></div>${outro.map((t,i)=>`<div class="layer tx" id="ou${i}"><h4>정리</h4><p>${esc(t.replace(/^정리\.\s*/,''))}</p></div>`).join('')}</section>
   <section class="others" id="others"><h3>다른 곡</h3><div class="og">${IDX.map(x=>`<a class="oc ${x.id===SID?'cur':''}" href="?song=${x.id}"><div class="pair"><div style="background-image:url(${R+x.cA})"></div><div style="background-image:url(${R+x.cB})"></div></div><div class="t">${esc(x.short)}</div><div class="w">${esc(x.A)} · ${esc(x.B)}</div></a>`).join('')}</div>
   <p style="font:12px/1.5 var(--sys);color:#8b857a;margin-top:22px">${esc(L.credit||'')} · ${esc(L.note||'')}</p></section>`;
  $('#app').innerHTML=h;
  RECS.forEach(r=>coverColor(R+r.cover).then(c=>{ if(!r.col) r.col=c; r.tint=c; document.querySelectorAll(`[data-k="${r.key}"]`).forEach(b=>b.style.background=r.col); document.querySelectorAll(`.sp[data-r="${r.key}"]`).forEach(b=>b.style.setProperty('--rc',r.col)); }));
  anim(intro.length, crit.length, outro.length);
  L.steps.forEach((st,k)=>wireDeck(k));
  addEventListener('load',()=>ScrollTrigger.refresh());
}
function formBar(st){ if(!L.form||!L.total) return ''; const T=L.total; const segs=L.form.map(f=>`<div style="width:${(f[2]-f[1]+1)/T*100}%">${esc(f[0])}</div>`).join('');
  const a=Math.max(1,st.rng[0]), b=Math.min(T,st.rng[1]); return `<div class="form">${segs}<span class="hl" style="left:${(a-1)/T*100}%;width:${Math.max(1.5,(b-a+1)/T*100)}%"></span></div>`; }
function deckHTML(st,k){ return `<section class="deck" id="dk${k}"><div class="deck-in"><div class="dh">듣기 · 대목 ${k+1}</div><div class="dt">${esc(st.t)}</div><p class="dp">음반을 고르면 판이 턴테이블에 올라가요. 듣는 중에 다른 음반을 누르면 같은 마디에서 이어서 바뀌어요.</p>
   <div class="shelf">${RECS.map(r=>`<button class="sp" data-r="${r.key}" data-k="${k}" style="--rc:${r.col||'#6d5a44'}"><div class="cv" style="background-image:url(${R+r.cover})"><em>${r.key}</em></div><div class="nm">${esc(r.name)}</div><div class="yr">${yr(r.full)}</div></button>`).join('')}</div>
   <div class="tt"><div class="plinth"><div class="plat"><div class="rec2"><div class="disc stop" id="dd${k}"></div><div class="lab" id="lb${k}"><b>—</b><span>음반을 고르세요</span></div></div></div>
     <svg class="arm" id="arm${k}" viewBox="0 0 60 200"><circle cx="42" cy="16" r="11" fill="#cfc8bb"/><circle cx="42" cy="16" r="4" fill="#555"/><path d="M42 16 L40 150 L22 178" stroke="#e8e2d6" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="12" y="172" width="18" height="14" rx="2" fill="#cfc8bb" transform="rotate(-30 21 179)"/></svg></div>
    <div class="ctl"><button class="pb" id="pb${k}">▶ A부터 듣기</button><div class="now" id="nw${k}"></div><div class="hintc">악보 위 진한 선이 지금 소리, 옅은 선은 다른 음반이 같은 시각에 있는 자리예요.</div></div></div>
   <div class="score2"><img id="si${k}" src="${R+st.img}" alt="악보 ${esc(st.bl)}"><canvas id="cv${k}"></canvas></div>
   <div class="sleeve" id="sl${k}"></div>
   <div class="after lock" id="af${k}"><h4>들은 뒤</h4><p>${esc(st.after.join(' '))}</p><button class="open" data-k="${k}">먼저 읽기</button></div></div></section>`; }

/* ---------- 움직임 ---------- */
function anim(nI,nC,nO){
  // 표지 + 소개 + 접사 + 음반 줄
  const tl=gsap.timeline({defaults:{ease:'power2.inOut'},scrollTrigger:{trigger:'#hero',start:'top top',end:'+='+((nI+4)*75)+'%',scrub:.8,pin:true,snap:{snapTo:'labelsDirectional',duration:{min:.25,max:.8},delay:.05,ease:'power2.inOut'}}});
  const obj='#obj'; gsap.set(obj,{rotationX:58,rotationZ:-8,scale:.9,y:'6vh'});
  gsap.to('#objw',{y:-10,duration:2.6,yoyo:true,repeat:-1,ease:'sine.inOut'});
  tl.addLabel('s0',0).to('#heroT',{y:'-22vh',opacity:0,duration:.8},0).to('#skip',{opacity:0,duration:.3},0)
    .to(obj,{x:'26vw',y:'4vh',rotationX:18,rotationZ:-28,scale:.66,duration:1},0);
  for(let i=0;i<nI;i++){ const t=i+1; if(i>0) tl.to('#st'+(i-1),{opacity:0,y:-40,duration:.35},t-.55); tl.fromTo('#st'+i,{opacity:0,y:46},{opacity:1,y:0,duration:.45},t-.45).addLabel('i'+i,t); if(i>0) tl.to(obj,{rotationZ:-28-i*25,duration:.8},t-.6); }
  const m=nI+1; tl.to('#st'+(nI-1),{opacity:0,y:-50,duration:.35},m-.95)
    .to(obj,{x:0,y:0,rotationX:0,rotationZ:-90,scale:6,duration:.9,ease:'power3.in'},m-.95)
    .fromTo('#macro',{opacity:0,scale:1.15},{opacity:1,scale:1,duration:.4,ease:'power1.out'},m-.35).set(obj,{opacity:0},m)
    .fromTo('#cap2',{opacity:0,letterSpacing:'.5em'},{opacity:1,letterSpacing:'0em',duration:.35},m-.2).addLabel('m',m+.1)
    .to('#cap2',{opacity:0,duration:.25},m+.25).fromTo('#macro',{clipPath:'circle(110% at 50% 42%)'},{clipPath:'circle(27% at 50% 40%)',duration:.8},m+.25)
    .fromTo('#cap3',{opacity:0,y:30},{opacity:1,y:0,duration:.4},m+.7).addLabel('c',m+1.15)
    .to('#cap3',{opacity:0,duration:.3},m+1.25).to('#macro',{clipPath:'circle(0% at 50% 40%)',duration:.45,ease:'power2.in'},m+1.25)
    .fromTo('#shelfS',{opacity:0},{opacity:1,duration:.3},m+1.55)
    .fromTo('#shelfS .rrow',{x:'110vw'},{x:0,stagger:.12,duration:.6,ease:'power3.out'},m+1.6).addLabel('sh',m+2.5).to({}, {duration:.3});
  // 글 장면(평단, 마무리)
  textStage('#crit','cr',nC);
  L.steps.forEach((st,k)=>chapter(k));
  textStage('#outro','ou',nO);
}
function textStage(sel,pre,n){ const tl=gsap.timeline({defaults:{ease:'power2.inOut'},scrollTrigger:{trigger:sel,start:'top top',end:'+='+(n*70+30)+'%',scrub:.7,pin:true,snap:{snapTo:'labelsDirectional',duration:{min:.2,max:.7},delay:.05}}});
  for(let i=0;i<n;i++){ if(i>0) tl.to('#'+pre+(i-1),{opacity:0,y:-40,duration:.35},i-.5); tl.fromTo('#'+pre+i,{opacity:0,y:44},{opacity:1,y:0,duration:.45},i-.4).addLabel('t'+i,i); }
  tl.to({}, {duration:.4}); }
function hlBox(st){ let x0=1e9,x1=-1,y0=1e9,y1=-1; (st.sys||[]).forEach(s=>s.bars.forEach(b=>{ if(b[0]>=st.rng[0]&&b[0]<=st.rng[1]){ x0=Math.min(x0,b[1]); x1=Math.max(x1,b[2]); y0=Math.min(y0,s.y0); y1=Math.max(y1,s.y0+s.h); } }));
  if(x1<0) return [0,0,st.W,st.H]; return [x0,y0,x1-x0,y1-y0]; }
function chapter(k){ const st=L.steps[k], ex=document.querySelectorAll(`#ch${k} .sent:not(.pt)`).length, n=ex+2; const sheet='#sh'+k, fr=$('#sf'+k);
  const geo=()=>{ const fw=fr.clientWidth, fh=fr.clientHeight, s0=fw/st.W, ih=st.H*s0; const [bx,by,bw,bh]=hlBox(st); const kk=Math.max(1,Math.min(fw*.96/(bw*s0), fh*.9/(bh*s0), 3.4));
    return {fw,ih,y0:Math.max(0,(fh-ih)/2),tx:fw/2-(bx+bw/2)*s0*kk,ty:fh/2-(by+bh/2)*s0*kk,k:kk}; };
  const tl=gsap.timeline({defaults:{ease:'power2.inOut'},scrollTrigger:{trigger:'#ch'+k,start:'top top',end:'+='+(n*70)+'%',scrub:.7,pin:true,invalidateOnRefresh:true,snap:{snapTo:'labelsDirectional',duration:{min:.2,max:.7},delay:.05}}});
  tl.fromTo(sheet,{x:0,y:()=>geo().y0+40,scale:.92,rotationX:38,rotationZ:-4,opacity:0},{y:()=>geo().y0,scale:1,rotationX:12,rotationZ:-2,opacity:1,duration:.5},0)
    .fromTo('#ct'+k,{opacity:0,y:40},{opacity:1,y:0,duration:.45},0).addLabel('h',.5);
  const all=[...[...Array(ex)].map((_,i)=>'#se'+k+'_'+i),'#sp'+k];
  let prev='#ct'+k;
  all.forEach((id,i)=>{ const t=i+1.4; tl.to(prev,{opacity:0,y:-36,duration:.35},t-.55).fromTo(id,{opacity:0,y:40},{opacity:1,y:0,duration:.45},t-.45).addLabel('e'+i,t); prev=id; });
  tl.to(sheet,{x:()=>geo().tx,y:()=>geo().ty,scale:()=>geo().k,rotationX:0,rotationZ:0,duration:all.length,ease:'power1.inOut'},.9).to({}, {duration:.4});
}
/* ---------- 색 ---------- */
function coverColor(u){ return new Promise(res=>{ const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>{ try{ const c=document.createElement('canvas'); c.width=c.height=32; const g=c.getContext('2d'); g.drawImage(im,0,0,32,32); const d=g.getImageData(0,0,32,32).data; const bins={};
   for(let i=0;i<d.length;i+=4){ const r=d[i],gg=d[i+1],b=d[i+2]; const mx=Math.max(r,gg,b),mn=Math.min(r,gg,b); const v=mx/255, sat=mx?(mx-mn)/mx:0; if(v<.28||v>.96) continue; const key=(r>>5)+','+(gg>>5)+','+(b>>5); const o=bins[key]||(bins[key]={n:0,r:0,g:0,b:0,w:0}); o.n++; o.r+=r; o.g+=gg; o.b+=b; o.w+=.15+sat*sat*2; }
   let best=null,bs=-1; for(const o of Object.values(bins)){ if(o.w>bs){ bs=o.w; best=o; } } if(!best) return res('#6d5a44');
   let [r,gg,b]=[best.r/best.n,best.g/best.n,best.b/best.n]; const lum=.3*r+.59*gg+.11*b; if(lum>165){ const f=150/lum; r*=f; gg*=f; b*=f; } if(lum<75){ r=r*.7+255*.3; gg=gg*.7+255*.3; b=b*.7+255*.3; } res(`rgb(${r|0},${gg|0},${b|0})`); }catch(e){ res('#6d5a44'); } }; im.onerror=()=>res('#6d5a44'); im.src=u; }); }
const soft=c=>{ const m=(c||'').match(/\d+/g); if(!m) return '#efe8dc'; const [r,g,b]=m.map(Number), base=[243,237,228]; const f=(x,i)=>Math.round(x*.24+base[i]*.76); return `rgb(${f(r,0)},${f(g,1)},${f(b,2)})`; };
/* ---------- 듣기 ---------- */
const P={k:null,key:null,playing:false,t:0,raf:0}; let YTP={}, YTk=null, YTready=false, YTq=[];
function ytAPI(cb){ if(YTready) return cb(); YTq.push(cb); if(window._ytl) return; window._ytl=1; window.onYouTubeIframeAPIReady=()=>{ YTready=true; YTq.splice(0).forEach(f=>f()); }; const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); }
function players(k,cb){ if(YTk===k) return cb(); Object.values(YTP).forEach(p=>{ try{p.destroy();}catch(e){} }); YTP={}; document.querySelectorAll('.sleeve').forEach(s=>{ s.innerHTML=''; s.classList.remove('on'); });
  YTk=k; const sl=$('#sl'+k); sl.classList.add('on'); RECS.forEach(r=>{ const w=document.createElement('div'); w.id=`yw${k}_${r.key}`; const inner=document.createElement('div'); inner.id=`yp${k}_${r.key}`; w.appendChild(inner); sl.appendChild(w); });
  ytAPI(()=>{ RECS.forEach(r=>{ YTP[r.key]=new YT.Player(`yp${k}_${r.key}`,{width:'100%',height:'100%',videoId:r.yt,playerVars:{playsinline:1,rel:0,modestbranding:1,controls:1,start:Math.floor(r.clips[k][0])},events:{onReady:()=>{ YTP[r.key]._ok=true; if(P.wait===r.key){ P.wait=null; go(); } }}}); }); cb(); }); }
const ok=key=>YTP[key]&&YTP[key]._ok;
function rec(key){ return RECS.find(r=>r.key===key); }
function perfPos(bt,t){ if(!bt||t<bt[0]) return null; for(let i=0;i<bt.length-1;i++) if(t<bt[i+1]) return i+(t-bt[i])/(bt[i+1]-bt[i]); return null; }
function mapT(fromKey,toKey,k,tRel){ const a=rec(fromKey), b=rec(toKey); const p=perfPos(a.bt,a.clips[k][0]+tRel); if(p===null) return 0; const i=Math.floor(p), f=p-i; if(!b.bt[i+1]) return 0; return Math.max(0,b.bt[i]+f*(b.bt[i+1]-b.bt[i])-b.clips[k][0]); }
function wireDeck(k){ document.querySelectorAll(`#dk${k} .sp`).forEach(b=>b.onclick=()=>pick(k,b.dataset.r,b));
  $('#pb'+k).onclick=()=>{ if(P.k===k&&P.playing){ pause(); } else pick(k,P.k===k&&P.key?P.key:'A',null,true); };
  $(`#af${k} .open`).onclick=e=>{ $('#af'+k).classList.remove('lock'); e.target.remove(); };
  const im=$('#si'+k); im.onload=()=>draw(k); addEventListener('resize',()=>draw(k)); }
function pick(k,key,btn,resume){ const r=rec(key); let tRel=0;
  if(P.k===k&&P.key&&P.key!==key){ // 같은 마디에서 바꾸기
    let cur=P.t; if(ok(P.key)) try{ cur=Math.max(0,YTP[P.key].getCurrentTime()-rec(P.key).clips[k][0]); }catch(e){} tRel=mapT(P.key,key,k,cur); }
  else if(P.k===k&&P.key===key) tRel=P.t;
  if(P.key&&ok(P.key)&&P.key!==key) try{YTP[P.key].pauseVideo();}catch(e){}
  if(P.k!==null&&P.k!==k) stopUI(P.k);
  flyRecord(k,key,btn); P.k=k; P.key=key; P.t=tRel; P.playing=true; P.ended=false;
  const dk=$('#dk'+k); dk.style.setProperty('--tint',r.tint||r.col); dk.style.setProperty('--tintbg',soft(r.tint||r.col||''));
  $('#lb'+k).innerHTML=`<b>${r.key}</b><span>${esc(r.name)}</span>`; $('#arm'+k).classList.add('on'); $('#dd'+k).classList.remove('stop');
  document.querySelectorAll(`#dk${k} .sp`).forEach(b=>b.classList.toggle('on',b.dataset.r===key));
  $('#pb'+k).textContent='❚❚ 멈춤'; $('#nw'+k).innerHTML=`<b>${r.key} ${esc(r.name)}</b> · ${esc(r.full)}`;
  players(k,()=>{ document.querySelectorAll(`#sl${k}>div`).forEach(w=>w.classList.toggle('on',w.id===`yw${k}_${key}`)); if(ok(key)) go(); else P.wait=key; }); loop(); }
function go(){ const r=rec(P.key), c=r.clips[P.k]; try{ YTP[P.key].seekTo(c[0]+P.t,true); YTP[P.key].playVideo(); }catch(e){} }
function pause(){ if(P.key&&ok(P.key)) try{YTP[P.key].pauseVideo();}catch(e){} P.playing=false; stopUI(P.k); draw(P.k); }
function stopUI(k){ if(k===null) return; $('#arm'+k).classList.remove('on'); $('#dd'+k).classList.add('stop'); $('#pb'+k).textContent='▶ 이어 듣기'; }
function loop(){ cancelAnimationFrame(P.raf); const f=()=>{ if(!P.playing) return; const r=rec(P.key), c=r.clips[P.k];
  if(ok(P.key)){ let st=-1,cur=0; try{ st=YTP[P.key].getPlayerState(); cur=YTP[P.key].getCurrentTime(); }catch(e){}
    if(st===1){ P.t=Math.max(0,cur-c[0]); if(cur>=c[1]-.05){ try{YTP[P.key].pauseVideo();}catch(e){} P.playing=false; P.t=0; stopUI(P.k); $('#pb'+P.k).textContent='▶ 다시 듣기'; const af=$('#af'+P.k); af.classList.remove('lock'); const o=af.querySelector('.open'); if(o) o.remove(); draw(P.k); return; } } }
  draw(P.k); P.raf=requestAnimationFrame(f); }; P.raf=requestAnimationFrame(f); }
function xy(st,pos){ const i=Math.floor(pos), f=pos-i; for(const s of st.sys||[]) for(const b of s.bars) if(b[0]===i) return {x:b[1]+f*(b[2]-b[1]),y0:s.y0,h:s.h}; return null; }
function draw(k){ if(k===null) return; const st=L.steps[k], im=$('#si'+k), cv=$('#cv'+k); if(!im||!im.naturalWidth) return; const w=im.clientWidth,h=im.clientHeight,dpr=devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+'px'; cv.style.height=h+'px'; const g=cv.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,w,h);
  if(P.k!==k||!P.key) return; const kx=w/st.W, cur=rec(P.key), p0=perfPos(cur.bt,cur.clips[k][0]+P.t); 
  RECS.forEach(r=>{ const main=r.key===P.key; let pos; if(main) pos=p0; else pos=perfPos(r.bt,r.clips[k][0]+P.t); if(pos===null||pos===undefined) return; const q=xy(st,pos); if(!q) return;
    g.globalAlpha=main?1:.32; g.fillStyle=r.col||'#555'; g.fillRect(q.x*kx-(main?2:1.5),q.y0*kx,main?4:3,q.h*kx); if(main){ g.globalAlpha=.13; g.fillRect(q.x*kx-26,q.y0*kx,26,q.h*kx); }
    g.globalAlpha=main?1:.6; g.font='600 10px -apple-system,sans-serif'; g.fillText(r.key,q.x*kx+3,q.y0*kx+10); });
  g.globalAlpha=1; }
function flyRecord(k,key,btn){ const r=rec(key); const src=(btn||document.querySelector(`#dk${k} .sp[data-r="${key}"]`)).querySelector('.cv').getBoundingClientRect(); const dst=$(`#dk${k} .plat`).getBoundingClientRect();
  if(src.bottom<0||src.top>innerHeight) return; const f=document.createElement('div'); f.className='fly'; f.style.setProperty('--c',r.tint||r.col||'#6d5a44'); f.innerHTML='<i></i>'; document.body.appendChild(f);
  gsap.fromTo(f,{left:src.left,top:src.top,width:src.width,height:src.height,rotation:0,opacity:1},{left:dst.left,top:dst.top,width:dst.width,height:dst.height,rotation:200,duration:.7,ease:'power3.inOut',onComplete:()=>f.remove()});
  gsap.fromTo(`#dk${k} .rec2`,{scale:.86,opacity:.3},{scale:1,opacity:1,duration:.55,delay:.45,ease:'back.out(2)'}); }
</script>
